- tool: TypeSpecValidation
  reason: >
    TypeSpec Config Incomplete - Missing required emitter options in tspconfig.yaml.
    Responsibility: Spec owner would update missing configurations.
    More info: https://aka.ms/azsdk/spec-gen-sdk-config.
  rules: [SdkTspConfigValidation]
  sub-rules:
    - options.@azure-tools/typespec-go.*
    - options.@azure-tools/typespec-java.*
    - options.@azure-tools/typespec-python.*
    - options.@azure-tools/typespec-ts.*
    - parameters.service-dir.default
    - options.@azure-typespec/http-client-csharp-mgmt.*
  paths:
    - tspconfig.yaml
- tool: Swagger Avocado
  path: ./preview/2025-02-27-preview/sovereign.json
  reason: >
    The landingZoneAccounts, landingZoneConfigurations, and
    landingZoneRegistrations resource types were intentionally retired in the
    2026-10-31-preview API version. This older version still contains them, so
    Avocado reports MISSING_APIS_IN_DEFAULT_TAG against the
    2026-10-31-preview default tag.
