output-dir: "{project-root}/"
emit:
  - "@azure-tools/typespec-autorest"
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
options:
  "@azure-tools/typespec-autorest":
    use-read-only-status-schema: true
    emitter-output-dir: "{project-root}"
    azure-resource-provider-folder: "resource-manager"
    output-file: "{version-status}/{version}/purestorage.json"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
    emit-common-types-schema: "never"
    examples-dir: "{project-root}/examples"
  "@azure-typespec/http-client-csharp-mgmt":
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
    namespace: "Azure.ResourceManager.PureStorageBlock"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/purestorageblock"
    emitter-output-dir: "{output-dir}/{service-dir}/armpurestorageblock"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armpurestorageblock"
    fix-const-stuttering: true
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
    flavor: "azure"
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-purestorageblock"
    namespace: azure.mgmt.purestorageblock
    generate-test: true
    generate-sample: true
    flavor: azure
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-purestorageblock"
    flavor: azure
    namespace: com.azure.resourcemanager.purestorageblock
    service-name: Pure Storage Block
  "@azure-tools/typespec-ts":
    experimental-extensible-enums: true
    emitter-output-dir: "{output-dir}/{service-dir}/arm-purestorageblock"
    flavor: azure
    package-details:
      name: "@azure/arm-purestorageblock"
parameters:
  service-dir:
    default: sdk/purestorageblock
