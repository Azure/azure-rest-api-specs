# Suppressions for advisor service
# These suppressions are needed for existing Swagger versions that haven't been migrated to TypeSpec yet
- tool: TypeSpecRequirement
  path: ./preview/2016-07-12-preview/*.json
  reason: Brownfield service not ready to migrate
- tool: TypeSpecRequirement
  path: ./preview/2020-07-01-preview/*.json
  reason: Brownfield service not ready to migrate
- tool: TypeSpecRequirement
  path: ./preview/2022-02-01-preview/*.json
  reason: Brownfield service not ready to migrate
- tool: TypeSpecRequirement
  path: ./preview/2023-09-01-preview/*.json
  reason: Brownfield service not ready to migrate
- tool: TypeSpecRequirement
  path: ./preview/2024-11-18-preview/*.json
  reason: Brownfield service not ready to migrate
- tool: TypeSpecRequirement
  path: ./stable/2017-03-31/*.json
  reason: Brownfield service not ready to migrate
- tool: TypeSpecRequirement
  path: ./stable/2017-04-19/*.json
  reason: Brownfield service not ready to migrate
- tool: TypeSpecRequirement
  path: ./stable/2020-01-01/*.json
  reason: Brownfield service not ready to migrate
- tool: TypeSpecRequirement
  path: ./stable/2022-09-01/*.json
  reason: Brownfield service not ready to migrate
- tool: TypeSpecRequirement
  path: ./stable/2022-10-01/*.json
  reason: Brownfield service not ready to migrate
- tool: TypeSpecRequirement
  path: ./stable/2023-01-01/*.json
  reason: Brownfield service not ready to migrate
- tool: TypeSpecRequirement
  path: ./stable/2025-01-01/*.json
  reason: Brownfield service not ready to migrate
- tool: SwaggerBreakingChange
  paths:
    - ./preview/2025-05-01-preview/openapi.json
    - ./preview/2026-02-01-preview/openapi.json
    - ./preview/2026-03-01-preview/openapi.json
  reason: >-
    The metadata $filter parameter existed in the 2025-01-01 API but was
    accidentally omitted during the TypeSpec conversion. Restoring it in the
    TypeSpec-backed versions preserves the existing service contract.
