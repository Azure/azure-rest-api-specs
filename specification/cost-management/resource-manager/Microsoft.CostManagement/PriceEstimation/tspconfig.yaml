parameters:
  service-dir:
    default: sdk/costmanagement
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    emitter-output-dir: "{project-root}"
    output-file: "{version-status}/{version}/openapi.json"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
    examples-dir: "{project-root}/examples"
    service-yaml: always
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-costmanagementpriceestimation"
    namespace: "azure.mgmt.costmanagementpriceestimation"
    generate-test: true
    generate-sample: true
    flavor: "azure"
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-costmanagement-priceestimation"
    namespace: "com.azure.resourcemanager.costmanagement.priceestimation"
    service-name: "Cost Management Price Estimation"
    flavor: azure
  "@azure-tools/typespec-ts":
    service-dir: "sdk/cost-management"
    emitter-output-dir: "{output-dir}/{service-dir}/arm-costmanagementpriceestimation"
    is-modular-library: true
    flavor: "azure"
    experimental-extensible-enums: true
    package-details:
      name: "@azure/arm-costmanagementpriceestimation"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/costmanagement"
    emitter-output-dir: "{output-dir}/{service-dir}/armcostmanagementpriceestimation"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armcostmanagementpriceestimation"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
  "@azure-typespec/http-client-csharp-mgmt":
    namespace: "Azure.ResourceManager.CostManagement.PriceEstimation"
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
