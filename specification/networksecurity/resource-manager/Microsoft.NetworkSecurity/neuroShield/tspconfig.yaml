emit:
  - "@azure-tools/typespec-autorest"
parameters:
  "service-dir":
    default: "sdk/neuroshield"
options:
  "@azure-tools/typespec-autorest":
    omit-unreachable-types: true
    use-read-only-status-schema: true
    emitter-output-dir: "{project-root}"
    output-file: "{emitter-output-dir}/{version-status}/{version}/neuroShield.json"
    examples-dir: "{project-root}/examples"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
  "@azure-typespec/http-client-csharp-mgmt":
    namespace: "Azure.ResourceManager.NetworkSecurity.NeuroShield"
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-networksecurity-neuroshield"
    namespace: "azure.mgmt.networksecurity.neuroshield"
    generate-test: true
    generate-sample: true
    flavor: azure
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-networksecurity-neuroshield"
    namespace: "com.azure.resourcemanager.networksecurity.neuroshield"
    service-name: "neuroshield"
    flavor: azure
  "@azure-tools/typespec-ts":
    emitter-output-dir: "{output-dir}/{service-dir}/arm-networksecurity-neuroshield"
    experimental-extensible-enums: true
    flavor: azure
    package-details:
      name: "@azure/arm-networksecurity-neuroshield"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/neuroshield"
    emitter-output-dir: "{output-dir}/{service-dir}/armneuroshield"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armneuroshield"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
