parameters:
  "service-dir":
    default: "sdk/networksecurity"
options:
  "@azure-typespec/http-client-csharp-mgmt":
    namespace: "Azure.ResourceManager.NetworkSecurity"
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-networksecurity"
    examples-dir: "{project-root}/neuroShield/examples"
    namespace: "azure.mgmt.networksecurity"
    generate-test: true
    generate-sample: true
    flavor: azure
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-networksecurity"
    examples-dir: "{project-root}/neuroShield/examples"
    namespace: "com.azure.resourcemanager.networksecurity"
    service-name: "Network Security"
    flavor: azure
  "@azure-tools/typespec-ts":
    emitter-output-dir: "{output-dir}/{service-dir}/arm-networksecurity"
    examples-dir: "{project-root}/neuroShield/examples"
    experimental-extensible-enums: true
    flavor: azure
    package-details:
      name: "@azure/arm-networksecurity"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/networksecurity"
    emitter-output-dir: "{output-dir}/{service-dir}/armnetworksecurity"
    examples-dir: "{project-root}/neuroShield/examples"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armnetworksecurity"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
