parameters:
  "service-dir":
    default: "sdk/cognitivelanguage"
emit:
  - "@azure-tools/typespec-autorest"
linter:
  extends:
    - "file:../../../../eng/typespec-rulesets/data-plane.yaml"
    - "file:../../../../eng/typespec-rulesets/client-sdk.yaml"
options:
  "@azure-tools/typespec-autorest":
    emitter-output-dir: "{project-root}"
    examples-dir: "{project-root}/examples"
    output-file: "{version-status}/{version}/questionanswering.json"
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-ai-language-questionanswering"
    package-name: "azure-ai-language-questionanswering"
    package-dir: "azure-ai-language-questionanswering"
    namespace: "azure.ai.language.questionanswering"
    generate-test: true
    generate-sample: true
    flavor: azure
  "@azure-typespec/http-client-csharp":
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
    namespace: Azure.AI.Language.QuestionAnswering.Inference
    model-namespace: false
