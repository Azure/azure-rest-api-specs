- tool: DefinitionsPropertiesNamesCamelCase
  paths:
    - preview/2026-09-15-preview/cognitiveservices.json
  reason: >
    The nested acs property embeds an Agent Control Specification manifest whose JSON field names
    are defined in snake_case by the external ACS schema. TypeSpec uses idiomatic camelCase source
    names and x-ms-client-name projections while preserving the canonical ACS wire representation.
    Renaming these fields would prevent direct ACS manifest portability.
- tool: AvoidAdditionalProperties
  paths:
    - preview/2026-09-15-preview/cognitiveservices.json
  reason: >
    The nested acs property embeds an Agent Control Specification manifest. Its metadata property
    is an extensible object, and policies is a name-keyed map whose keys are logical ACS policy
    identifiers. Replacing either map with an array would change the ACS wire schema and prevent
    direct manifest portability.
