- tool: LintDiff
  reason: >
    healthModelExists and ignoreUnknown are intentional binary flags. Booleans
    directly represent these contracts; replacing them with enums would make
    the API less natural and break existing clients.
  rules: [EnumInsteadOfBoolean]
  paths:
    - preview/2026-06-01-preview/cloudhealth.json
- tool: LintDiff
  reason: >
    Model_Status mirrors the deployed status endpoint and its existing generated
    client surface. Renaming it to Get would create an unnecessary SDK breaking
    change without improving the service contract.
  rules: [GetInOperationName, OperationId]
  paths:
    - preview/2026-06-01-preview/cloudhealth.json
- tool: BreakingChange
  reason: >
    The 2026-06-01-preview API is being synchronized with the deployed
    CloudHealth data-plane contract before public release. The added endpoints,
    responses, diagnostics fields, and corrected operation identifiers are
    intentional preview changes required for service parity.
  paths:
    - preview/2026-06-01-preview/cloudhealth.json
