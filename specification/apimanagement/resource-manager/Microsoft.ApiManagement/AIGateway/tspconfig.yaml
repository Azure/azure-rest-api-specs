parameters:
  "service-dir":
    default: "sdk/apimanagement"
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    emitter-output-dir: "{project-root}"
    output-file: "{version-status}/{version}/openapi.json"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
    emit-lro-options: "all"
    examples-dir: "{project-root}/examples"
  "@azure-typespec/http-client-csharp-mgmt":
    namespace: "Azure.ResourceManager.AIGateway"
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-aigateway"
    namespace: "azure.mgmt.aigateway"
    generate-test: true
    generate-sample: true
    flavor: "azure"
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-aigateway"
    namespace: "com.azure.resourcemanager.aigateway"
    service-name: "AI Gateway"
    flavor: azure
  "@azure-tools/typespec-ts":
    emitter-output-dir: "{output-dir}/{service-dir}/arm-aigateway"
    flavor: azure
    experimental-extensible-enums: true
    package-details:
      name: "@azure/arm-aigateway"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/aigateway"
    emitter-output-dir: "{output-dir}/{service-dir}/armaigateway"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armaigateway"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
