$namespace: Azure.Developer.ArtifactSigning

CertificateProfileOperations.getSignCertificateChain:
  - title: Gets the codesigning root certificate on the certificate chain for that account and profile name.
    id: CertificateProfileOperations_GetSignCertificateChain
    request:
      path:
        accountName: YourAccountName
        certificateProfile: YourCertificateProfileName
    responses:
      200:
        body: MjUzNjlhMDQ3Yzc0YTQ3NjdiNjYzZTIzMWFlMTAxMDVkODMxM2Y5ZjNkNmU0YTVlOTQ1ZGZiMWQ5NDgzOWU0NQ==
CertificateProfileOperations.getSigningStatus:
  - title: Gets the status of a codesign operation.
    id: CertificateProfileOperations_GetSigningStatus
    request:
      path:
        accountName: YourAccountName
        certificateProfile: YourCertificateProfileName
        operationId: 9797c668-5b3c-4586-8e0c-2768c8160bad
    responses:
      200:
        body:
          id: 76f60a30-d088-42e0-b16d-b76b88d3cbe1
          status: Succeeded
          result:
            signature: OWY4NmQwODE4ODRjN2Q2NTlhMmZlYWEwYzU1YWQwMTVhM2JmNGYxYjJiMGI4MjJjZDE1ZDZjMTViMGYwMGEwOA==
            signingCertificate: N2IzZDk3OWNhODMzMGE5NGZhN2U5ZTFiNDY2ZDhiOTllMGJjZGVhMWVjOTA1OTZjMGRjYzhkN2VmNmI0MzAwYw==
CertificateProfileOperations.getSignRootCertificate:
  - title: Gets the codesigning root certificate on the certificate chain for that account and profile name.
    id: CertificateProfileOperations_GetSignRootCertificate
    request:
      path:
        accountName: YourAccountName
        certificateProfile: YourCertificateProfileName
    responses:
      200:
        body: MjUzNjlhMDQ3Yzc0YTQ3NjdiNjYzZTIzMWFlMTAxMDVkODMxM2Y5ZjNkNmU0YTVlOTQ1ZGZiMWQ5NDgzOWU0NQ==
CertificateProfileOperations.listExtendedKeyUsages:
  - title: Gets a list of extended key usage object identifiers that are allowed.
    id: CertificateProfileOperations_ListExtendedKeyUsages
    request:
      path:
        accountName: YourAccountName
        certificateProfile: YourCertificateProfileName
    responses:
      200:
        body:
          value:
            - eku: 1.3.6.1.5.5.7.3.8
            - eku: 1.3.6.1.5.5.7.3.10
          nextLink: https://localhost:5001/codesigningaccount/account/certificateprofile/profile/eku?continuationToken=&api-version=2023-06-15-preview
CertificateProfileOperations.sign:
  - title: Submit a codesign operation.
    id: CertificateProfileOperations_Sign
    request:
      path:
        accountName: YourAccountName
        certificateProfile: YourCertificateProfileName
      headers:
        x-correlation-id: 9797c668-5b3c-4586-8e0c-2768c8160bad
        client-version: serviceName@1.0.0.0
      body:
        signatureAlgorithm: RS256
        digest: TG9yZW0gaXBzdW0gZG9sb3Igc2l0IGFtZXQ=
        fileHashList:
          - Y29uc2VjdGV0dXIgYWRpcGlzY2luZyBlbGl0
          - c2VkIGRvIGVpdXNtb2QgdGVtcG9yIGluY2lkaWR1bnQ=
        authenticodeHashList:
          - dXQgbGFib3JlIGV0IGRvbG9yZSBtYWduYSBhbGlxdWE=
          - IFV0IGVuaW0gYWQgbWluaW0gdmVuaWFt
    responses:
      202:
        headers:
          operation-location: https://localhost:5001/codesigningaccount/account/certificateprofile/profile/sign/76f60a30-d088-42e0-b16d-b76b88d3cbe1
        body:
          id: 76f60a30-d088-42e0-b16d-b76b88d3cbe1
          status: In Progress
          result: {}
