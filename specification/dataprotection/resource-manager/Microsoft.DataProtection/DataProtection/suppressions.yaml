# StaleApiVersionPin: the C# management emitter is intentionally pinned to stable 2025-09-01.
- tool: TypeSpecValidation
  rules: [StaleApiVersionPin]
  reason: >-
    The @azure-typespec/http-client-csharp-mgmt emitter is intentionally pinned to stable
    api-version 2025-09-01 — the ApiCompat baseline for the released
    Azure.ResourceManager.DataProtectionBackup SDK (the pin and its @@usage customizations were
    added in PR #42544). Advancing the pin would move the management SDK onto a preview
    api-version and re-open the ApiCompat gate the pin was created to hold — a cross-repo
    SDK-release change owned by the C# SDK team, out of scope for this spec PR, which only adds
    the 2026-08-31-preview API surface. Pin advancement is tracked separately with the SDK owner.
  paths:
    - "."
    - "**"