- tool: TypeSpecValidation
  reason: >
    Not ready to split as independent services.
  rules: [FolderStructure]
  paths:
    - Network
    - Vmss
    
- tool: TypeSpecValidation
  reason: >
    Not ready to split as independent services.
  rules: [SdkTspConfigValidation]
  sub-rules:
    - options.@azure-tools/typespec-go.*
    - options.@azure-tools/typespec-java.*
    - options.@azure-tools/typespec-python.*
    - options.@azure-tools/typespec-ts.*
    - parameters.service-dir.default
    - options.@azure-typespec/http-client-csharp-mgmt.*
  paths: 
    - Network/tspconfig.yaml
    - Vmss/tspconfig.yaml   

- tool: Swagger Avocado
  path: readme.md
  reason: The package-2026-01-01 default tag intentionally retains the frozen stable/2018-10-01/vmssNetwork.json surface for backward compatibility; moving it to 2026-01-01 would break existing clients.
