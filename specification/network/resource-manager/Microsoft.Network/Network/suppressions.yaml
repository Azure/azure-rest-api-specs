- tool: TypeSpecValidation
  reason: >
    Not ready to split as independent services.
  rules: [FolderStructure]
  paths:
    - Network
    - Vmss

- tool: TypeSpecValidation
  reason: >
    Not ready to split as independent services.
  rules: [SdkTspConfigValidation]
  sub-rules:
    - options.@azure-tools/typespec-go.*
    - options.@azure-tools/typespec-java.*
    - options.@azure-tools/typespec-python.*
    - options.@azure-tools/typespec-ts.*
    - parameters.service-dir.default
    - options.@azure-typespec/http-client-csharp-mgmt.*
  paths:
    - Network/tspconfig.yaml
    - Vmss/tspconfig.yaml

- tool: SwaggerAvocado
  paths:
    - readme.md
    - suppressions.yaml
    - Network/back-compatible.tsp
    - Network/models.tsp
    - stable/2026-03-01/common.json
    - stable/2026-03-01/virtualNetwork.json
  reason: The package-2026-03-01 default tag intentionally retains the frozen stable/2018-10-01/vmssNetwork.json surface for backward compatibility. Avocado reports MULTIPLE_API_VERSION for any changed Network file and supports only path-level suppression, so the affected release files must be covered.
