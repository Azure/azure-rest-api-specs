parameters:
  service-dir:
    default: sdk/agentserver
emit:
options:
  "@azure-typespec/http-client-csharp":
    emitter-output-dir: "{output-dir}/{service-dir}/{package-name}"
    package-name: Azure.AI.AgentServer.Core
    namespace: Azure.AI.AgentServer.Core.Storage
    generate-protocol-methods: false
    generate-convenience-methods: false
imports:
  - "@azure-tools/typespec-azure-core"
  - "@azure-tools/typespec-client-generator-core"
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/data-plane"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
  disable:
    "@azure-tools/typespec-azure-core/bad-record-type": "State-store values are opaque JSON objects."
    "@azure-tools/typespec-azure-core/no-enum": "The existing .NET API exposes ListRequestOrder as an enum."
    "@azure-tools/typespec-azure-core/no-nullable": "The wire protocol returns null cursors for empty pages."
    "@azure-tools/typespec-client-generator-core/csharp-model-suffix": "Preserve the internal model names used by the existing handwritten Core storage client."
