- tool: AvoidAdditionalProperties
  paths:
    - preview/2024-08-08-preview/desktopvirtualization.json
  reason: False alarm, vmTags describe user defined tags to be used on VM.
- tool: TypeSpecValidation
  paths:
    - tspconfig.yaml
  rules:
    - SdkTspConfigValidation
  reason: >
    Not ready to generate SDKs from TypeSpec.
    Responsibility: Service team with SDK team collaboration. 
    Comment: Currently the SDK are not generated from the TSP config file, so this rule is not applicable. Will be addressed in future releases.
    Note: This suppression MUST be removed when TypeSpec migration is complete.
