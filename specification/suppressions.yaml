# Managed centrally by the Azure SDK Team
# Remove suppressions as specs are fixed

- tool: TypeSpecValidation
  rules: [FolderStructure]
  sub-rules: [MustUseV2]
  reason: Specs added as folder structure v1, not yet converted to v2
  paths:
    - agricultureplatform/AgriculturePlatform.Management
    - applink/AppLink.Management
    - awsconnector/**
    - computebulkactions/ComputeBulkActions.Management
    - discovery/Discovery.Bookshelf.Management
    - discovery/Discovery.Management.Shared
    - discovery/Discovery.Supercomputer.Management
    - discovery/Discovery.Workspace.Management
    - managedoperations/ManagedOps.Management
    - manufacturingplatform/Manufacturingplatform.Management
    - orbital/Microsoft.PlanetaryComputer
    - orbitalplanetarycomputer/Orbital.Management
    - playwrighttesting/PlaywrightTesting.AuthManager
    - playwrighttesting/PlaywrightTesting.Management
    - playwrighttesting/PlaywrightTesting.Shared
    - programmableconnectivity/Azure.ProgrammableConnectivity
    - programmableconnectivity/ProgrammableConnectivity.Management
    - purviewdatagovernace/Azure.Analaytics.Purview.DataQuality
    - purviewdatagovernance/Azure.Analytics.Purview.UnifiedCatalog
    - splitio/SplitIO.Experimentation.Management

- tool: TypeSpecValidation
  rules: [Compile]
  sub-rules: [ExtraSwagger]
  reason: Extra swaggers left behind when versions were removed from *.tsp files
  paths:
    - devopsinfrastructure/resource-manager/Microsoft.DevOpsInfrastructure/DevOpsInfrastructure/stable/2024-10-19/devopsinfrastructure.json
    - purview/data-plane/datamap/preview/2024-03-01-preview/purviewdatamap.json

