parameters:
  "service-dir":
    default: "sdk/guestconfiguration"
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    omit-unreachable-types: true
    emitter-output-dir: "{project-root}"
    output-file: "{version-status}/{version}/guestconfiguration.json"
    examples-dir: "{project-root}/examples"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
  "@azure-tools/typespec-python":
    service-dir: "sdk/guestconfiguration"
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-guestconfigurationinventory"
    namespace: "azure.mgmt.guestconfigurationinventory"
    generate-test: true
    generate-sample: true
    flavor: "azure"
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-guestconfiguration-inventory"
    namespace: "com.azure.resourcemanager.guestconfiguration.inventory"
    service-name: "GuestConfigurationInventory"
    flavor: azure
  "@azure-tools/typespec-ts":
    service-dir: sdk/guestconfiguration
    emitter-output-dir: "{output-dir}/{service-dir}/arm-guestconfigurationinventory"
    flavor: "azure"
    experimental-extensible-enums: true
    package-details:
      name: "@azure/arm-guestconfigurationinventory"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/guestconfiguration"
    emitter-output-dir: "{output-dir}/{service-dir}/armguestconfigurationinventory"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armguestconfigurationinventory"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
  "@azure-typespec/http-client-csharp-mgmt":
    namespace: "Azure.ResourceManager.GuestConfiguration.Inventory"
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
    enable-wire-path-attribute: true
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
