parameters:
  "service-dir":
    default: "sdk/probinggateway"
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    use-read-only-status-schema: true
    omit-unreachable-types: true
    emitter-output-dir: "{project-root}"
    azure-resource-provider-folder: "resource-manager"
    output-file: "{version-status}/{version}/openapi.json"
    examples-dir: "{project-root}/examples"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
  "@azure-tools/typespec-java":
    flavor: azure
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-probinggateway"
    namespace: com.azure.resourcemanager.probinggateway
    service-name: "ProbingGateway" # human-readable service name, whitespace allowed
  "@azure-tools/typespec-ts":
    flavor: azure
    emitter-output-dir: "{output-dir}/{service-dir}/arm-probinggateway"
    experimental-extensible-enums: true
    package-details:
      name: "@azure/arm-probinggateway"
  "@azure-tools/typespec-go":
    flavor: azure
    service-dir: "sdk/resourcemanager/probinggateway"
    emitter-output-dir: "{output-dir}/{service-dir}/armprobinggateway"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armprobinggateway"
    fix-const-stuttering: true
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
  "@azure-tools/typespec-python":
    flavor: azure
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-probinggateway"
    namespace: azure.mgmt.probinggateway
    generate-sample: true
    generate-test: true
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
