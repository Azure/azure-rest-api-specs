- tool: TypeSpecValidation
  reason: >
    Compute sub-projects are nested three levels under resource-manager (e.g.
    resource-manager/Microsoft.Compute/Compute/ComputeDisk) as part of the unified
    folder structure refactor, which is one level deeper than the standard two-level
    requirement. Cross-folder imports from ../common/ are also required by this layout.
    Suppressed pending tsp-validation support for the new structure.
    Responsibility: Service team.
  rules: [FolderStructure]
  paths:
    - Compute
    - ComputeDisk
    - ComputeGallery
    - ComputeSku

- tool: TypeSpecValidation
  reason: >
    Not ready to generate SDKs from TypeSpec.
    Responsibility: Service team with SDK team collaboration.
    More info: https://aka.ms/azsdk/spec-gen-sdk-config.
  rules: [SdkTspConfigValidation]
  sub-rules:
    - options.@azure-tools/typespec-go.*
    - options.@azure-tools/typespec-java.*
    - options.@azure-tools/typespec-python.*
    - options.@azure-tools/typespec-ts.*
    - parameters.service-dir.default
    - options.@azure-typespec/http-client-csharp-mgmt.*
  paths:
    - Compute/tspconfig.yaml
    - ComputeDisk/tspconfig.yaml
    - ComputeGallery/tspconfig.yaml
    - ComputeSku/tspconfig.yaml

- tool: AvoidAdditionalProperties
  reason: >
    usedReservedCountBySubscription (CapacityReservationUtilization) is a read-only response
    projection of the RP's internal map of used reserved capacity count keyed by the consuming
    subscription id (GUID). The map shape reflects an established contract between CRP and its
    downstream consumers, which key directly on the subscription id; converting it to an array
    would break those existing contracts and require coordinated breaking changes across all
    consumers. Narrow exception for this single read-only property, approved by the ARM team.
    Responsibility: Compute service team.
  paths:
    - stable/2026-04-01/ComputeRP.json
