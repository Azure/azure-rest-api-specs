parameters:
  "service-dir":
    default: "sdk/securityinsights"
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    emitter-output-dir: "{project-root}"
    azure-resource-provider-folder: "resource-manager"
    output-file: "{version-status}/{version}/openapi.json"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
    emit-lro-options: "all"
    examples-dir: "{project-root}/examples"
  "@azure-tools/typespec-java":
    api-version: "2026-07-01"
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-securityinsights"
    namespace: "com.azure.resourcemanager.securityinsights"
    flavor: "azure"
    service-name: "Security Insights"
    remove-inner: SecurityAlert,HuntingBookmark,Entity
    use-object-for-unknown: true
    resource-collection-associations:
      - resource: Relation
        collection: IncidentRelations
  "@azure-tools/typespec-python":
    api-version: "2026-07-01"
    service-dir: "sdk/securityinsight"
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-securityinsight"
    namespace: "azure.mgmt.securityinsight"
    generate-test: true
    generate-sample: true
    flavor: "azure"
  "@azure-tools/typespec-ts":
    api-version: "2026-07-01"
    service-dir: "sdk/securityinsight"
    emitter-output-dir: "{output-dir}/{service-dir}/arm-securityinsight"
    flavor: azure
    compatibility-lro: true
    typespec-title-map:
      SecurityInsightsClient: SecurityInsights
    experimental-extensible-enums: true
    package-details:
      name: "@azure/arm-securityinsight"
  "@azure-tools/typespec-go":
    api-version: "2026-07-01"
    service-dir: "sdk/resourcemanager/securityinsights"
    emitter-output-dir: "{output-dir}/{service-dir}/armsecurityinsights"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armsecurityinsights"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
  "@azure-typespec/http-client-csharp-mgmt":
    api-version: "2026-07-01"
    namespace: "Azure.ResourceManager.SecurityInsights"
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
    enable-wire-path-attribute: true
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
