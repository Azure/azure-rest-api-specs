parameters:
  "service-dir":
    default: "sdk/digitalassets"
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    use-read-only-status-schema: true
    emitter-output-dir: "{project-root}"
    output-file: "{version-status}/{version}/openapi.json"
    examples-dir: "{project-root}/examples"
    skip-example-copying: true
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
    azure-resource-provider-folder: "./resource-manager"
    omit-unreachable-types: true
  "@azure-typespec/http-client-csharp-mgmt":
    namespace: "Azure.ResourceManager.DigitalAssets"
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-digitalassets"
    namespace: azure.mgmt.digitalassets
    generate-test: true
    generate-sample: true
    flavor: azure
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-digitalassets"
    namespace: "com.azure.resourcemanager.digitalassets"
    service-name: "DigitalAssets"
    flavor: azure
  "@azure-tools/typespec-ts":
    emitter-output-dir: "{output-dir}/{service-dir}/arm-digitalassets"
    flavor: azure
    experimental-extensible-enums: true
    package-details:
      name: "@azure/arm-digitalassets"
    azure-arm: true
    output-folder: "$(typescript-sdks-folder)/sdk/digitalassets/arm-digitalassets"
    payload-flattening-threshold: 1
    clear-output-folder: true
    generate-metadata: true
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/digitalassets"
    emitter-output-dir: "{output-dir}/{service-dir}/armdigitalassets"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armdigitalassets"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
    azure-arm: true
    license-header: MICROSOFT_MIT_NO_VERSION
    module-name: sdk/resourcemanager/digitalassets/armdigitalassets
    output-folder: $(go-sdk-folder)/$(module-name)
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
