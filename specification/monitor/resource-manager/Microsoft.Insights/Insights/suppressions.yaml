- tool: TypeSpecValidation
  reason: >
    Not ready to split as independent services.
  rules: [FolderStructure]
  paths:
    - ActionGroupsApi
    - ActivityLogAlertsApi
    - ActivityLogsApi
    - AlertRulesIncidentsApi
    - AutoScaleApi
    - DataCollectionApi
    - DiagnosticsSettings
    - LogProfilesApi
    - MetricAlertApi
    - MetricBaselinesApi
    - MetricsApi
    - NetworkSecurityPerimeterApi
    - PrivateLinkScopesApi
    - ScheduledQueryRuleApi
    - ServiceDiagnosticsSettingsApi
    - TenantActionGroups
    - VmInsightsOnboarding

- tool: TypeSpecValidation
  reason: >
    Not ready to split as independent services.
  rules: [SdkTspConfigValidation]
  sub-rules:
    - options.@azure-tools/typespec-go.*
    - options.@azure-tools/typespec-java.*
    - options.@azure-tools/typespec-python.*
    - options.@azure-tools/typespec-ts.*
    - parameters.service-dir.default
    - options.@azure-typespec/http-client-csharp-mgmt.*
  paths: 
    - ActionGroupsApi/tspconfig.yaml
    - ActivityLogAlertsApi/tspconfig.yaml
    - ActivityLogsApi/tspconfig.yaml
    - AlertRulesIncidentsApi/tspconfig.yaml
    - AutoScaleApi/tspconfig.yaml
    - DataCollectionApi/tspconfig.yaml
    - DiagnosticsSettings/tspconfig.yaml
    - LogProfilesApi/tspconfig.yaml
    - MetricAlertApi/tspconfig.yaml
    - MetricBaselinesApi/tspconfig.yaml
    - MetricsApi/tspconfig.yaml
    - NetworkSecurityPerimeterApi/tspconfig.yaml
    - PrivateLinkScopesApi/tspconfig.yaml
    - ScheduledQueryRuleApi/tspconfig.yaml
    - ServiceDiagnosticsSettingsApi/tspconfig.yaml
    - TenantActionGroups/tspconfig.yaml
    - VmInsightsOnboarding/tspconfig.yaml
