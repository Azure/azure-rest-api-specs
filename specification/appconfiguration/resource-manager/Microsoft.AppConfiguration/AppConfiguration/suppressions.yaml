# Suppressions for the AppConfiguration resource-manager service.

- tool: ResourceNameRestriction
  paths:
    - preview/2026-09-01-preview/appconfiguration.json
  reason: The feature flag name combines a data-plane key and optional label and intentionally accepts the data-plane contract's broad character set; TypeSpec constrains it to 1 through 10000 characters.

- tool: EnumInsteadOfBoolean
  paths:
    - preview/2026-09-01-preview/appconfiguration.json
  reason: Feature flag and telemetry enabled states are intrinsically binary and match the data-plane contract.

- tool: LatestVersionOfCommonTypesMustBeUsed
  paths:
    - preview/2026-09-01-preview/appconfiguration.json
  reason: This brownfield TypeSpec project emits all existing API versions with common types v5; upgrading globally would modify established contracts outside this change.

- tool: NestedResourcesMustHaveListOperation
  paths:
    - preview/2026-09-01-preview/appconfiguration.json
  reason: Feature flags are exposed through the data-plane proxy with point GET, PUT, and DELETE operations only. Collection listing is intentionally not supported by the management endpoint; feature flag enumeration uses the data-plane API.

