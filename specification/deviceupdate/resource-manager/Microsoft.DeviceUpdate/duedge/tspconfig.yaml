emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    use-read-only-status-schema: false
    omit-unreachable-types: true
    emitter-output-dir: "{project-root}"
    azure-resource-provider-folder: "resource-manager"
    output-file: "{version-status}/{version}/deviceupdate.json"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
  "@azure-tools/typespec-go":
    service-dir: sdk/resourcemanager/deviceupdate
    emitter-output-dir: "{output-dir}/{service-dir}/armdeviceupdate"
    module: github.com/Azure/azure-sdk-for-go/{service-dir}/armdeviceupdate
    fix-const-stuttering: true
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
    flavor: azure
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-deviceupdate"
    namespace: azure.mgmt.deviceupdate
    generate-test: true
    generate-sample: true
    flavor: azure
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-deviceupdate"
    flavor: azure
    namespace: com.azure.resourcemanager.deviceupdate
    service-name: deviceupdate
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
parameters:
  service-dir:
    default: sdk/deviceupdate
