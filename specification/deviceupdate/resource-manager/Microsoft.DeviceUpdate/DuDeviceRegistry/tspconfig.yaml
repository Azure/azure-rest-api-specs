emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    use-read-only-status-schema: true
    omit-unreachable-types: true
    emitter-output-dir: "{project-root}/.."
    azure-resource-provider-folder: "resource-manager"
    output-file: "DuDeviceRegistry/{version-status}/{version}/dudeviceupdate.json"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
    examples-dir: "{project-root}/examples"
  "@azure-typespec/http-client-csharp-mgmt":
    namespace: "Azure.ResourceManager.DeviceRegistry.SoftwareUpdate"
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
  "@azure-tools/typespec-go":
    service-dir: sdk/resourcemanager/deviceregistry
    emitter-output-dir: "{output-dir}/{service-dir}/armdeviceregistrysoftwareupdate"
    module: github.com/Azure/azure-sdk-for-go/{service-dir}/armdeviceregistrysoftwareupdate
    fix-const-stuttering: true
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
    flavor: azure
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-deviceregistrysoftwareupdate"
    namespace: azure.mgmt.deviceregistrysoftwareupdate
    generate-test: true
    generate-sample: true
    flavor: azure
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-deviceregistry-softwareupdate"
    flavor: azure
    namespace: com.azure.resourcemanager.deviceregistry.softwareupdate
    service-name: Device Registry Software Update
  "@azure-tools/typespec-ts":
    experimental-extensible-enums: true
    emitter-output-dir: "{output-dir}/{service-dir}/arm-deviceregistrysoftwareupdate"
    package-details:
      name: "@azure/arm-deviceregistrysoftwareupdate"
    flavor: azure
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
parameters:
  service-dir:
    default: sdk/deviceregistry
