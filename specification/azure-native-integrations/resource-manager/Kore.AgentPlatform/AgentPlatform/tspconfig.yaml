parameters:
  "service-dir":
    default: "sdk/koreaiartemis"
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    omit-unreachable-types: true
    use-read-only-status-schema: true
    emitter-output-dir: "{project-root}"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
    emit-common-types-schema: "never"
    output-file: "{version-status}/{version}/openapi.json"
    examples-dir: "{project-root}/examples"
  "@azure-typespec/http-client-csharp-mgmt":
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
    namespace: "Azure.ResourceManager.KoreAIArtemis"
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-koreaiartemis"
    namespace: "com.azure.resourcemanager.koreaiartemis"
    flavor: "azure"
    service-name: "Kore AI Artemis"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/koreaiartemis"
    emitter-output-dir: "{output-dir}/{service-dir}/armkoreaiartemis"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armkoreaiartemis"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
  "@azure-tools/typespec-ts":
    experimental-extensible-enums: true
    emitter-output-dir: "{output-dir}/{service-dir}/arm-koreaiartemis"
    flavor: "azure"
    package-details:
      name: "@azure/arm-koreaiartemis"
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-koreaiartemis"
    namespace: "azure.mgmt.koreaiartemis"
    flavor: "azure"
    generate-test: true
    generate-sample: true
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
