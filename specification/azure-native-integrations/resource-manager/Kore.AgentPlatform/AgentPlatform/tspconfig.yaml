parameters:
  "service-dir":
    default: "sdk/agentplatform"
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    omit-unreachable-types: true
    use-read-only-status-schema: true
    emitter-output-dir: "{project-root}"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
    emit-common-types-schema: "never"
    output-file: "{version-status}/{version}/openapi.json"
    examples-dir: "{project-root}/examples"
  "@azure-typespec/http-client-csharp-mgmt":
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
    namespace: "Azure.ResourceManager.KoreAgentPlatform"
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-agentplatform"
    namespace: "com.azure.resourcemanager.agentplatform"
    flavor: "azure"
    service-name: "KoreAgentPlatform"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/agentplatform"
    emitter-output-dir: "{output-dir}/{service-dir}/armagentplatform"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armagentplatform"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
  "@azure-tools/typespec-ts":
    experimental-extensible-enums: true
    emitter-output-dir: "{output-dir}/{service-dir}/arm-agentplatform"
    flavor: "azure"
    package-details:
      name: "@azure/arm-agentplatform"
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-agentplatform"
    namespace: "azure.mgmt.agentplatform"
    flavor: "azure"
    generate-test: true
    generate-sample: true
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
