parameters:
  "service-dir":
    default: "sdk/aiinfraoptimization"
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    omit-unreachable-types: true
    use-read-only-status-schema: true
    azure-resource-provider-folder: "resource-manager"
    emitter-output-dir: "{project-root}"
    output-file: "{version-status}/{version}/aiinfraoptimization.json"
    examples-dir: "{project-root}/examples"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
  "@azure-typespec/http-client-csharp-mgmt":
    namespace: "Azure.ResourceManager.AIInfraOptimization"
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-aiinfraoptimization"
    namespace: "azure.mgmt.aiinfraoptimization"
    generate-test: true
    generate-sample: true
    flavor: "azure"
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-aiinfraoptimization"
    namespace: "com.azure.resourcemanager.aiinfraoptimization"
    service-name: "AIInfraOptimization"
    flavor: "azure"
  "@azure-tools/typespec-ts":
    emitter-output-dir: "{output-dir}/{service-dir}/arm-aiinfraoptimization"
    is-modular-library: true
    experimental-extensible-enums: true
    flavor: "azure"
    package-details:
      name: "@azure/arm-aiinfraoptimization"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/aiinfraoptimization"
    emitter-output-dir: "{output-dir}/{service-dir}/armaiinfraoptimization"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armaiinfraoptimization"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
