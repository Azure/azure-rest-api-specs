- tool: TypeSpecValidation
  path: ./tspconfig.yaml
  rules:
    - SdkTspConfigValidation
  sub-rules:
    - options.@azure-tools/typespec-go.generate-samples
  reason: >
    Example generation emits invalid Go for RFC7231 datetime values.
    Blocked by https://github.com/Azure/autorest.go/issues/2026
