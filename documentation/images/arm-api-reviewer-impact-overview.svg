<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title description">
  <title id="title">Faster feedback and broader review coverage</title>
  <desc id="description">Left: mean blocking-feedback wait was 94.68 hours in 2025 and 57.60 hours in 2026, a 39.2 percent reduction, for matched May 1 through October 21 cohorts. Right: design review items per change were 3.3 with human-only review and 7.3 with agent plus human review, or 2.2 times as many, in the published May through July comparison. These are different reporting windows.</desc>
  <rect width="1100" height="490" fill="#ffffff"/>
  <g font-family="Segoe UI, sans-serif" fill="#172b36">
    <text x="42" y="40" font-size="28" font-weight="700">Faster feedback. Broader review coverage.</text>
    <text x="42" y="68" font-size="15" fill="#52646f">Observed results across the two Azure API specification repositories</text>
    <line x1="567" y1="100" x2="567" y2="427" stroke="#dce4e8"/>
    <text x="42" y="113" font-size="21" font-weight="600">Blocking-feedback turnaround</text>
    <text x="42" y="139" font-size="14" fill="#52646f">Mean hours | May 1 - Oct 21, 2025 vs. 2026</text>
    <text x="95" y="176" font-size="15">2025</text>
    <rect x="95" y="187" width="378.72" height="34" rx="2" fill="#3b6d9d"/>
    <text x="484" y="210" font-size="16" font-weight="600">94.68 h</text>
    <text x="95" y="246" font-size="15">2026</text>
    <rect x="95" y="257" width="230.40" height="34" rx="2" fill="#007f73"/>
    <text x="336" y="280" font-size="16" font-weight="600">57.60 h</text>
    <line x1="95" y1="315" x2="495" y2="315" stroke="#bbc9d0"/>
    <g font-size="12" text-anchor="middle" fill="#52646f">
      <text x="95" y="336">0</text>
      <text x="195" y="336">25</text>
      <text x="295" y="336">50</text>
      <text x="395" y="336">75</text>
      <text x="495" y="336">100 h</text>
    </g>
    <text x="42" y="386" font-size="25" font-weight="700" fill="#006c61">37.08 hours less waiting</text>
    <text x="42" y="412" font-size="15" fill="#52646f">39.2% shorter average label-transition time</text>
    <text x="612" y="113" font-size="21" font-weight="600">Design review items per change</text>
    <text x="612" y="139" font-size="14" fill="#52646f">May - Jul, 2025 vs. 2026 | published audit</text>
    <text x="650" y="176" font-size="15">Human-only</text>
    <rect x="650" y="187" width="148.50" height="34" rx="2" fill="#3b6d9d"/>
    <text x="810" y="210" font-size="16" font-weight="600">3.3</text>
    <text x="650" y="246" font-size="15">Agent + human</text>
    <rect x="650" y="257" width="328.50" height="34" rx="2" fill="#007f73"/>
    <text x="990" y="280" font-size="16" font-weight="600">7.3</text>
    <line x1="650" y1="315" x2="1010" y2="315" stroke="#bbc9d0"/>
    <g font-size="12" text-anchor="middle" fill="#52646f">
      <text x="650" y="336">0</text>
      <text x="740" y="336">2</text>
      <text x="830" y="336">4</text>
      <text x="920" y="336">6</text>
      <text x="1010" y="336">8</text>
    </g>
    <text x="612" y="386" font-size="25" font-weight="700" fill="#006c61">2.2x as much design feedback</text>
    <text x="612" y="412" font-size="15" fill="#52646f">Review signals, not a count of confirmed defects</text>
    <text x="42" y="461" font-size="13" fill="#52646f">Timing is elapsed author wait, not engineering labor. Each panel states its own comparison window.</text>
  </g>
</svg>