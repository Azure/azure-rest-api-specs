# Vally eval CI for .github/skills, using the shared jobs synced from azure-sdk-tools under
# eng/common. Pipeline-specific network settings stay in this entrypoint.
#
# Pilot scope: hermetic mock scenarios only, scheduled/manual runs (no pr trigger yet).

trigger: none

pr: none

schedules:
  - cron: "0 8 * * *"
    displayName: "Daily skill-eval run"
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

parameters:
  - name: publishDashboardResults
    displayName: Publish trusted main results to the eval dashboard
    type: boolean
    default: true

variables:
  # Managed-pool image selection (LINUXPOOL/LINUXVMIMAGE). Repo-local.
  - template: /eng/pipelines/templates/variables/image.yml
  # Provides the secret azuresdk-copilot-github-pat, mapped into GITHUB_TOKEN in the invoke step.
  # Already exists in this ADO project.
  - group: AzSDK_Eval_Variable_group

extends:
  ${{ if eq(variables['System.TeamProject'], 'internal') }}:
    template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  ${{ else }}:
    template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      skipBuildTagsForGitHubPullRequests: true
      ${{ if and(parameters.publishDashboardResults, eq(variables['System.CollectionUri'], 'https://dev.azure.com/azure-sdk/'), eq(variables['System.TeamProject'], 'internal'), eq(variables['Build.Repository.Name'], 'Azure/azure-rest-api-specs'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Schedule', 'Manual')) }}:
        networkIsolationPolicy: DefaultDeny, CFSClean, CFSClean2, CFSClean3, AzureStorage
    sdl:
      sourceAnalysisPool:
        name: $(WINDOWSPOOL)
        image: $(WINDOWSVMIMAGE)
        os: windows
    stages:
      - stage: Prepare
        displayName: Build MCP
        jobs:
          - template: /eng/common/pipelines/templates/jobs/build-mcp.yml@self
            parameters:
              mcpSetupTemplate: /eng/pipelines/templates/steps/eval-mcp-setup.yml
              TestType: mock
          - template: /eng/common/pipelines/templates/jobs/generate-eval-matrix.yml@self
            parameters:
              vallyRoot: .github/skills
              evalGlobs:
                - "*/evals/*.eval.yaml"
                - "*/evals/eval.yaml"
                - "evals/arm-api-reviewer/vally/eval-*.yaml"
      - stage: Eval
        displayName: Run eval shards
        dependsOn: Prepare
        jobs:
          - template: /eng/common/pipelines/templates/jobs/eval-shard.yml@self
            parameters:
              vallyRoot: .github/skills
              shardTimeoutInMinutes: 45
      - stage: Summary
        displayName: Summarize results
        dependsOn: [Prepare, Eval]
        condition: always()
        jobs:
          - template: /eng/common/pipelines/templates/jobs/eval-summarize.yml@self
            parameters:
              createDashboardBundle: true
              publishDashboardResults: ${{ parameters.publishDashboardResults }}
