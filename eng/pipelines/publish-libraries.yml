trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - libs/**

pr: none

parameters:
  - name: Publish
    displayName: Publish the manifest version to npm (manual internal main-branch runs only)
    type: boolean
    default: false

variables:
  - template: /eng/pipelines/templates/variables/globals.yml
  - template: /eng/pipelines/templates/variables/image.yml

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
      - stage: Build
        displayName: Build and pack libraries
        jobs:
          - job: Build
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux
            steps:
              - checkout: self
                fetchDepth: 0
              - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml
              - template: /eng/pipelines/templates/steps/npm-install.yml
              - script: pnpm --filter @azure-tools/typespec-foundry-core build
                displayName: Compile and lint Foundry Core
              - script: pnpm --filter @azure-tools/typespec-foundry-core test:ci
                displayName: Test Foundry Core
              - ${{ if and(in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'), eq(variables['System.TeamProject'], 'internal'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Repository.Name'], 'Azure/azure-rest-api-specs')) }}:
                  - script: node ./eng/scripts/library-release.ts ./libs/foundry-core
                    displayName: Prepare automatic prerelease version
              - script: pnpm --config.verifyDepsBeforeRun=false --filter @azure-tools/typespec-foundry-core pack --pack-destination "$(Build.ArtifactStagingDirectory)/packages"
                displayName: Pack Foundry Core
            templateContext:
              outputs:
                - output: pipelineArtifact
                  path: $(Build.ArtifactStagingDirectory)/packages
                  artifact: packages
                  displayName: Publish npm package artifacts

      - ${{ if and(or(parameters.Publish, in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')), eq(variables['System.TeamProject'], 'internal'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Repository.Name'], 'Azure/azure-rest-api-specs')) }}:
          - stage: Publish
            displayName: Publish libraries to npm
            dependsOn: Build
            condition: succeeded()
            jobs:
              - template: /eng/common/pipelines/templates/jobs/npm-publish.yml
                parameters:
                  ArtifactName: packages
                  Environment: package-publish
                  ${{ if in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI') }}:
                    Tag: latest
                  ${{ else }}:
                    Tag: auto
