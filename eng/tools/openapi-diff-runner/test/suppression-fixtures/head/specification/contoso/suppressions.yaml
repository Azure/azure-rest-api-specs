- tool: SwaggerBreakingChange
  path: stable/**
  reason: Skip same-version checks for this directory

- tool: SwaggerAll
  path: preview/**
  reason: Skip all Swagger checks for this directory

- tool: SwaggerBreakingChange
  path: rules/rule-scoped.json
  rules: [ExampleRule]
  reason: Rule-scoped entries do not skip a file

- tool: SwaggerBreakingChange
  path: deleted/**
  reason: Skip retired Swagger files

- tool: SwaggerBreakingChangeCrossVersion
  path: cross/**
  reason: Skip cross-version checks for this directory
