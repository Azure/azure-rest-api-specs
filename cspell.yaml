  - aarti
  - agentic
  - azext
  - byos
  - cadl
  - contoso
  - dalia
  - diya
  - eastus
  - entra
  - evals
  - fqdns
  - hana
  - hyunsu
  - keita
  - kusto
  - liftr
  - localizable
  - mbps
  - meera
  - mgmt
  - niwat
  - odata
  - onboarded
  - payg
  - premwadee
  - regen
  - remy
  - rpaas
  - skus
  - ssml
  - sunhi
  - thierry
  - vmss
  - vnet
  - waza
  - westus
  - xiaoxiao
  - ximena
  - yunxi
caseSensitive: false
overrides:
