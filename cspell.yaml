version: '0.2'
language: en
flagWords:
  - teh
ignorePaths:
  - .gitignore
  - .vscode/**
  - '**/examples/**'
  - '**/package-lock.json'
  - cspell.json
  - cspell.yaml
  - eng/**
  - .github/skills/**
  - node_modules/**
  - specification/suppressions.yaml
  - .devcontainer/**
ignoreRegExpList:
  - Base64
  - email
  - v\d
minWordLength: 4
dictionaries:
  - companies
  - csharp
  - go
  - html
  - java
  - node
  - python
  - softwareTerms
  - typescript
enableFiletypes:
  - cadl
allowCompoundWords: true
