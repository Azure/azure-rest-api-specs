id: issues.stale
name: Stale Issues
description: Mark and close stale issues
owner:
resource: repository
disabled: false
where:
configuration:
  resourceManagementConfiguration:
    scheduledSearches:
      - description: Close stale issues awaiting author feedback after 14 days of inactivity
        frequencies:
          - daily:
              time: 1:0
        filters:
          - isIssue
          - isOpen
          - hasLabel:
              label: needs-author-feedback
          - hasLabel:
              label: no-recent-activity
          - noActivitySince:
              days: 14
        actions:
          - closeIssue

      - description: Mark issues awaiting author feedback as stale after 7 days of inactivity
        frequencies:
          - hourly:
              hour: 6
        filters:
          - isIssue
          - isOpen
          - hasLabel:
              label: needs-author-feedback
          - noActivitySince:
              days: 7
          - isNotLabeledWith:
              label: no-recent-activity
        actions:
          - addLabel:
              label: no-recent-activity
          - addReply:
              reply: >-
                Hi, we're sending this friendly reminder because we haven't heard back from you in a while. We need more information about this issue to help address it. Please be sure to give us your input within the next **7 days**. If we don't hear back from you within **14 days** of this comment the issue will be automatically closed. Thank you!

      - description: Close stale issues after 14 days of inactivity
        frequencies:
          - daily:
              time: 13:0
        filters:
          - isIssue
          - isOpen
          - hasLabel:
              label: no-recent-activity
          - noActivitySince:
              days: 14
        actions:
          - closeIssue
          - addReply:
              reply: >-
                Hi, @${issueAuthor}. This issue has been closed since it had no activity for 14 days after being marked as stale. If you still need help, please reopen it.

    eventResponderTasks:
      - description: Return issues to the team when the author provides feedback
        if:
          - payloadType: Issue_Comment
          - isAction:
              action: Created
          - isActivitySender:
              issueAuthor: true
          - hasLabel:
              label: needs-author-feedback
          - isOpen
        then:
          - addLabel:
              label: needs-team-attention
          - removeLabel:
              label: needs-author-feedback

      - description: Remove the stale label when an issue changes
        if:
          - payloadType: Issues
          - not:
              isAction:
                action: Closed
          - hasLabel:
              label: no-recent-activity
        then:
          - removeLabel:
              label: no-recent-activity

      - description: Remove the stale label when an issue receives a comment
        if:
          - payloadType: Issue_Comment
          - isIssue
          - hasLabel:
              label: no-recent-activity
        then:
          - removeLabel:
              label: no-recent-activity

      - description: Remove the stale label when an open issue receives a comment
        if:
          - payloadType: Issue_Comment
          - isIssue
          - hasLabel:
              label: no-recent-activity
          - isOpen
        then:
          - removeLabel:
              label: no-recent-activity

onFailure:
onSuccess:
