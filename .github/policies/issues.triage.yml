id: issues.triage
name: Issue Triage
description: Triage new issues and route them to the right team
owner:
resource: repository
disabled: false
where:
configuration:
  resourceManagementConfiguration:
    eventResponderTasks:
      - description: Remove needs-triage label when it is applied to an issue
        if:
          - payloadType: Issues
          - isAction:
              action: Labeled
          - hasLabel:
              label: needs-triage
          - not:
              labelAdded:
                label: needs-triage
        then:
          - removeLabel:
              label: needs-triage

      - description: Route customer-reported issues to team triage when Service Attention is removed
        if:
          - payloadType: Issues
          - isOpen
          - hasLabel:
              label: customer-reported
          - labelRemoved:
              label: Service Attention
        then:
          - addLabel:
              label: needs-team-triage

      - description: Label new issues from external contributors for triage
        if:
          - payloadType: Issues
          - isAction:
              action: Opened
          - and:
              - not:
                  activitySenderHasPermission:
                    permission: Write
              - not:
                  activitySenderHasAssociation:
                    association: Member
              - not:
                  activitySenderHasAssociation:
                    association: Collaborator
              - not:
                  activitySenderHasPermission:
                    permission: Admin
        then:
          - addLabel:
              label: customer-reported
          - addLabel:
              label: question

onFailure:
onSuccess:
