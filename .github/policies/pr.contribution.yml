id: pr.contribution
name: PR Contribution
description: Label and greet external pull request contributors
owner:
resource: repository
disabled: false
where:
configuration:
  resourceManagementConfiguration:
    eventResponderTasks:
      - description: Label and greet external contributors on pull request creation
        if:
          - payloadType: Pull_Request
          - isAction:
              action: Opened
          - and:
              - not:
                  activitySenderHasPermission:
                    permission: Write
              - not:
                  activitySenderHasAssociation:
                    association: Member
              - not:
                  activitySenderHasAssociation:
                    association: Collaborator
              - not:
                  activitySenderHasPermission:
                    permission: Admin
              - not:
                  isActivitySender:
                    user: dependabot[bot]
              - not:
                  isActivitySender:
                    user: azure-sdk-automation[bot]
              - not:
                  isActivitySender:
                    user: github-actions[bot]
              - not:
                  isActivitySender:
                    user: Copilot
        then:
          - addLabel:
              label: customer-reported
          - addReply:
              reply: Thank you for your contribution ${issueAuthor}! We will review the pull request and get back to you soon.

onFailure:
onSuccess:
