id: pr.stale
name: Stale PR
description: Mark and close stale pull requests
owner:
resource: repository
disabled: false
where:
configuration:
  resourceManagementConfiguration:
    scheduledSearches:
      - description: Mark PRs with no activity for 14 days as stale
        frequencies:
          - daily:
              time: 13:00
        filters:
          - isPullRequest
          - isOpen
          - isNotLabeledWith:
              label: no-recent-activity
          - noActivitySince:
              days: 14
        actions:
          - addLabel:
              label: no-recent-activity
          - addReply:
              reply: >-
                Hi @${issueAuthor}.
                Your PR has had no activity for 14 days and is marked as stale. If no further updates are made within 5 days, this PR will automatically be closed.
                To keep this PR active, please leave a comment as the PR author or remove the `no-recent-activity` label.

      - description: Close PRs that have been stale for 5 more days (19 days total)
        frequencies:
          - daily:
              time: 13:00
        filters:
          - isPullRequest
          - isOpen
          - hasLabel:
              label: no-recent-activity
          - noActivitySince:
              days: 5
        actions:
          - closeIssue
          - addReply:
              reply: >-
                Hi @${issueAuthor}.
                This PR has been closed since it had no activity for 19 days. If you still need this change, please reopen the PR and @mention the assignee for review.

    eventResponderTasks:
      - description: Remove the stale label when the PR author comments
        if:
          - payloadType: Issue_Comment
          - isPullRequest
          - isAction:
              action: Created
          - isActivitySender:
              issueAuthor: true
          - hasLabel:
              label: no-recent-activity
          - isOpen
        then:
          - removeLabel:
              label: no-recent-activity

onFailure:
onSuccess:
