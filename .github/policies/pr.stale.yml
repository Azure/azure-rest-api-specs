id: pr.stale
name: Stale PR
description: Manage stale pull requests
owner:
resource: repository
disabled: false
where:
configuration:
  resourceManagementConfiguration:
    scheduledSearches:
      - description: Close PRs against typespec-next 14 days after creation
        frequencies:
          - daily:
              time: 14:00
        filters:
          - isPullRequest
          - isOpen
          - hasLabel:
              label: ttl
          - created:
              before: 14
        actions:
          - closeIssue
          - addReply:
              reply: >-
                Hi @${issueAuthor}.
                This PR has been closed because PRs targeting the `typespec-next` branch are automatically closed 14 days after creation, since that branch is periodically rewritten and long-lived PRs against it fall out of date.
                If you still need this change, please reopen the PR and rebase it onto the latest `typespec-next`, or retarget it to `main`.

      - description: Close PRs with no activity for 365 days without requiring a stale label
        frequencies:
          - daily:
              time: 14:00
        filters:
          - isPullRequest
          - isOpen
          - noActivitySince:
              days: 365
        actions:
          - closeIssue
          - addReply:
              reply: >-
                Hi @${issueAuthor}.
                This PR has been closed since it had no activity for more than 1 year. If you still need this change, please reopen the PR and @mention the assignee for review.

      - description: Mark PRs with no activity for 14 days as stale
        frequencies:
          - daily:
              time: 13:00
        filters:
          - isPullRequest
          - isOpen
          - isNotLabeledWith:
              label: no-recent-activity
          - noActivitySince:
              days: 14
        actions:
          - addLabel:
              label: no-recent-activity
          - addReply:
              reply: >-
                Hi @${issueAuthor}.
                Your PR has had no activity for 14 days and is marked as stale. If no further updates are made within 14 days, this PR will automatically be closed.
                To keep this PR active, please leave a comment as the PR author or remove the `no-recent-activity` label.

      - description: Close PRs that have been stale for 14 more days (28 days total)
        frequencies:
          - daily:
              time: 13:00
        filters:
          - isPullRequest
          - isOpen
          - hasLabel:
              label: no-recent-activity
          - noActivitySince:
              days: 14
        actions:
          - closeIssue
          - addReply:
              reply: >-
                Hi @${issueAuthor}.
                This PR has been closed since it had no activity for 28 days. If you still need this change, please reopen the PR and @mention the assignee for review.

    eventResponderTasks:
      - description: Label PRs targeting typespec-next so the schedule above can find them
        if:
          - payloadType: Pull_Request
          - isOpen
          - targetsBranch:
              branch: typespec-next
        then:
          - addLabel:
              label: ttl

      - description: Remove the stale label when the PR author updates the PR
        if:
          - payloadType: Pull_Request
          - isActivitySender:
              issueAuthor: true
          - hasLabel:
              label: no-recent-activity
          - isOpen
        then:
          - removeLabel:
              label: no-recent-activity

      - description: Remove the stale label when the PR author comments
        if:
          - payloadType: Issue_Comment
          - isPullRequest
          - isAction:
              action: Created
          - isActivitySender:
              issueAuthor: true
          - hasLabel:
              label: no-recent-activity
          - isOpen
        then:
          - removeLabel:
              label: no-recent-activity

onFailure:
onSuccess:
