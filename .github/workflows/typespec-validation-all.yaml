name: TypeSpec Validation - All

on:
  push:
    branches:
      - main
      - RPSaaSMaster
      - typespec-next

  pull_request:
    branches:
      - main
      - RPSaaSMaster
      - typespec-next
    paths:
      - .gitattributes
      - .oxfmtrc.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - tsconfig.base.json
      - eng/**
      - "!eng/common/**"
      - specification/suppressions.yaml
      - specification/common-types/**

      # Workflow and workflow dependencies
      - .github/actions/setup-node-install-deps/**
      - .github/shared/**
      - .github/workflows/typespec-validation-all.yaml

  schedule:
    # Run 4x/day
    - cron: "0 0,6,12,18 * * *"

  workflow_dispatch:
    inputs:
      typespec-channel:
        description: 'TypeSpec packages: "stable" or an npm dist-tag such as "next"'
        default: next

permissions:
  contents: read

jobs:
  typespec-validation-all:
    # Use short name to maximize space for parameters in UI
    name: TSV

    strategy:
      # Validate all specs, even if one job fails early
      fail-fast: false
      # Sort matrix elements from "most important" to "least important" for the best grouping and UI
      # Keep matrix values short, to maximize number of parameters shown in UI
      matrix:
        # stable: committed TypeSpec versions. next (or a dispatched dist-tag): upcoming TypeSpec.
        # Scheduled runs validate both. Runs for the typespec-next branch use "next".
        channel: >-
          ${{ fromJSON(
          github.event_name == 'schedule' && '["stable", "next"]'
          || github.event_name == 'workflow_dispatch' && format('[{0}]', toJSON(inputs.typespec-channel))
          || (github.ref_name == 'typespec-next' || github.base_ref == 'typespec-next') && '["next"]'
          || '["stable"]'
          ) }}
        os: [ubuntu, windows]
        # shards must start at 1 and increment by 1
        shard: [1, 2, 3]
        # total-shards must be an accurate count of the number of shards
        total-shards: [3]

    runs-on: ${{ fromJSON('{"ubuntu":"ubuntu-24.04", "windows":"windows-2022"}')[matrix.os] }}

    env:
      OVERLAY_TYPESPEC_NEXT: ${{ matrix.channel != 'stable' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Enable git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Overlaying typespec-next needs the history to find a merge base.
          fetch-depth: ${{ fromJSON(env.OVERLAY_TYPESPEC_NEXT == 'true' && '0' || '1') }}

      # On main, an upcoming TypeSpec release is validated together with the spec changes waiting
      # on typespec-next. Only specification/ is taken from that branch, so tooling always comes
      # from main. A conflict fails the job: sync main into typespec-next to resolve it.
      - name: Overlay typespec-next spec changes
        if: env.OVERLAY_TYPESPEC_NEXT == 'true'
        shell: bash
        run: |
          git merge --no-commit --no-ff origin/typespec-next
          git restore --source=HEAD --staged --worktree -- . ':!specification'
          git -c user.name="azure-sdk" -c user.email="azuresdk@microsoft.com" \
            commit --allow-empty --quiet -m "Overlay typespec-next spec changes"

      - name: Setup Node and install deps
        uses: ./.github/actions/setup-node-install-deps
        with:
          typespec-channel: ${{ matrix.channel }}

      - name: Validate All Specs
        run: >-
          node eng/tools/typespec-validation/cmd/tsv.js --all
          --shard=${{ matrix.shard }}/${{ matrix.total-shards }} --git-clean specification
          --github-summary
          ${{ matrix.channel != 'stable' && format('--allow-generated-changes --diff-output={0}/generated-changes.patch', runner.temp) || '' }}
          ${{ runner.debug == '1' && '--verbose' || '' }}

      # Generated Swagger that changes with the upcoming release. Apply the merged patches in the PR
      # that moves main to that release instead of hand-committing them on typespec-next.
      - name: Upload generated changes
        if: always() && matrix.channel != 'stable' && matrix.os == 'ubuntu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typespec-${{ matrix.channel }}-generated-changes-${{ matrix.shard }}
          path: ${{ runner.temp }}/generated-changes.patch
          if-no-files-found: ignore
