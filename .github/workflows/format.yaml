name: Format

on:
  push:
    branches:
      - main
      - typespec-next
    paths:
      - .github/**
      - eng/tools/**
      - .oxfmtrc.json
      - .editorconfig
      - .gitignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vitest.config.mts
  pull_request:
    paths:
      - .github/**
      - eng/tools/**
      - .oxfmtrc.json
      - .editorconfig
      - .gitignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vitest.config.mts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            eng/tools

      - uses: ./.github/actions/setup-node-install-deps
        with:
          install-command: pnpm ci

      - name: Check formatting for all packages
        run: pnpm run format:check
