name: Format

on:
  push:
    branches:
      - main
      - typespec-next
    paths:
      - .github/**
      - eng/tools/**
      - .oxfmtrc.json
      - .editorconfig
      - .gitignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vitest.config.mts
  pull_request:
    paths:
      - .github/**
      - eng/tools/**
      - .oxfmtrc.json
      - .editorconfig
      - .gitignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vitest.config.mts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            eng/tools

      - uses: ./.github/actions/setup-node-install-deps
        with:
          install-command: pnpm install --frozen-lockfile --prod --prefer-offline --filter=azure-rest-api-specs-formatting
          cache-name: formatting

      - name: Check formatting for all packages
        # Run directly so pnpm does not auto-install the rest of the workspace.
        run: node .github/formatting/node_modules/oxfmt/bin/oxfmt .github eng/tools vitest.config.mts --check
