name: ARM Universal Auto SignOff

on: # zizmor: ignore[dangerous-triggers] Fork PR updates require this; only base/default-branch code runs.
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        labeled,
        unlabeled,
        ready_for_review,
        converted_to_draft,
      ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number reconciled by Summarize Checks"
        required: true
        type: string
      head_sha:
        description: "Expected PR head SHA"
        required: true
        type: string
  workflow_run:
    workflows:
      - "ARM API Review: Automated Workflow"
      - "Swagger Avocado - Set Status"
      - "Swagger LintDiff - Set Status"
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: read

jobs:
  arm-universal-auto-signoff:
    name: ARM Universal Auto SignOff
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion != 'skipped' &&
       github.event.workflow_run.conclusion != 'cancelled') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open')
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
      - id: signoff
        name: Revalidate and publish universal ARM signoff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARM_SIGNOFF_PR_NUMBER: ${{ inputs.pr_number }}
          ARM_SIGNOFF_HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            const { applyUniversalSignoff } =
              await import('${{ github.workspace }}/.github/workflows/src/arm-auto-signoff/arm-universal-auto-signoff.ts');
            return await applyUniversalSignoff({ github, context, core });
      # Only changed labels need another summary. Missing dispatch correlation stops no-op loops.
      - if: always() && steps.signoff.outputs.head_sha
        name: Upload artifact with head SHA
        uses: ./.github/actions/add-empty-artifact
        with:
          name: head-sha
          value: ${{ steps.signoff.outputs.head_sha }}
      - if: always() && steps.signoff.outputs.issue_number
        name: Upload artifact with issue number
        uses: ./.github/actions/add-empty-artifact
        with:
          name: issue-number
          value: ${{ steps.signoff.outputs.issue_number }}
