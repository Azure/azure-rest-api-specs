# Universal ARM auto-signoff. Owns ARMSignedOff only while ARMAutoSignedOff marks it as
# automation-owned; ARMSignedOff without the marker is a human approval and is never changed.
name: ARM Universal Auto SignOff

on: # zizmor: ignore[dangerous-triggers] Fork PR updates require this; only base/default-branch code runs.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number from the trusted reviewer correlation"
        required: true
        type: string
      head_sha:
        description: "Reviewed PR head SHA"
        required: true
        type: string
  # Must run on pull_request_target instead of pull_request, since the latter cannot trigger on
  # labels from bot accounts in fork PRs. pull_request_target is also more similar to the other
  # trigger "workflow_run" -- they are both privileged and run in the target branch and repo --
  # which simplifies implementation.
  pull_request_target:
    types:
      # Re-evaluate immediately when the PR head or its policy-relevant labels change.
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
  workflow_run:
    # Re-evaluate as each mandatory status producer completes.
    workflows:
      - "ARM API Review: Automated Workflow"
      - "Swagger Avocado - Set Status"
      - "Swagger LintDiff - Set Status"
    types: [completed]

permissions:
  # actions.listWorkflowRunsForRepo
  # actions.listWorkflowRunArtifacts
  # actions.createWorkflowDispatch
  actions: write
  # default
  contents: read
  # issues.listLabelsOnIssue
  issues: read
  # pulls.get, issues.listLabelsOnIssue
  pull-requests: read
  # repos.getCombinedStatusForRef
  statuses: read

jobs:
  arm-universal-auto-signoff:
    name: ARM Universal Auto SignOff
    # Ignore skipped/cancelled parents. For open PRs, only handle changes that affect eligibility.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion != 'skipped' &&
       github.event.workflow_run.conclusion != 'cancelled') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.state == 'open' &&
       (github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened' ||
        github.event.action == 'edited' ||
        ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
         (github.event.label.name == 'Approved-Suppression' ||
          github.event.label.name == 'ARMAutoSignedOff' ||
          github.event.label.name == 'ARMManualSignoffRequired' ||
          github.event.label.name == 'ARMReview' ||
          github.event.label.name == 'ARMSignedOff' ||
          github.event.label.name == 'NotReadyForARMReview' ||
          github.event.label.name == 'SuppressionReviewRequired'))))

    runs-on: ubuntu-slim

    steps:
      # *** IMPORTANT ***
      # For workflows that are triggered by the pull_request_target event, the workflow runs in the
      # context of the base of the pull request.  You should make sure that you do not check out,
      # build, or run untrusted code from the head of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only needs .github folder for automation, not the files in the PR (analyzed in a
          # separate workflow).
          #
          # Uses the .github folder from the PR base branch (pull_request_target trigger),
          # or the repo default branch (other triggers).
          sparse-checkout: |
            .github

      - id: get-label-action
        name: ARM Universal Auto SignOff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: getLabelAction } =
              await import('${{ github.workspace }}/.github/workflows/src/arm-auto-signoff/arm-universal-auto-signoff.ts');
            return await getLabelAction({ github, context, core });

      # Update Labels applies these. The action is explicit: 'add' | 'remove' | 'none'.
      - if: fromJson(steps.get-label-action.outputs.result).labelActions['ARMSignedOff'] != 'none'
        name: Upload artifact for ARMSignedOff label
        uses: ./.github/actions/add-label-artifact
        with:
          name: "ARMSignedOff"
          value: "${{ fromJson(steps.get-label-action.outputs.result).labelActions['ARMSignedOff'] == 'add' }}"

      - if: fromJson(steps.get-label-action.outputs.result).labelActions['ARMAutoSignedOff'] != 'none'
        name: Upload artifact for ARMAutoSignedOff label
        uses: ./.github/actions/add-label-artifact
        with:
          name: "ARMAutoSignedOff"
          value: "${{ fromJson(steps.get-label-action.outputs.result).labelActions['ARMAutoSignedOff'] == 'add' }}"

      # Legacy markers are only ever removed.
      - if: fromJson(steps.get-label-action.outputs.result).labelActions['ARMAutoSignedOff-IncrementalTSP'] == 'remove'
        name: Upload artifact for ARMAutoSignedOff-IncrementalTSP label
        uses: ./.github/actions/add-label-artifact
        with:
          name: "ARMAutoSignedOff-IncrementalTSP"
          value: "false"

      - if: fromJson(steps.get-label-action.outputs.result).labelActions['ARMAutoSignedOff-Trivial'] == 'remove'
        name: Upload artifact for ARMAutoSignedOff-Trivial label
        uses: ./.github/actions/add-label-artifact
        with:
          name: "ARMAutoSignedOff-Trivial"
          value: "false"

      - if: fromJson(steps.get-label-action.outputs.result).labelActions['ARMManualSignoffRequired'] == 'add'
        name: Upload artifact for ARMManualSignoffRequired label
        uses: ./.github/actions/add-label-artifact
        with:
          name: "ARMManualSignoffRequired"
          value: "true"

      # The label updater uses these trusted artifacts to associate this workflow run with its PR.
      - if: |
          always() &&
          fromJson(steps.get-label-action.outputs.result).headSha
        name: Upload artifact with head SHA
        uses: ./.github/actions/add-empty-artifact
        with:
          name: "head-sha"
          value: "${{ fromJson(steps.get-label-action.outputs.result).headSha }}"

      - if: |
          always() &&
          fromJson(steps.get-label-action.outputs.result).issueNumber > 0
        name: Upload artifact with issue number
        uses: ./.github/actions/add-empty-artifact
        with:
          name: "issue-number"
          value: "${{ fromJson(steps.get-label-action.outputs.result).issueNumber }}"

      # Why dispatch explicitly: the reviewer dispatches this run with GITHUB_TOKEN, and GitHub does
      # not fire workflow_run for runs started that way. Update Labels' workflow_run trigger would
      # never see this run, so the label artifacts above would not be applied.
      # Why only workflow_dispatch: pull_request_target and workflow_run runs already trigger
      # Update Labels through workflow_run. Dispatching for them too would apply labels twice.
      # Skipped when there are no label changes to apply.
      - name: Dispatch Update Labels
        if: |
          github.event_name == 'workflow_dispatch' &&
          (contains(toJson(fromJson(steps.get-label-action.outputs.result).labelActions), '"add"') ||
           contains(toJson(fromJson(steps.get-label-action.outputs.result).labelActions), '"remove"'))
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { dispatchUpdateLabels } =
              await import('${{ github.workspace }}/.github/workflows/src/arm-auto-signoff/arm-signoff-dispatch.ts');
            await dispatchUpdateLabels({ github, context, core });
