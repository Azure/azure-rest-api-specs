# Prefix with "~" to sort last in Actions list
name: ~Templates - Set Run Status

on:
  workflow_call:
    inputs:
      monitored_workflow_name:
        description: Name of the workflow to monitor
        required: true
        type: string
      required_check_name:
        description: Name of the required check to update
        required: true
        type: string
      overriding_label:
        description: Comma-separated list of labels that, when any is set, causes the check to always pass
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  set-status:
    name: "${{ inputs.required_check_name }} - Set Status"

    # Triggered by the monitored "Analyze Code" run or by "Pull Request Event" intake. Intake
    # carries no trusted label name, so every intake event re-evaluates; setStatus reads the
    # current labels and runs, so this is idempotent.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped'

    runs-on: ubuntu-slim

    steps:
      # *** IMPORTANT ***
      # workflow_run runs from the default branch with a privileged token. Do not check out,
      # build, or run code from the head of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only needs .github folder for automation, not the files in the PR (analyzed in a
          # separate workflow).
          sparse-checkout: |
            .github

      - name: "Set Status"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: set-status
        env:
          MONITORED_WORKFLOW_NAME: ${{ inputs.monitored_workflow_name }}
          REQUIRED_CHECK_NAME: ${{ inputs.required_check_name }}
          OVERRIDING_LABEL: ${{ inputs.overriding_label }}
        with:
          script: |
            const { default: setStatus } =
                await import('${{ github.workspace }}/.github/workflows/src/set-status.ts');
            return await setStatus(
              { github, context, core },
              process.env.MONITORED_WORKFLOW_NAME,
              process.env.REQUIRED_CHECK_NAME,
              process.env.OVERRIDING_LABEL
            );

      - if: ${{ always() && steps.set-status.outputs.head_sha }}
        name: Upload artifact with head SHA
        uses: ./.github/actions/add-empty-artifact
        with:
          name: head-sha
          value: ${{ steps.set-status.outputs.head_sha }}

      - if: ${{ always() && steps.set-status.outputs.issue_number }}
        name: Upload artifact with issue number
        uses: ./.github/actions/add-empty-artifact
        with:
          name: issue-number
          value: ${{ steps.set-status.outputs.issue_number }}
