name: sdk-suppressions - Test

on:
  push:
    branches:
      - main
      - typespec-next
  pull_request:
    paths:
      - .editorconfig
      - .gitattributes
      - .npmrc
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - tsconfig.json
      - .github/actions/setup-node-install-deps/**
      - .github/shared/**
      - .github/workflows/_reusable-eng-tools-test.yaml
      - .github/workflows/sdk-suppressions-test.yaml
      - eng/tools/package.json
      - eng/tools/tsconfig.json
      - eng/tools/eslint.base.config.js
      - eng/tools/vitest.base.config.js
      - eng/tools/.prettierrc.yaml
      - eng/tools/.prettierignore
      - eng/tools/sdk-suppressions/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdkSuppressions:
    name: sdk-suppressions
    uses: ./.github/workflows/_reusable-eng-tools-test.yaml
    with:
      package: sdk-suppressions
