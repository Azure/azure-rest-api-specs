name: SDK Breaking Change Analysis

on:
  workflow_run:
    workflows: ["SDK Breaking Change Labels"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to analyze"
        required: true
        type: string
      sdk_language:
        description: "SDK language: Cpp, DotNet, Go, Java, JavaScript, Python, or Rust"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  copilot-requests: write
  issues: write
  pull-requests: write

jobs:
  resolve-trigger:
    runs-on: ubuntu-slim
    outputs:
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      sdk-language: ${{ steps.resolve.outputs.sdk-language }}
      should-run: ${{ steps.resolve.outputs.should-run }}
    steps:
      - name: Resolve trigger inputs
        id: resolve
        uses: actions/github-script@v9
        env:
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          SDK_LANGUAGE_INPUT: ${{ inputs.sdk_language }}
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              core.setOutput("pr-number", process.env.PR_NUMBER_INPUT);
              core.setOutput("head-sha", "");
              core.setOutput("sdk-language", process.env.SDK_LANGUAGE_INPUT);
              core.setOutput("should-run", "true");
              return;
            }

            if (context.payload.workflow_run.conclusion !== "success") {
              core.notice("The SDK Breaking Change Labels workflow did not succeed.");
              core.setOutput("should-run", "false");
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                ...context.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              },
            );
            const artifactNames = artifacts.map(({ name }) => name);
            const artifactValue = (key) => {
              const prefix = `${key}=`;
              return artifactNames.find((name) => name.startsWith(prefix))?.slice(prefix.length);
            };
            const languagesByLabel = new Map([
              ["BreakingChange-.Net-Sdk", ".Net"],
              ["BreakingChange-Go-Sdk", "Go"],
              ["BreakingChange-Java-Sdk", "Java"],
              ["BreakingChange-JavaScript-Sdk", "JavaScript"],
              ["BreakingChange-Python-Sdk", "Python"],
            ]);
            const labelArtifacts = artifactNames
              .map((name) => /^label-(.+)=(true|false)$/.exec(name))
              .filter((match) => match && languagesByLabel.has(match[1]));
            if (labelArtifacts.length === 0) {
              core.notice("No supported SDK breaking-change label artifact was published.");
              core.setOutput("should-run", "false");
              return;
            }
            if (labelArtifacts.length > 1) {
              throw new Error(
                `Expected one SDK breaking-change label artifact, found: ${labelArtifacts.map((match) => match[0]).join(", ")}`,
              );
            }

            const [, labelName, labelValue] = labelArtifacts[0];
            const sdkLanguage = languagesByLabel.get(labelName);

            core.setOutput("pr-number", artifactValue("issue-number"));
            core.setOutput("head-sha", artifactValue("head-sha"));
            core.setOutput("sdk-language", sdkLanguage);
            core.setOutput("should-run", labelValue);

  analyze:
    needs: resolve-trigger
    if: needs.resolve-trigger.outputs.should-run == 'true'
    concurrency:
      group: >-
        sdk-breaking-analysis-${{ needs.resolve-trigger.outputs.pr-number }}-${{
        needs.resolve-trigger.outputs.sdk-language }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      AZSDK_CLI_PATH: /tmp/bin

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Azure SDK CLI
        shell: pwsh
        run: ./eng/common/mcp/azure-sdk-mcp.ps1 -InstallDirectory $env:AZSDK_CLI_PATH

      - name: Resolve inputs and repositories
        id: resolve-source
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.resolve-trigger.outputs.pr-number }}
          SDK_LANGUAGE_INPUT: ${{ needs.resolve-trigger.outputs.sdk-language }}
          TRIGGER_SHA: ${{ needs.resolve-trigger.outputs.head-sha }}
        with:
          script: |
            const pullNumber = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
              throw new Error(`Invalid pull request number: ${process.env.PR_NUMBER}`);
            }
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });

            const sdkLanguageInput = process.env.SDK_LANGUAGE_INPUT;

            const { resolveSdkLanguageConfig } =
              await import('${{ github.workspace }}/.github/workflows/src/sdk-breaking-change/resolve-analysis-inputs.ts');
            const languageConfig = resolveSdkLanguageConfig(sdkLanguageInput);

            core.setOutput("repository", pull.head.repo.full_name);
            core.setOutput("sha", process.env.TRIGGER_SHA || pull.head.sha);
            core.setOutput("sdk-repository", languageConfig.repository);
            core.setOutput("sdk-language", languageConfig.language);

      - name: Checkout specification PR source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.resolve-source.outputs.repository }}
          ref: ${{ steps.resolve-source.outputs.sha }}
          path: repositories/azure-rest-api-specs
          persist-credentials: false

      - name: Resolve TypeSpec config path
        id: resolve-tsp-config
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.resolve-trigger.outputs.pr-number }}
          SPEC_REPOSITORY_PATH: ${{ github.workspace }}/repositories/azure-rest-api-specs
        with:
          script: |
            const { resolveChangedTypeSpecProjects } =
              await import('${{ github.workspace }}/.github/workflows/src/sdk-breaking-change/resolve-analysis-inputs.ts');
            await resolveChangedTypeSpecProjects({ github, context, core });

      - name: Checkout target SDK repository
        uses: actions/checkout@v7
        with:
          repository: Azure/${{ steps.resolve-source.outputs.sdk-repository }}
          ref: main
          path: repositories/${{ steps.resolve-source.outputs.sdk-repository }}
          persist-credentials: false

      - name: Set up Go
        if: steps.resolve-source.outputs.sdk-language == 'Go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Set up .NET
        if: steps.resolve-source.outputs.sdk-language == 'DotNet'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python
        if: steps.resolve-source.outputs.sdk-language == 'Python'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Python SDK environment
        if: steps.resolve-source.outputs.sdk-language == 'Python'
        shell: bash
        working-directory: repositories/${{ steps.resolve-source.outputs.sdk-repository }}
        run: |
          python -m pip install -U pip > /dev/null
          python -m pip install 'eng/tools/azure-sdk-tools[ghtools]' > /dev/null

      - name: Install golangci-lint
        if: steps.resolve-source.outputs.sdk-language == 'Go'
        shell: bash
        run: |
          set -euo pipefail
          GO_BIN="$(go env GOPATH)/bin"
          echo "$GO_BIN" >> "$GITHUB_PATH"
          export PATH="$GO_BIN:$PATH"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.2
          golangci-lint --version

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Set up GitHub Copilot CLI
        id: setup-copilot-cli
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/copilot-cli"
          npm_config_ignore_scripts=false npm install \
            --global \
            --prefix "$install_dir" \
            @github/copilot
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          copilot_path="$install_dir/bin/copilot"
          test -x "$copilot_path"
          "$copilot_path" --version
          echo "path=$copilot_path" >> "$GITHUB_OUTPUT"

      - name: Set up SDK development environment
        shell: bash
        env:
          SDK_REPOSITORY_PATH: ${{ github.workspace }}/repositories/${{ steps.resolve-source.outputs.sdk-repository }}
          SDK_LANGUAGE: ${{ steps.resolve-source.outputs.sdk-language }}
        run: |
          set -euo pipefail
          echo "$AZSDK_CLI_PATH" >> "$GITHUB_PATH"
          export PATH="$AZSDK_CLI_PATH:$PATH"
          azsdk verify setup install \
            --languages "$SDK_LANGUAGE" \
            --package-path "$SDK_REPOSITORY_PATH" \
            --yes

      - name: Analyze SDK projects
        id: analyze-sdk-projects
        shell: bash
        env:
          AZSDK_COPILOT_CLI_PATH: ${{ steps.setup-copilot-cli.outputs.path }}
          AZSDK_COPILOT_GITHUB_TOKEN: ${{ github.token }}
          LOCAL_SDK_REPO_PATH: ${{ github.workspace }}/repositories/${{ steps.resolve-source.outputs.sdk-repository }}
          SPEC_REPOSITORY_PATH: ${{ github.workspace }}/repositories/azure-rest-api-specs
          TYPESPEC_CONFIG_PATHS: ${{ steps.resolve-tsp-config.outputs.tsp-config-paths }}
        run: |
          set -Eeuo pipefail
          results_dir="$RUNNER_TEMP/sdk-breaking-change-results"
          mkdir -p "$results_dir"
          analysis_log="$results_dir/analysis.log"
          exec > >(tee "$analysis_log") 2>&1
          trap 'status=$?; printf "Analysis failed with exit code %s.\n" "$status" > "$results_dir/error.log"; exit "$status"' ERR
          jq -cn \
            --argjson pullNumber '${{ needs.resolve-trigger.outputs.pr-number }}' \
            --arg sdkLanguage '${{ steps.resolve-source.outputs.sdk-language }}' \
            '{pullNumber: $pullNumber, sdkLanguage: $sdkLanguage}' \
            > "$results_dir/trigger.json"
          manifest_jsonl="$results_dir/projects.jsonl"
          : > "$manifest_jsonl"
          echo '[]' > "$results_dir/projects.json"
          mapfile -t typespec_config_paths < <(jq -r '.[]' <<< "$TYPESPEC_CONFIG_PATHS")
          declare -A package_names=()
          project_number=0

          for index in "${!typespec_config_paths[@]}"; do
            relative_tsp_config_path="${typespec_config_paths[$index]}"
            typespec_project_path="${relative_tsp_config_path%/tspconfig.yaml}"
            tsp_config_path="$SPEC_REPOSITORY_PATH/$relative_tsp_config_path"
            project_number="$((index + 1))"
            marker="$RUNNER_TEMP/azsdk-generation-started"
            generation_result="$RUNNER_TEMP/sdk-generation-result.json"
            touch "$marker"

            azsdk package generate \
              --local-sdk-repo-path "$LOCAL_SDK_REPO_PATH" \
              --tsp-config-path "$tsp_config_path" \
              --output json | tee "$generation_result"

            mapfile -d '' generated_configs < <(
              find "$LOCAL_SDK_REPO_PATH" -type f -name tsp-location.yaml -newer "$marker" -print0
            )
            if [[ ${#generated_configs[@]} -ne 1 ]]; then
              echo "Expected exactly one generated tsp-location.yaml for $typespec_project_path, found ${#generated_configs[@]}." >&2
              printf '  %s\n' "${generated_configs[@]}" >&2
              exit 1
            fi

            package_path="$(realpath "$(dirname "${generated_configs[0]}")")"
            if [[ ! -d "$package_path" || "$package_path" != "$LOCAL_SDK_REPO_PATH"/* ]]; then
              echo "Invalid generated package path: $package_path" >&2
              exit 1
            fi
            package_name="$(basename "$package_path")"
            if [[ -n "${package_names[$package_name]:-}" ]]; then
              relative_results_path="$package_name-$project_number"
            else
              relative_results_path="$package_name"
            fi
            package_names["$package_name"]=1
            project_results="$results_dir/$relative_results_path"
            mkdir -p "$project_results"
            mv "$generation_result" "$project_results/generate.json"

            azsdk package build \
              --package-path "$package_path" \
              --output json | tee "$project_results/build.json"

            azsdk package detect-breaking-change \
              --package-path "$package_path" \
              --tsp-config-path "$tsp_config_path" \
              --output json | tee "$project_results/breaking-changes.json"

            jq -cn \
              --arg typespecProjectPath "$typespec_project_path" \
              --arg packageName "$package_name" \
              --arg resultsPath "$relative_results_path" \
              '{typespecProjectPath: $typespecProjectPath, packageName: $packageName, resultsPath: $resultsPath}' \
              >> "$manifest_jsonl"
            jq -s '.' "$manifest_jsonl" > "$results_dir/projects.json"
          done

          rm "$manifest_jsonl"

      - name: Publish result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ANALYSIS_OUTCOME: ${{ steps.analyze-sdk-projects.outcome }}
          ANALYZED_SHA: ${{ steps.resolve-source.outputs.sha }}
          JOB_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
        run: |
          {
            echo "## SDK breaking-change analysis"
            echo
            if [[ -n "$ANALYZED_SHA" ]]; then
              printf '%s\n\n' "**Analyzed commit:** \`$ANALYZED_SHA\`"
            fi
            if [[ "$JOB_STATUS" == "failure" ]]; then
              echo "Breaking change analysis failed."
              echo
              analysis_log="$RUNNER_TEMP/sdk-breaking-change-results/analysis.log"
              if [[ "$ANALYSIS_OUTCOME" == "failure" && -f "$analysis_log" ]]; then
                echo "### Error"
                echo
                tail -n 30 "$analysis_log" | sed 's/^/    /'
                echo
              else
                echo "Error output is available in the failed step log."
                echo
              fi
              echo "[See failed step]($JOB_LOG_URL)"
            else
              manifest="$RUNNER_TEMP/sdk-breaking-change-results/projects.json"
              if [[ -f "$manifest" ]]; then
              while IFS= read -r project; do
                typespec_project_path="$(jq -r '.typespecProjectPath' <<< "$project")"
                package_name="$(jq -r '.packageName' <<< "$project")"
                results_path="$RUNNER_TEMP/sdk-breaking-change-results/$(jq -r '.resultsPath' <<< "$project")"
                echo "### $typespec_project_path"
                echo
                echo "**SDK Package:** $package_name"
                echo
                for result in generate.json build.json breaking-changes.json; do
                  path="$results_path/$result"
                  if [[ -f "$path" ]]; then
                    echo "#### $result"
                    echo '```json'
                    cat "$path"
                    echo '```'
                  fi
                done
              done < <(jq -c '.[]' "$manifest")
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SDK analysis results
        id: upload-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-breaking-change-results
          path: ${{ runner.temp }}/sdk-breaking-change-results
          if-no-files-found: warn
          retention-days: 7

      - name: Check analysis freshness
        if: always() && steps.resolve-source.outputs.sha != ''
        id: check-analysis-freshness
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.resolve-trigger.outputs.pr-number }}
          ANALYZED_SHA: ${{ steps.resolve-source.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullNumber = Number(process.env.PR_NUMBER);
            const analyzedSha = process.env.ANALYZED_SHA;
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            const isCurrent = pull.head.sha === analyzedSha;
            core.setOutput("is-current", String(isCurrent));
            if (!isCurrent) {
              core.warning(
                `Analysis result for ${analyzedSha} is stale; current PR head is ${pull.head.sha}.`,
              );
              await core.summary
                .addRaw(
                  [
                    "",
                    "> [!WARNING]",
                    `> This result is stale. The analyzed commit was \`${analyzedSha}\`, but the current PR head is \`${pull.head.sha}\`. It was not published to the pull request.`,
                  ].join("\n"),
                )
                .write();
            }

      - name: Surface SDK breaking changes on pull request
        if: success() && steps.check-analysis-freshness.outputs.is-current == 'true'
        uses: actions/github-script@v9
        env:
          WORKFLOW_SUMMARY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#summary-${{ job.check_run_id }}
          MANIFEST_PATH: ${{ runner.temp }}/sdk-breaking-change-results/projects.json
          RESULTS_PATH: ${{ runner.temp }}/sdk-breaking-change-results
          PR_NUMBER: ${{ needs.resolve-trigger.outputs.pr-number }}
          SDK_LANGUAGE: ${{ steps.resolve-source.outputs.sdk-language }}
          ANALYZED_SHA: ${{ steps.resolve-source.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = await import("node:fs/promises");
            const pullNumber = Number(process.env.PR_NUMBER);
            const projects = JSON.parse(await fs.readFile(process.env.MANIFEST_PATH, "utf8"));
            const projectReports = await Promise.all(
              projects.map(async (project) => {
                const resultPath = `${process.env.RESULTS_PATH}/${project.resultsPath}/breaking-changes.json`;
                const response = JSON.parse(await fs.readFile(resultPath, "utf8"));
                const changes = response?.result?.breakingChanges ?? [];
                const escapeTableCell = (value, fallback = "-") => {
                  const text = String(value ?? "").trim();
                  return text
                    ? text.replaceAll("\r", "").replaceAll("|", "\\|").replaceAll("\n", "<br>")
                    : fallback;
                };
                const changeDetails = changes.map((change) => {
                  const details = typeof change === "object" && change !== null ? change : {};
                  const text = escapeTableCell(details.breakingChange ?? change);
                  const category = escapeTableCell(details.category);
                  const suggestedFix = escapeTableCell(details.resolution);
                  return { text, category, suggestedFix };
                });
                const tableRows = changeDetails.length
                  ? changeDetails.map(
                      ({ text, category, suggestedFix }) =>
                        `| ☐ | ${text} | ${category} | ${suggestedFix} |`,
                    )
                  : [
                      "| ☐ | No SDK breaking changes detected. | - | - |",
                    ];
                const projectReport = [
                  `**Typespec Project:** ${project.typespecProjectPath}`,
                  "",
                  `**SDK Package:** ${project.packageName}`,
                  "",
                  "|  | Breaking change | Category | Suggested fix |",
                  "| --- | --- | --- | --- |",
                  ...tableRows,
                ];
                if (process.env.WORKFLOW_SUMMARY_URL) {
                  projectReport.push(
                    "",
                    `[SDK breaking change details (${project.resultsPath}/breaking-changes.json)](${process.env.WORKFLOW_SUMMARY_URL})`,
                  );
                }
                return projectReport;
              }),
            );

            const report = [
              `## SDK Breaking changes for ${process.env.SDK_LANGUAGE}`,
              "",
              `**Analyzed commit:** \`${process.env.ANALYZED_SHA}\``,
              "",
              ...projectReports.flatMap((projectReport) => [...projectReport, ""]),
            ].join("\n");

            const command = `/azsdk sdk-breaking-analysis ${process.env.SDK_LANGUAGE}`;
            const body = `${command}\n\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existingComment = comments
              .filter(({ body }) => body?.trimStart().toLowerCase().startsWith(command.toLowerCase()))
              .sort((left, right) => right.id - left.id)[0];

            if (existingComment) {
              try {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: existingComment.id,
                  body,
                });
                return;
              } catch (error) {
                if (error.status !== 403) throw error;
                core.warning(
                  "The workflow token cannot edit the existing analysis comment; creating a new comment instead.",
                );
              }
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pullNumber,
              body,
            });

      - name: Trigger SDK breaking-change mitigation
        if: success() && steps.check-analysis-freshness.outputs.is-current == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.resolve-trigger.outputs.pr-number }}
          SDK_LANGUAGE: ${{ steps.resolve-source.outputs.sdk-language }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullNumber = Number(process.env.PR_NUMBER);
            const sdkLanguage = process.env.SDK_LANGUAGE;
            const command = `/azsdk sdk-breaking-mitigate ${sdkLanguage}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existingComment = comments
              .filter(
                ({ body }) =>
                  body?.split(/\r?\n/, 1)[0].trim().toLowerCase() === command.toLowerCase(),
              )
              .sort((left, right) => right.id - left.id)[0];

            let comment;
            if (existingComment) {
              try {
                ({ data: comment } = await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: existingComment.id,
                  body: command,
                }));
              } catch (error) {
                if (error.status !== 403) throw error;
                core.warning(
                  "The workflow token cannot edit the existing mitigation command; creating a new comment instead.",
                );
              }
            }
            if (!comment) {
              ({ data: comment } = await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pullNumber,
                body: command,
              }));
            }

            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "sdk-breaking-change-mitigate.yaml",
              ref: context.payload.repository.default_branch,
              inputs: {
                pr_number: String(pullNumber),
                sdk_language: sdkLanguage,
                trigger_comment_id: String(comment.id),
              },
            });

      - name: Report breaking-change analysis failure
        if: >-
          failure() &&
          (steps.resolve-source.outputs.sha == '' ||
          steps.check-analysis-freshness.outputs.is-current == 'true')
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.resolve-trigger.outputs.pr-number }}
          ANALYSIS_OUTCOME: ${{ steps.analyze-sdk-projects.outcome }}
          ANALYZED_SHA: ${{ steps.resolve-source.outputs.sha }}
          RESULTS_PATH: ${{ runner.temp }}/sdk-breaking-change-results
          JOB_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = await import("node:fs/promises");
            let errorDetails = "";
            if (process.env.ANALYSIS_OUTCOME === "failure") {
              try {
                const analysisLog = await fs.readFile(
                  `${process.env.RESULTS_PATH}/analysis.log`,
                  "utf8",
                );
                errorDetails = analysisLog
                  .trim()
                  .split(/\r?\n/)
                  .slice(-30)
                  .map((line) => `    ${line}`)
                  .join("\n");
              } catch (error) {
                core.warning(`Unable to read the analysis error log: ${error.message}`);
              }
            }
            const failureReport = [
              "> [!CAUTION]\n> Breaking change analysis failed",
              process.env.ANALYZED_SHA && `\n**Analyzed commit:** \`${process.env.ANALYZED_SHA}\``,
              errorDetails && `\n${errorDetails}`,
              `\n[See failed step](${process.env.JOB_LOG_URL})`,
            ]
              .filter(Boolean)
              .join("\n");
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: failureReport,
            });
