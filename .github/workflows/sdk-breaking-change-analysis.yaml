name: SDK Breaking Change Analysis - Analyze

on:
  workflow_run:
    workflows: ["SDK Breaking Change Labels"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to analyze"
        required: true
        type: string
      sdk_language:
        description: "SDK language: .NET, Go, Java, JavaScript, Python"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  resolve-trigger:
    runs-on: ubuntu-slim
    outputs:
      head-repository: ${{ steps.resolve.outputs.head-repository }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      sdk-language: ${{ steps.resolve.outputs.sdk-language }}
      sdk-repository: ${{ steps.resolve.outputs.sdk-repository }}
      should-run: ${{ steps.resolve.outputs.should-run }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
          persist-credentials: false

      - name: Resolve trigger inputs
        id: resolve
        uses: actions/github-script@v9
        env:
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          SDK_LANGUAGE_INPUT: ${{ inputs.sdk_language }}
        with:
          script: |
            const { resolveAnalysisTrigger } =
              await import('${{ github.workspace }}/.github/workflows/src/sdk-breaking-change/resolve-analysis-inputs.ts');
            await resolveAnalysisTrigger({ github, context, core });

  analyze:
    needs: resolve-trigger
    if: needs.resolve-trigger.outputs.should-run == 'true'
    permissions:
      contents: read
      copilot-requests: write
      pull-requests: read
    concurrency:
      group: >-
        sdk-breaking-analysis-${{ needs.resolve-trigger.outputs.pr-number }}-${{
        needs.resolve-trigger.outputs.sdk-language }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      AZSDK_CLI_PATH: /tmp/bin

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            eng
          persist-credentials: false

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - name: Install Azure SDK CLI
        shell: pwsh
        run: ./eng/common/mcp/azure-sdk-mcp.ps1 -InstallDirectory $env:AZSDK_CLI_PATH

      - name: Checkout specification PR head
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve-trigger.outputs.head-repository }}
          ref: ${{ needs.resolve-trigger.outputs.head-sha }}
          path: repositories/azure-rest-api-specs
          persist-credentials: false
      - name: Resolve TypeSpec config path
        id: resolve-tsp-config
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.resolve-trigger.outputs.pr-number }}
          SPEC_REPOSITORY_PATH: ${{ github.workspace }}/repositories/azure-rest-api-specs
        with:
          script: |
            const { resolveChangedTypeSpecProjects } =
              await import('${{ github.workspace }}/.github/workflows/src/sdk-breaking-change/resolve-analysis-inputs.ts');
            await resolveChangedTypeSpecProjects({ github, context, core });

      - name: Checkout target SDK repository
        uses: actions/checkout@v7
        with:
          repository: Azure/${{ needs.resolve-trigger.outputs.sdk-repository }}
          ref: main
          path: repositories/${{ needs.resolve-trigger.outputs.sdk-repository }}
          persist-credentials: false

      - name: Set up Go
        if: needs.resolve-trigger.outputs.sdk-language == 'Go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Set up .NET
        if: needs.resolve-trigger.outputs.sdk-language == 'DotNet'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python
        if: needs.resolve-trigger.outputs.sdk-language == 'Python'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Python SDK environment
        if: needs.resolve-trigger.outputs.sdk-language == 'Python'
        shell: bash
        working-directory: repositories/${{ needs.resolve-trigger.outputs.sdk-repository }}
        run: |
          python -m pip install -U pip > /dev/null
          python -m pip install 'eng/tools/azure-sdk-tools[ghtools]' > /dev/null

      - name: Install golangci-lint
        if: needs.resolve-trigger.outputs.sdk-language == 'Go'
        shell: bash
        run: |
          set -euo pipefail
          GO_BIN="$(go env GOPATH)/bin"
          echo "$GO_BIN" >> "$GITHUB_PATH"
          export PATH="$GO_BIN:$PATH"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.2
          golangci-lint --version

      - name: Set up GitHub Copilot CLI
        id: setup-copilot-cli
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/copilot-cli"
          npm_config_ignore_scripts=false npm install \
            --global \
            --prefix "$install_dir" \
            @github/copilot
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          copilot_path="$install_dir/bin/copilot"
          test -x "$copilot_path"
          "$copilot_path" --version
          echo "path=$copilot_path" >> "$GITHUB_OUTPUT"

      - name: Set up SDK development environment
        shell: bash
        env:
          SDK_REPOSITORY_PATH: ${{ github.workspace }}/repositories/${{ needs.resolve-trigger.outputs.sdk-repository }}
          SDK_LANGUAGE: ${{ needs.resolve-trigger.outputs.sdk-language }}
        run: |
          set -euo pipefail
          echo "$AZSDK_CLI_PATH" >> "$GITHUB_PATH"
          export PATH="$AZSDK_CLI_PATH:$PATH"
          azsdk verify setup install \
            --languages "$SDK_LANGUAGE" \
            --package-path "$SDK_REPOSITORY_PATH" \
            --yes

      - name: Analyze SDK projects
        id: analyze-sdk-projects
        shell: bash
        env:
          AZSDK_COPILOT_CLI_PATH: ${{ steps.setup-copilot-cli.outputs.path }}
          AZSDK_COPILOT_GITHUB_TOKEN: ${{ github.token }}
          LOCAL_SDK_REPO_PATH: ${{ github.workspace }}/repositories/${{ needs.resolve-trigger.outputs.sdk-repository }}
          SPEC_REPOSITORY_PATH: ${{ github.workspace }}/repositories/azure-rest-api-specs
          TYPESPEC_CONFIG_PATHS: ${{ steps.resolve-tsp-config.outputs.tsp-config-paths }}
        run: |
          set -Eeuo pipefail
          results_dir="$RUNNER_TEMP/sdk-breaking-change-results"
          mkdir -p "$results_dir"
          analysis_log="$results_dir/analysis.log"
          exec > >(tee "$analysis_log") 2>&1
          trap 'status=$?; printf "Analysis failed with exit code %s.\n" "$status" > "$results_dir/error.log"; exit "$status"' ERR
          jq -cn \
            --argjson pullNumber '${{ needs.resolve-trigger.outputs.pr-number }}' \
            --arg sdkLanguage '${{ needs.resolve-trigger.outputs.sdk-language }}' \
            --arg analyzedSha '${{ needs.resolve-trigger.outputs.sha }}' \
            --arg workflowUrl '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            '{pullNumber: $pullNumber, sdkLanguage: $sdkLanguage, analyzedSha: $analyzedSha, workflowUrl: $workflowUrl}' \
            > "$results_dir/trigger.json"
          manifest_jsonl="$results_dir/projects.jsonl"
          : > "$manifest_jsonl"
          echo '[]' > "$results_dir/projects.json"
          mapfile -t typespec_config_paths < <(jq -r '.[]' <<< "$TYPESPEC_CONFIG_PATHS")
          declare -A package_names=()
          project_number=0

          for index in "${!typespec_config_paths[@]}"; do
            relative_tsp_config_path="${typespec_config_paths[$index]}"
            typespec_project_path="${relative_tsp_config_path%/tspconfig.yaml}"
            tsp_config_path="$SPEC_REPOSITORY_PATH/$relative_tsp_config_path"
            project_number="$((index + 1))"
            marker="$RUNNER_TEMP/azsdk-generation-started"
            generation_result="$RUNNER_TEMP/sdk-generation-result.json"
            touch "$marker"

            azsdk package generate \
              --local-sdk-repo-path "$LOCAL_SDK_REPO_PATH" \
              --tsp-config-path "$tsp_config_path" \
              --output json | tee "$generation_result"

            mapfile -d '' generated_configs < <(
              find "$LOCAL_SDK_REPO_PATH" -type f -name tsp-location.yaml -newer "$marker" -print0
            )
            if [[ ${#generated_configs[@]} -ne 1 ]]; then
              echo "Expected exactly one generated tsp-location.yaml for $typespec_project_path, found ${#generated_configs[@]}." >&2
              printf '  %s\n' "${generated_configs[@]}" >&2
              exit 1
            fi

            package_path="$(realpath "$(dirname "${generated_configs[0]}")")"
            if [[ ! -d "$package_path" || "$package_path" != "$LOCAL_SDK_REPO_PATH"/* ]]; then
              echo "Invalid generated package path: $package_path" >&2
              exit 1
            fi
            package_name="$(basename "$package_path")"
            if [[ -n "${package_names[$package_name]:-}" ]]; then
              relative_results_path="$package_name-$project_number"
            else
              relative_results_path="$package_name"
            fi
            package_names["$package_name"]=1
            project_results="$results_dir/$relative_results_path"
            mkdir -p "$project_results"
            mv "$generation_result" "$project_results/generate.json"

            azsdk package build \
              --package-path "$package_path" \
              --output json | tee "$project_results/build.json"

            azsdk package detect-breaking-change \
              --package-path "$package_path" \
              --tsp-config-path "$tsp_config_path" \
              --output json | tee "$project_results/breaking-changes.json"

            jq -cn \
              --arg typespecProjectPath "$typespec_project_path" \
              --arg packageName "$package_name" \
              --arg resultsPath "$relative_results_path" \
              '{typespecProjectPath: $typespecProjectPath, packageName: $packageName, resultsPath: $resultsPath}' \
              >> "$manifest_jsonl"
            jq -s '.' "$manifest_jsonl" > "$results_dir/projects.json"
          done

          rm "$manifest_jsonl"

      - name: Publish result summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ANALYSIS_OUTCOME: ${{ steps.analyze-sdk-projects.outcome }}
          ANALYZED_SHA: ${{ needs.resolve-trigger.outputs.head-sha }}
          JOB_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
        run: |
          {
            echo "## SDK breaking-change analysis"
            echo
            if [[ -n "$ANALYZED_SHA" ]]; then
              printf '%s\n\n' "**Analyzed commit:** \`$ANALYZED_SHA\`"
            fi
            if [[ "$JOB_STATUS" == "failure" ]]; then
              echo "Breaking change analysis failed."
              echo
              analysis_log="$RUNNER_TEMP/sdk-breaking-change-results/analysis.log"
              if [[ "$ANALYSIS_OUTCOME" == "failure" && -f "$analysis_log" ]]; then
                echo "### Error"
                echo
                tail -n 30 "$analysis_log" | sed 's/^/    /'
                echo
              else
                echo "Error output is available in the failed step log."
                echo
              fi
              echo "[See failed step]($JOB_LOG_URL)"
            else
              manifest="$RUNNER_TEMP/sdk-breaking-change-results/projects.json"
              if [[ -f "$manifest" ]]; then
              while IFS= read -r project; do
                typespec_project_path="$(jq -r '.typespecProjectPath' <<< "$project")"
                package_name="$(jq -r '.packageName' <<< "$project")"
                results_path="$RUNNER_TEMP/sdk-breaking-change-results/$(jq -r '.resultsPath' <<< "$project")"
                echo "### $typespec_project_path"
                echo
                echo "**SDK Package:** $package_name"
                echo
                for result in generate.json build.json breaking-changes.json; do
                  path="$results_path/$result"
                  if [[ -f "$path" ]]; then
                    echo "#### $result"
                    echo '```json'
                    cat "$path"
                    echo '```'
                  fi
                done
              done < <(jq -c '.[]' "$manifest")
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create SDK analysis result artifact
        if: always() && needs.resolve-trigger.outputs.head-sha != ''
        uses: actions/github-script@v9
        env:
          RESULTS_PATH: ${{ runner.temp }}/sdk-breaking-change-results
          PR_NUMBER: ${{ needs.resolve-trigger.outputs.pr-number }}
          HEAD_SHA: ${{ needs.resolve-trigger.outputs.head-sha }}
          SDK_LANGUAGE: ${{ needs.resolve-trigger.outputs.sdk-language }}
          ANALYSIS_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ steps.analyze-sdk-projects.outcome == 'success' && 'success' || 'failure' }}
        with:
          script: |
            const { createAnalysisResult } =
              await import('${{ github.workspace }}/.github/workflows/src/sdk-breaking-change/create-analysis-result.ts');
            await createAnalysisResult({
              resultsPath: process.env.RESULTS_PATH,
              prNumber: Number(process.env.PR_NUMBER),
              headSha: process.env.HEAD_SHA,
              sdkLanguage: process.env.SDK_LANGUAGE,
              analysisWorkflowUrl: process.env.ANALYSIS_WORKFLOW_URL,
              status: process.env.STATUS,
            });

      - name: Upload SDK analysis results
        id: upload-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-breaking-change-results
          path: ${{ runner.temp }}/sdk-breaking-change-results/sdk-breaking-change-analysis.json
          if-no-files-found: warn
          retention-days: 7
