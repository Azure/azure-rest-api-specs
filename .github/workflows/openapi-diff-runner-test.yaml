name: openapi-diff-runner - Test

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .editorconfig
      - .gitattributes
      - .npmrc
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - tsconfig.json
      - .github/actions/setup-node-install-deps/**
      - .github/shared/**
      - .github/workflows/_reusable-eng-tools-test.yaml
      - .github/workflows/openapi-diff-runner-test.yaml
      - eng/tools/package.json
      - eng/tools/tsconfig.json
      - eng/tools/eslint.base.config.js
      - eng/tools/vitest.base.config.js
      - eng/tools/.prettierrc.yaml
      - eng/tools/.prettierignore
      - eng/tools/openapi-diff-runner/**
      - eng/tools/suppressions/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapiDiffRunner:
    name: openapi-diff-runner
    uses: ./.github/workflows/_reusable-eng-tools-test.yaml
    with:
      package: openapi-diff-runner
      lint: false
