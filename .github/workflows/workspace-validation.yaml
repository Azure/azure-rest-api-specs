name: Workspace Validation

on:
  push:
    branches:
      - main
    paths:
      - "**/package.json"
      - pnpm-workspace.yaml
      - .github/workflows/workspace-validation.yaml
      - .github/workflows/src/check-catalog.ts
      - .github/workflows/cmd/check-catalog.ts
  pull_request:
    paths:
      - "**/package.json"
      - pnpm-workspace.yaml
      - .github/workflows/workspace-validation.yaml
      - .github/workflows/src/check-catalog.ts
      - .github/workflows/cmd/check-catalog.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep every manifest so new workspace locations are checked too.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            /pnpm-workspace.yaml
            /.github/workflows/src/check-catalog.ts
            /.github/workflows/cmd/check-catalog.ts

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # Run Node directly so pnpm run does not auto-install workspace dependencies.
      - run: node ./.github/workflows/cmd/check-catalog.ts
