# Protected Labels - Enforces that only authorized users can apply certain labels.
# Reads authorized users from .github/protected-labels.yml.
# If an unauthorized user applies a protected label, the bot removes it and posts a warning.
name: "Protected Labels"

on:
  pull_request_target:
    types:
      - labeled

permissions:
  contents: read
  pull-requests: write

jobs:
  check-label:
    name: Check Protected Label
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/

      - name: Install workflow dependencies
        uses: ./.github/actions/install-workflow-deps

      - name: Validate label authorization
        run: node "${{ github.workspace }}/.github/workflows/cmd/protected-labels.ts"
        env:
          GITHUB_TOKEN: ${{ github.token }}
