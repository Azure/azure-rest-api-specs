name: "Swagger Avocado - Set Status"

on: # zizmor: ignore[dangerous-triggers] Fork PR updates require this; only default-branch code runs.
  # "Pull Request Event" is an unprivileged pull_request intake. Re-evaluate on its completion
  # so opened/synchronize/reopened and manual label changes still update the status.
  workflow_run:
    # Trigger on both old and new names, to handle the rename more gracefully
    workflows:
      - "Swagger Avocado - Analyze Code"
      - "\\[TEST-IGNORE\\] Swagger Avocado - Analyze Code"
      - "Pull Request Event"
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  avocado-status:
    name: Set Avocado Status
    uses: $/.github/workflows/_reusable-set-check-status.yaml
    with:
      monitored_workflow_name: "Swagger Avocado - Analyze Code"
      required_check_name: "Swagger Avocado"
      overriding_label: "Approved-Avocado"
