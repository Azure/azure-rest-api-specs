name: Target Branch

on: # zizmor: ignore[dangerous-triggers] Reports on fork PRs using only trusted default-branch code.
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: target-branch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  report:
    name: Report target branch
    if: github.repository == 'Azure/azure-rest-api-specs-pr'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { checkTargetBranch } =
              await import('${{ github.workspace }}/.github/workflows/src/target-branch.ts');
            await checkTargetBranch({ github, context, core });
