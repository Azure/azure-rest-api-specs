name: "Swagger ModelValidation - Analyze Code"

on:
  pull_request:
    types:
      # default
      - opened
      - synchronize
      - reopened
      # re-run if base branch is changed, since previous merge commit may generate incorrect diff
      - edited

permissions:
  contents: read

jobs:
  oav:
    name: "Swagger ModelValidation - Analyze Code"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check ModelValidation applicability
        id: applicability
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { checkServiceCheckApplicability } =
              await import('${{ github.workspace }}/.github/workflows/src/service-check-applicability.ts');
            await checkServiceCheckApplicability({ context, core, checkName: 'Swagger ModelValidation' });

      - name: Setup Node and install deps
        if: ${{ steps.applicability.outputs.run-analysis == 'true' }}
        uses: ./.github/actions/setup-node-install-deps

      - name: Swagger Model Validation
        if: ${{ steps.applicability.outputs.run-analysis == 'true' }}
        id: swagger-model-validation
        run: |
          echo "summary=$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
          pnpm exec oav-runner examples

      # Used by other workflows like set-status
      - name: Set job-summary artifact
        if: ${{ always() && steps.swagger-model-validation.outputs.summary }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: job-summary
          path: ${{ steps.swagger-model-validation.outputs.summary }}
          # If the file doesn't exist, just don't add the artifact
          if-no-files-found: ignore
