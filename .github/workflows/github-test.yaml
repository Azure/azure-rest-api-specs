name: GitHub Actions - Test

on:
  push:
    branches:
      - main
    paths:
      - .github/**
  pull_request:
    paths:
      - .github/**
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    strategy:
      matrix:
        folder: [.github, .github/shared]
        os: [ubuntu, windows]

    runs-on: ${{ fromJSON('{"ubuntu":"ubuntu-24.04", "windows":"windows-2022"}')[matrix.os] }}

    defaults:
      run:
        working-directory: ./${{ matrix.folder }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github

      - if: ${{ matrix.folder == '.github' }}
        name: Install workflow dependencies
        uses: ./.github/actions/install-workflow-deps

      - if: ${{ github.event_name == 'pull_request' && matrix.folder == '.github' && matrix.os == 'ubuntu' }}
        name: Require compiled agentic workflow locks
        run: node "${{ github.workspace }}/.github/workflows/cmd/require-workflow-locks.ts"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: ${{ matrix.folder == '.github' }}
        name: Verify all modules are importable
        run: node "${{ github.workspace }}/.github/workflows/cmd/import-workflow-modules.ts"
      - name: Install dev deps
        uses: ./.github/actions/setup-node-install-deps
        with:
          # Workflow TypeScript uses native Node 24 type stripping.
          node-version: 24.x

      - run: pnpm run test:ci

      - run: pnpm run lint

      - run: pnpm run format:check:ci

      # Content copied from https://raw.githubusercontent.com/rhysd/actionlint/2ab3a12c7848f6c15faca9a92612ef4261d0e370/.github/actionlint-matcher.json
      - if: ${{ matrix.folder == '.github' && matrix.os == 'ubuntu'}}
        name: Add ActionLint Problem Matcher
        run: echo "::add-matcher::.github/matchers/actionlint.json"

      - if: ${{ matrix.folder == '.github' && matrix.os == 'ubuntu'}}
        name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color -verbose
