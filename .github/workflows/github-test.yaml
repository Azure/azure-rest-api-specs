name: GitHub Actions - Test

on:
  push:
    branches:
      - main
    paths:
      - .github/**
      - tsconfig.base.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vitest.config.mts
      - eng/tools/spec-gen-sdk-runner/**
      - eng/tools/vitest.base.config.ts
      - .npmrc
  pull_request:
    paths:
      - .github/**
      - tsconfig.base.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vitest.config.mts
      - eng/tools/spec-gen-sdk-runner/**
      - eng/tools/vitest.base.config.ts
      - .npmrc
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-24.04
          - os: windows
            runner: windows-2022

    runs-on: ${{ matrix.runner }}

    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            eng/tools/spec-gen-sdk-runner

      - if: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu' }}
        name: Require compiled agentic workflow locks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changed = new Map(files.map(({ filename, status }) => [filename, status]));
            const sources = files.filter(({ filename }) =>
              /^\.github\/workflows\/[^/]+\.md$/.test(filename),
            );
            const invalid = sources.filter(({ filename, status }) => {
              const lockStatus = changed.get(filename.replace(/\.md$/, ".lock.yml"));
              return status === "removed"
                ? lockStatus !== "removed"
                : !lockStatus || lockStatus === "removed";
            });

            if (invalid.length > 0) {
              core.setFailed(
                `Update the compiled lock for each changed agentic workflow source:\n${invalid
                  .map(({ filename, status }) => `  - ${filename} (${status})`)
                  .join("\n")}`,
              );
            }

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - name: Verify common modules with the minimal production install
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { join } = await import("path");
            const { pathToFileURL } = await import("url");
            const fullPath = join(process.env.GITHUB_WORKSPACE, ".github", "workflows", "src", "github-test.ts");
            const { default: importAllModules } = await import(pathToFileURL(fullPath).href);
            await importAllModules({ core });

      - name: Install SDK workflow production dependencies
        uses: ./.github/actions/install-deps-github-script
        with:
          additional-package: "@azure-tools/sdk-breaking-change-workflows"

      - name: Verify SDK workflow modules with their production install
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = await import("node:url");
            const { default: importAllModules } =
              await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/workflows/src/github-test.ts`).href);
            await importAllModules({ core }, [".github/workflows/sdk-breaking-change/src"]);
