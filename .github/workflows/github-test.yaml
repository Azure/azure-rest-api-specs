name: GitHub Actions - Test

on:
  push:
    branches:
      - main
    paths:
      - .github/**
      - tsconfig.base.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vitest.config.mts
      - eng/tools/vitest.base.config.ts
      - .npmrc
  pull_request:
    paths:
      - .github/**
      - tsconfig.base.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vitest.config.mts
      - eng/tools/vitest.base.config.ts
      - .npmrc
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-24.04
          - os: windows
            runner: windows-2022

    runs-on: ${{ matrix.runner }}

    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github

      - if: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu' }}
        name: Require compiled agentic workflow locks
        uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changed = new Map(files.map(({ filename, status }) => [filename, status]));
            const sources = files.filter(({ filename }) =>
              /^\.github\/workflows\/[^/]+\.md$/.test(filename),
            );
            const invalid = sources.filter(({ filename, status }) => {
              const lockStatus = changed.get(filename.replace(/\.md$/, ".lock.yml"));
              return status === "removed"
                ? lockStatus !== "removed"
                : !lockStatus || lockStatus === "removed";
            });

            if (invalid.length > 0) {
              core.setFailed(
                `Update the compiled lock for each changed agentic workflow source:\n${invalid
                  .map(({ filename, status }) => `  - ${filename} (${status})`)
                  .join("\n")}`,
              );
            }

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - name: Verify all modules are importable
        uses: actions/github-script@v8
        with:
          script: |
            const { join } = await import("path");
            const { pathToFileURL } = await import("url");
            const fullPath = join(process.env.GITHUB_WORKSPACE, ".github", "workflows", "src", "github-test.ts");
            const { default: importAllModules } = await import(pathToFileURL(fullPath).href);
            await importAllModules({ core });

      # Content copied from https://raw.githubusercontent.com/rhysd/actionlint/2ab3a12c7848f6c15faca9a92612ef4261d0e370/.github/actionlint-matcher.json
      - if: ${{ matrix.os == 'ubuntu' }}
        name: Add ActionLint Problem Matcher
        run: echo "::add-matcher::.github/matchers/actionlint.json"

      - if: ${{ matrix.os == 'ubuntu' }}
        name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color -verbose
