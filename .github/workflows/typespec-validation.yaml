name: TypeSpec Validation

on:
  pull_request:
    types:
      # default
      - opened
      - synchronize
      - reopened
      # re-run if base branch is changed, since previous merge commit may generate incorrect diff
      - edited

permissions:
  contents: read

jobs:
  # Determines which path the required check below should take. Reuses tsv's own authoritative
  # --changed discovery (checkout + install cost is paid once here regardless, since checkout
  # dominates the fixed per-job overhead anyway) instead of reimplementing core-file/project
  # detection separately, so there's no drift risk between this decision and what tsv itself does.
  scope:
    name: Determine validation scope
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.classify.outputs.mode }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node and install deps
        uses: ./.github/actions/setup-node-install-deps

      - name: Detect validation scope
        id: detect
        # Only main and RPSaaSMaster validate all specs when core files change.
        run: >-
          node eng/tools/typespec-validation/cmd/tsv.js --changed --dry-run --github-output
          ${{ github.base_ref != 'main' && github.base_ref != 'RPSaaSMaster' && '--ignore-core-files' || '' }}

      - name: Classify validation scope
        id: classify
        shell: bash
        env:
          CHECKING_ALL_SPECS: ${{ steps.detect.outputs.checking-all-specs }}
          CHANGED_PROJECT_COUNT: ${{ steps.detect.outputs.changed-project-count }}
        run: |
          # Keep "3" here in sync with the shard matrices below (validate-all's total-shards and
          # validate-changed-sharded's matrix). A PR with more than 3 impacted (but not core-file-
          # triggering) projects is sharded the same way validate-all shards the full project list.
          if [ "$CHECKING_ALL_SPECS" = "true" ]; then
            MODE=all
          elif [ "${CHANGED_PROJECT_COUNT:-0}" -gt 3 ]; then
            MODE=changed-sharded
          else
            MODE=single
          fi
          echo "mode=$MODE" >>"$GITHUB_OUTPUT"

  # Runs when several (but not core-file-triggering) services changed. Reuses the exact same
  # --shard mechanism validate-all uses below, applied to the changed-project list instead of
  # every project in the repo, so a PR touching many services doesn't validate them serially
  # in a single job.
  validate-changed-sharded:
    name: TypeSpec Validation (shard ${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs['mode'] == 'changed-sharded'

    strategy:
      fail-fast: false
      matrix:
        # Must match the "3" threshold/total in the scope job's classify step.
        shard: [1, 2, 3]

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node and install deps
        uses: ./.github/actions/setup-node-install-deps

      - name: Validate Impacted Specs
        run: >-
          node eng/tools/typespec-validation/cmd/tsv.js --changed --shard=${{ matrix.shard }}/3 --git-clean
          --github-summary
          ${{ runner.debug == '1' && '--verbose' || '' }}
          ${{ github.base_ref != 'main' && github.base_ref != 'RPSaaSMaster' && '--ignore-core-files' || '' }}

  # Only runs for core-file changes. Mirrors the shard/os matrix TypeSpec Validation - All uses
  # for its own push/schedule triggers, so a core-file PR validates every spec once, sharded for
  # speed, instead of relying on the slow serial fallback below.
  validate-all:
    name: TSV (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix['total-shards'] }})
    needs: scope
    if: needs.scope.outputs['mode'] == 'all'

    strategy:
      # Validate all specs, even if one shard fails early.
      fail-fast: false
      matrix:
        os: [ubuntu, windows]
        # shards must start at 1 and increment by 1
        shard: [1, 2, 3]
        # total-shards must be an accurate count of the number of shards
        total-shards: [3]

    runs-on: ${{ fromJSON('{"ubuntu":"ubuntu-24.04", "windows":"windows-2022"}')[matrix.os] }}

    steps:
      - name: Enable git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install deps
        uses: ./.github/actions/setup-node-install-deps

      - name: Validate All Specs
        run: >-
          node eng/tools/typespec-validation/cmd/tsv.js --all
          --shard=${{ matrix.shard }}/${{ matrix['total-shards'] }} --git-clean specification
          --github-summary
          ${{ runner.debug == '1' && '--verbose' || '' }}

  # The single required check. Always runs (never skipped), so it always produces a truthful
  # conclusion: a skipped job reports "success" for required-status-check purposes, so this must
  # never be the job that's conditionally skipped. For a normal PR this validates directly, with
  # errors visible on this same job, exactly like before. For a many-services or core-file PR it
  # waits for and reports the relevant sharded job's real result instead of duplicating that work
  # serially.
  typespec-validation:
    name: TypeSpec Validation
    needs: [scope, validate-changed-sharded, validate-all]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Require successful scope detection
        if: needs.scope.result != 'success'
        run: |
          echo "::error::Could not determine TypeSpec Validation scope."
          exit 1

      - name: Report sharded validation result
        if: needs.scope.outputs['mode'] != 'single'
        shell: bash
        env:
          MODE: ${{ needs.scope.outputs['mode'] }}
          VALIDATE_CHANGED_SHARDED_RESULT: ${{ needs['validate-changed-sharded'].result }}
          VALIDATE_ALL_RESULT: ${{ needs['validate-all'].result }}
        run: |
          if [ "$MODE" = "all" ]; then
            RESULT="$VALIDATE_ALL_RESULT"
            LABEL="TSV (os, shard)"
          else
            RESULT="$VALIDATE_CHANGED_SHARDED_RESULT"
            LABEL="TypeSpec Validation (shard N/3)"
          fi
          if [ "$RESULT" != "success" ]; then
            echo "::error::Sharded TypeSpec Validation failed; see the failing $LABEL job(s) above for details."
            exit 1
          fi
          echo "Validated via the sharded $LABEL jobs above."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs['mode'] == 'single'
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node and install deps
        if: needs.scope.outputs['mode'] == 'single'
        uses: ./.github/actions/setup-node-install-deps

      - name: Validate Impacted Specs
        if: needs.scope.outputs['mode'] == 'single'
        shell: bash
        env:
          DEBUG_FLAG: ${{ runner.debug == '1' && '--verbose' || '' }}
          # Only main and RPSaaSMaster validate all specs when core files change.
          IGNORE_CORE_FILES_FLAG: ${{ github.base_ref != 'main' && github.base_ref != 'RPSaaSMaster' && '--ignore-core-files' || '' }}
        run: node eng/tools/typespec-validation/cmd/tsv.js --changed --git-clean $DEBUG_FLAG $IGNORE_CORE_FILES_FLAG
