name: TypeSpec Validation

on:
  pull_request:
    types:
      # default
      - opened
      - synchronize
      - reopened
      # re-run if base branch is changed, since previous merge commit may generate incorrect diff
      - edited

permissions:
  contents: read

jobs:
  typespec-validation:
    name: TypeSpec Validation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # Checkout all history for all branches.  Required to merge origin/main.
          fetch-depth: 0

      - name: git merge origin/main
        run: |
          git -c user.name="azure-sdk" -c user.email="azuresdk@microsoft.com" merge --no-commit -Xours origin/main
          git -c user.name="azure-sdk" -c user.email="azuresdk@microsoft.com" commit --allow-empty -m "Merge origin/main"

      - name: Setup Node and install deps
        uses: ./.github/actions/setup-node-install-deps

      - name: Validate Impacted Specs
        # Only main and RPSaaSMaster validate all specs when core files change.
        run: >-
          node eng/tools/typespec-validation/cmd/tsv.js --changed --git-clean
          ${{ runner.debug == '1' && '--verbose' || '' }}
          ${{ github.base_ref != 'main' && github.base_ref != 'RPSaaSMaster' && '--ignore-core-files' || '' }}
