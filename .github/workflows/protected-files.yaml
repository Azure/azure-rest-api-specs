name: Protected Files

on:
  pull_request:
    types:
      # default
      - opened
      - synchronize
      - reopened
      # re-run if base branch is changed, since previous merge commit may generate incorrect diff
      - edited

permissions:
  contents: read

jobs:
  protected-files:
    name: Protected Files

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Compare the PR merge commit with its base-branch parent.
          fetch-depth: 2
          sparse-checkout: |
            .github

      - uses: ./.github/actions/install-deps-github-script

      - name: Explain code-owner review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { runProtectedFiles } = await import("${{ github.workspace }}/.github/workflows/src/protected-files.ts");
            const result = await runProtectedFiles({ context, core });
            // Temporary unauthorized-author preview for this draft PR; remove before merge.
            if (context.payload.pull_request.number === 47098 && result.protectedFiles.length > 0) {
              await core.summary.addRaw(
                "\n\n## Unauthorized-author preview\n\n" +
                "> [!WARNING]\n" +
                "> For this preview, the PR author is treated as not authorized to change the protected files listed above. " +
                "These repository-managed files are outside the scope of a specification contribution. " +
                "Remove these changes from your specification PR, or discuss an intentional maintenance change with the repository maintainers.\n\n" +
                "This is a simulated result, not a real permission lookup.\n\n"
              ).write();
              core.setFailed(
                "Preview only: remove changes to protected files from your specification PR. If a tooling change is needed, contact the repository maintainers."
              );
            }
