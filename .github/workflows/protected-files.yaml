name: Protected Files

on:
  pull_request:
    types:
      # default
      - opened
      - synchronize
      - reopened
      # re-run if base branch is changed, since previous merge commit may generate incorrect diff
      - edited

permissions:
  contents: read
  pull-requests: read

env:
  user-allowed: >-
    ${{
      github.event.pull_request.user.login == 'azure-sdk' ||
      github.event.pull_request.user.login == 'azure-sdk-automation[bot]'
    }}

concurrency:
  group: protected-files-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  protected-files:
    name: Protected Files

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Trusted automation still passes before checkout or dependency setup.
      - name: User allowed
        if: ${{ env.user-allowed == 'true' }}
        run: echo "Trusted automation account is allowed to update protected files"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.user-allowed != 'true' }}
        with:
          # Run base-commit policy and dependencies, not changes proposed in the PR.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github

      - uses: ./.github/actions/install-deps-github-script
        if: ${{ env.user-allowed != 'true' }}

      - name: Detect changes to protected files
        if: ${{ env.user-allowed != 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { runProtectedFiles } = await import("${{ github.workspace }}/.github/workflows/src/protected-files.ts");
            await runProtectedFiles({ github, context, core }, process.env.GITHUB_TOKEN);
