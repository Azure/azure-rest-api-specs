name: Protected Files

on:
  pull_request:
    types:
      # default
      - opened
      - synchronize
      - reopened
      # re-run if base branch is changed, since previous merge commit may generate incorrect diff
      - edited

permissions:
  contents: read

env:
  # Users allowed to edit protected files without failing check
  user-allowed: >-
    ${{
      github.event.pull_request.user.login == 'azure-sdk' ||
      github.event.pull_request.user.login == 'azure-sdk-automation[bot]'
    }}

jobs:
  protected-files:
    name: Protected Files

    runs-on: ubuntu-24.04

    steps:
      # Since check is required, the job must pass instead of being skipped
      - name: User allowed
        if: ${{ env.user-allowed == 'true' }}
        run: echo "Account '${{ github.event.pull_request.user.login }}' is allowed to update protected files"

      - uses: actions/checkout@v7
        if: ${{ env.user-allowed != 'true' }}
        with:
          # Required since "HEAD^" is passed to Get-ChangedFiles
          fetch-depth: 2

      - name: Detect changes to protected files
        if: ${{ env.user-allowed != 'true' }}
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { execFileSync } = require("node:child_process");

            const protectedFiles = [
              /^\.gitignore$/i,
              /^cspell\.(?:json|yaml)$/i,
              /^(?:package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$/i,
              /^\.github\//i,
              /^\.vscode\//i,
              /^eng\//i,
            ];
            const excludedFiles = [
              /^\.github\/CODEOWNERS$/i,
              /^\.github\/skills\/(?!azsdk-common-).+/i,
            ];
            const azureSdkToolsFiles = [
              /^\.github\/skills\/azsdk-common-[^/]+(?:\/.*)?$/i,
              /^eng\/common(?:\/.*)?$/i,
            ];
            const changedFiles = execFileSync(
              "git",
              [
                "-c",
                "core.quotepath=off",
                "diff",
                "--name-only",
                "-z",
                "--diff-filter=",
                "HEAD^",
                "HEAD",
              ],
              { encoding: "utf8" },
            )
              .split("\0")
              .filter((file) => file && !file.includes("ChangedFiles-Functions"));

            const matchedFiles = changedFiles.filter(
              (file) =>
                protectedFiles.some((pattern) => pattern.test(file)) &&
                !excludedFiles.some((pattern) => pattern.test(file)),
            );

            if (matchedFiles.length > 0) {
              for (const file of matchedFiles) {
                if (azureSdkToolsFiles.some((pattern) => pattern.test(file))) {
                  core.error(
                    `File '${file}' is synced from Azure/azure-sdk-tools and should not be updated directly in this repo.`,
                    { file },
                  );
                } else {
                  core.error(
                    `File '${file}' should only be updated by the Azure SDK team.  If intentional, the PR may be merged by the Azure SDK team via bypassing the branch protections.`,
                    { file },
                  );
                }
              }
              core.setFailed(`Found ${matchedFiles.length} protected file(s).`);
            } else {
              core.info(
                "No changes to protected files: [.gitignore, cspell.json, cspell.yaml, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .github/*, .github/azsdk-common-*, .vscode/*, eng/*]",
              );
            }
