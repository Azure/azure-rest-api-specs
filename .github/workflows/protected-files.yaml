name: Protected Files

on: # zizmor: ignore[dangerous-triggers] Only trusted base code runs; PR files are read through the API.
  pull_request_target:
    types:
      # default
      - opened
      - synchronize
      - reopened
      # Re-evaluate the diff and approval scope when the base branch changes.
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  protected-files:
    # The required head-commit status is written by the script, not this base-commit job.
    name: Evaluate Protected Files
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'protectedfiles-approved'
    concurrency:
      group: protected-files-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    runs-on: ubuntu-24.04

    steps:
      - name: Invalidate previous status before checkout and setup
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              context: "Protected Files",
              state: "pending",
              description: "Preparing protected files evaluation",
            });

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Never check out PR head/merge code in this privileged workflow.
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github

      - uses: ./.github/actions/install-deps-github-script

      - name: Detect changes to protected files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { runProtectedFiles } = await import("${{ github.workspace }}/.github/workflows/src/protected-files.ts");
            await runProtectedFiles({ github, context, core });

      # A checkout, dependency, or import failure must not leave an old approval green.
      - name: Fail status if evaluation could not complete
        if: ${{ failure() || cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              context: "Protected Files",
              state: "failure",
              description: "Protected Files evaluation failed; see workflow logs",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
