name: "Summarize Checks"

on: # zizmor: ignore[dangerous-triggers] Fork PR updates require this; only base/default-branch code runs.
  # ARM signoff only: Universal dispatches Update Labels, and a run started by a GITHUB_TOKEN
  # dispatch does not fire the "Update Labels" workflow_run trigger below when it completes. That
  # Update Labels run dispatches this one instead. All other routes are unchanged.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to summarize"
        required: true
        type: string
      head_sha:
        description: "PR head SHA evaluated by the dispatching Update Labels run"
        required: true
        type: string
  workflow_run:
    workflows:
      - "Breaking Change(Cross-Version) - Analyze Code"
      - "\\[TEST-IGNORE\\] Breaking Change(Cross-Version) - Analyze Code"
      - "Contributor Readiness"
      - "Package Name Approval - Set Status"
      - "Package Name Approval - Validate Labels"
      - "Protected Files"
      - "SDK Validation Status"
      - "Summarize PR Impact"
      - "Swagger Avocado - Analyze Code"
      - "\\[TEST-IGNORE\\] Swagger Avocado - Analyze Code"
      - "Swagger BreakingChange - Analyze Code"
      - "\\[TEST-IGNORE\\] Swagger BreakingChange - Analyze Code"
      - "Swagger LintDiff - Analyze Code"
      - "\\[TEST-IGNORE\\] Swagger LintDiff - Analyze Code"
      - "Swagger ModelValidation - Analyze Code"
      - "\\[TEST-IGNORE\\] Swagger ModelValidation - Analyze Code"
      - "Swagger SemanticValidation - Analyze Code"
      - "\\[TEST-IGNORE\\] Swagger SemanticValidation - Analyze Code"
      - "TypeSpec Suppressions - Analyze Code"
      - "\\[TEST-IGNORE\\] TypeSpec Suppressions - Analyze Code"
      - "TypeSpec Validation"
      - "Spec Change Policies"
      - "Update Labels"
      - "SDK Breaking Change Analysis"
      - "SDK Breaking Change Mitigation"
      - "SDK Breaking Change Labels"
    types:
      - completed
  pull_request_target: # when a PR is labeled. NOT pull_request, because that would run on the PR branch, not the base branch.
    types:
      - labeled
      - unlabeled
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read # for actions/checkout

jobs:
  post-typespec-suppressions-comment:
    name: Post TypeSpec Suppressions Comment
    # Runs before run-summarize-checks on TypeSpec Suppressions updates so stale
    # typespec-suppressions-approved labels are invalidated before statuses and summary are written.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion != 'skipped' &&
       (github.event.workflow_run.name == 'TypeSpec Suppressions - Analyze Code' ||
        github.event.workflow_run.name == '[TEST-IGNORE] TypeSpec Suppressions - Analyze Code')) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.state == 'open' &&
       (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
       (github.event.label.name == 'typespec-suppressions-approved' ||
        github.event.label.name == 'typespec-suppressions-review-required'))
    runs-on: ubuntu-24.04
    outputs:
      approval_verified: ${{ steps.post-suppressions.outputs.approval_verified }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - id: post-suppressions
        name: Post TypeSpec suppressions review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: postSuppressionsResults } =
              await import('${{ github.workspace }}/.github/workflows/src/typespec-suppressions/post-results.ts');
            await postSuppressionsResults({ github, context, core });

  run-summarize-checks:
    needs: post-typespec-suppressions-comment
    # Serialize per PR head SHA so full-sync and analyzer-completion runs cannot race to overwrite
    # commit statuses or summary comments. Each surviving run reconciles all monitored statuses so
    # superseded pending runs never drop a status update.
    concurrency:
      group: summarize-checks-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || inputs.head_sha || github.run_id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      checks: read
      statuses: write
      issues: write
      pull-requests: write
    outputs:
      issue_number: ${{ steps.summarize-checks.outputs.issue_number }}
      head_sha: ${{ steps.summarize-checks.outputs.head_sha }}
      arm_review_ready: ${{ steps.summarize-checks.outputs.arm_review_ready }}
      arm_signoff_recheck_needed: ${{ steps.sync-statuses.outputs.arm_signoff_recheck_needed }}
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped'))
    name: "Summarize Checks"
    runs-on: ubuntu-slim

    steps:
      # *** IMPORTANT ***
      # For workflows that are triggered by the pull_request_target event, the workflow runs in the
      # context of the base of the pull request.  You should make sure that you do not check out,
      # build, or run untrusted code from the head of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only needs .github folder for automation, not the files in the PR (analyzed in a
          # separate workflow).
          #
          # Uses the .github folder from the PR base branch (pull_request_target trigger),
          # or the repo default branch (other triggers).
          sparse-checkout: |
            .github

      # Update bypassable check statuses before installing npm dependencies so PR check badges
      # refresh immediately and summarize-checks sees the updated statuses in the same run.
      - id: sync-statuses
        name: Sync Check Statuses
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUPPRESSIONS_JOB_RESULT: ${{ needs.post-typespec-suppressions-comment.result }}
          SUPPRESSIONS_APPROVAL_VERIFIED: ${{ needs.post-typespec-suppressions-comment.outputs.approval_verified }}
        with:
          script: |
            const { syncMonitoredStatuses } =
              await import('${{ github.workspace }}/.github/workflows/src/set-status.ts');
            await syncMonitoredStatuses({ github, context, core });

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - id: dump-trigger-metadata
        name: Dump Trigger Metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: dumpTriggerMetadata } =
              await import('${{ github.workspace }}/.github/workflows/src/summarize-checks/dump-trigger-metadata.ts');
            return await dumpTriggerMetadata({ context, core });

      - id: summarize-checks
        name: Summarize Checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: summarizeChecks } =
              await import('${{ github.workspace }}/.github/workflows/src/summarize-checks/summarize-checks.ts');
            return await summarizeChecks({ github, context, core });

      # May be used by downstream workflows
      - name: Set job-summary artifact
        if: ${{ always() && steps.summarize-checks.outputs.summary }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: job-summary
          path: ${{ steps.summarize-checks.outputs.summary }}
          # If the file doesn't exist, just don't add the artifact
          if-no-files-found: ignore

      # PR identity handoff for workflow_run consumers (e.g. Data-Plane Assign Reviewers):
      # labels applied above use the default token and don't re-trigger `labeled` workflows,
      # so consumers react to this run and resolve the PR from these artifacts.
      - if: ${{ always() && steps.summarize-checks.outputs.issue_number }}
        name: Upload artifact with issue number
        uses: ./.github/actions/add-empty-artifact
        with:
          name: issue-number
          value: ${{ steps.summarize-checks.outputs.issue_number }}

      - if: ${{ always() && steps.summarize-checks.outputs.head_sha }}
        name: Upload artifact with head SHA
        uses: ./.github/actions/add-empty-artifact
        with:
          name: head-sha
          value: ${{ steps.summarize-checks.outputs.head_sha }}

  dispatch-arm-review:
    needs: run-summarize-checks
    # Explicit status function required because post-typespec-suppressions-comment is an ancestor
    # job that is skipped on most events (actions/runner#2205).
    if: >-
      !cancelled() &&
      needs.run-summarize-checks.result == 'success' &&
      needs.run-summarize-checks.outputs.arm_review_ready == 'true'
    runs-on: ubuntu-slim
    permissions:
      actions: write
      contents: read
      pull-requests: write # maintain the legacy reviewer activation marker
      statuses: write
    concurrency:
      group: arm-initial-review-dispatch-${{ needs.run-summarize-checks.outputs.issue_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
      - name: Dispatch ARM review for a ready head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARM_REVIEW_PR_NUMBER: ${{ needs.run-summarize-checks.outputs.issue_number }}
          ARM_REVIEW_HEAD_SHA: ${{ needs.run-summarize-checks.outputs.head_sha }}
        with:
          script: |
            const { default: dispatchInitialArmReview } =
              await import('${{ github.workspace }}/.github/workflows/src/arm-auto-signoff/arm-review-dispatch.ts');
            await dispatchInitialArmReview({ github, context, core });

  dispatch-arm-signoff:
    needs: run-summarize-checks
    if: >-
      !cancelled() &&
      needs.run-summarize-checks.result == 'success' &&
      needs.run-summarize-checks.outputs.arm_signoff_recheck_needed == 'true' &&
      needs.run-summarize-checks.outputs.issue_number != '' &&
      needs.run-summarize-checks.outputs.head_sha != ''
    runs-on: ubuntu-slim
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
      - name: Dispatch ARM Universal Auto SignOff after status change
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.run-summarize-checks.outputs.issue_number }}
          HEAD_SHA: ${{ needs.run-summarize-checks.outputs.head_sha }}
        with:
          script: |
            const { dispatchUniversalSignoffForPr } =
              await import('${{ github.workspace }}/.github/workflows/src/arm-auto-signoff/arm-signoff-dispatch.ts');
            await dispatchUniversalSignoffForPr(
              { github, context, core },
              { prNumber: process.env.PR_NUMBER, headSha: process.env.HEAD_SHA },
            );
