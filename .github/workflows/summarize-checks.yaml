name: "Summarize Checks"

on:
  workflow_run:
    workflows:
      - "Breaking Change(Cross-Version) - Set Status"
      - "Package Name Approval - Set Status"
      - "Package Name Approval - Validate Labels"
      - "SDK Validation Status"
      - "Summarize PR Impact"
      - "Swagger Avocado - Set Status"
      - "Swagger BreakingChange - Set Status"
      - "Swagger LintDiff - Set Status"
      - "Swagger ModelValidation - Set Status"
      - "Swagger SemanticValidation - Set Status"
      - "TypeSpec Suppressions - Set Status"
      - "TypeSpec Validation"
      - "Update Labels"
    types:
      - completed
  pull_request_target: # when a PR is labeled. NOT pull_request, because that would run on the PR branch, not the base branch.
    types:
      - labeled
      - unlabeled
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  actions: read # to inspect workflow_run metadata
  contents: read # for actions/checkout
  checks: read # for octokit.rest.checks.listForRef
  statuses: write # for octokit.rest.repos.getCombinedStatusForRef and octokit.rest.repos.createCommitStatus
  issues: write # to post comments via the Issues API
  pull-requests: write # to post comments via the Pull Requests API

jobs:
  resolve:
    if: ${{ github.event_name == 'pull_request_target' || github.event.workflow_run.conclusion != 'skipped' }}
    name: Resolve PR
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      inputs: ${{ steps.resolve.outputs.result }}
      issue-number: ${{ steps.resolve.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: resolve
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { resolveSummaryInputs } =
              await import('${{ github.workspace }}/.github/workflows/src/summarize-checks/resolve-inputs.ts');
            return await resolveSummaryInputs({ github, context, core });

  run-summarize-checks:
    needs: resolve
    if: ${{ needs.resolve.outputs.issue-number }}
    name: "Summarize Checks"
    runs-on: ubuntu-slim
    # Resolve fork/artifact-based identity first, but read mutable policy data only under this lock.
    concurrency:
      group: summarize-checks-${{ github.repository }}-${{ needs.resolve.outputs.issue-number }}
      cancel-in-progress: false

    steps:
      # *** IMPORTANT ***
      # For workflows that are triggered by the pull_request_target event, the workflow runs in the
      # context of the base of the pull request.  You should make sure that you do not check out,
      # build, or run untrusted code from the head of the pull request.
      - uses: actions/checkout@v7
        with:
          # Only needs .github folder for automation, not the files in the PR (analyzed in a
          # separate workflow).
          #
          # Uses the .github folder from the PR base branch (pull_request_target trigger),
          # or the repo default branch (other triggers).
          sparse-checkout: |
            .github

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - id: dump-trigger-metadata
        name: Dump Trigger Metadata
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { default: dumpTriggerMetadata } =
              await import('${{ github.workspace }}/.github/workflows/src/summarize-checks/dump-trigger-metadata.ts');
            return await dumpTriggerMetadata({ context, core });

      - id: summarize-checks
        name: Summarize Checks
        uses: actions/github-script@v9.0.0
        env:
          SUMMARY_INPUTS: ${{ needs.resolve.outputs.inputs }}
        with:
          script: |
            const { default: summarizeChecks } =
              await import('${{ github.workspace }}/.github/workflows/src/summarize-checks/summarize-checks.ts');
            return await summarizeChecks({ github, context, core }, JSON.parse(process.env.SUMMARY_INPUTS));

      # May be used by downstream workflows
      - name: Set job-summary artifact
        if: ${{ always() && steps.summarize-checks.outputs.summary }}
        uses: actions/upload-artifact@v7
        with:
          name: job-summary
          path: ${{ steps.summarize-checks.outputs.summary }}
          # If the file doesn't exist, just don't add the artifact
          if-no-files-found: ignore

      # PR identity handoff for workflow_run consumers (e.g. Data-Plane Assign Reviewers):
      # labels applied above use the default token and don't re-trigger `labeled` workflows,
      # so consumers react to this run and resolve the PR from these artifacts.
      - if: ${{ always() && steps.summarize-checks.outputs.issue_number }}
        name: Upload artifact with issue number
        uses: ./.github/actions/add-empty-artifact
        with:
          name: issue-number
          value: ${{ steps.summarize-checks.outputs.issue_number }}

      - if: ${{ always() && steps.summarize-checks.outputs.head_sha }}
        name: Upload artifact with head SHA
        uses: ./.github/actions/add-empty-artifact
        with:
          name: head-sha
          value: ${{ steps.summarize-checks.outputs.head_sha }}
