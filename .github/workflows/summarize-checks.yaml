name: "Summarize Checks"

on: # zizmor: ignore[dangerous-triggers] Fork PR updates require this; only base/default-branch code runs.
  # ARM signoff only: Universal dispatches Update Labels, and a run started by a GITHUB_TOKEN
  # dispatch does not fire the "Update Labels" workflow_run trigger below when it completes. That
  # Update Labels run dispatches this one instead. All other routes are unchanged.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to summarize"
        required: true
        type: string
      head_sha:
        description: "PR head SHA evaluated by the dispatching Update Labels run"
        required: true
        type: string
  workflow_run:
    workflows:
      - "Breaking Change(Cross-Version) - Set Status"
      - "Package Name Approval - Set Status"
      - "Package Name Approval - Validate Labels"
      - "Protected Files"
      - "SDK Validation Status"
      - "Summarize PR Impact"
      - "Swagger Avocado - Set Status"
      - "Swagger BreakingChange - Set Status"
      - "Swagger LintDiff - Set Status"
      - "Swagger ModelValidation - Set Status"
      - "Swagger SemanticValidation - Set Status"
      - "TypeSpec Suppressions - Set Status"
      - "TypeSpec Validation"
      - "Spec Change Policies"
      - "Update Labels"
    types:
      - completed
  pull_request_target: # when a PR is labeled. NOT pull_request, because that would run on the PR branch, not the base branch.
    types:
      - labeled
      - unlabeled
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read # for actions/checkout

jobs:
  run-summarize-checks:
    permissions:
      actions: read
      contents: read
      checks: read
      statuses: write
      issues: write
      pull-requests: write
    outputs:
      issue_number: ${{ steps.summarize-checks.outputs.issue_number }}
      head_sha: ${{ steps.summarize-checks.outputs.head_sha }}
      arm_review_ready: ${{ steps.summarize-checks.outputs.arm_review_ready }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped')
    name: "Summarize Checks"
    runs-on: ubuntu-slim

    steps:
      # *** IMPORTANT ***
      # For workflows that are triggered by the pull_request_target event, the workflow runs in the
      # context of the base of the pull request.  You should make sure that you do not check out,
      # build, or run untrusted code from the head of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only needs .github folder for automation, not the files in the PR (analyzed in a
          # separate workflow).
          #
          # Uses the .github folder from the PR base branch (pull_request_target trigger),
          # or the repo default branch (other triggers).
          sparse-checkout: |
            .github

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - id: dump-trigger-metadata
        name: Dump Trigger Metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: dumpTriggerMetadata } =
              await import('${{ github.workspace }}/.github/workflows/src/summarize-checks/dump-trigger-metadata.ts');
            return await dumpTriggerMetadata({ context, core });

      - id: summarize-checks
        name: Summarize Checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: summarizeChecks } =
              await import('${{ github.workspace }}/.github/workflows/src/summarize-checks/summarize-checks.ts');
            return await summarizeChecks({ github, context, core });

      # May be used by downstream workflows
      - name: Set job-summary artifact
        if: ${{ always() && steps.summarize-checks.outputs.summary }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: job-summary
          path: ${{ steps.summarize-checks.outputs.summary }}
          # If the file doesn't exist, just don't add the artifact
          if-no-files-found: ignore

      # PR identity handoff for workflow_run consumers (e.g. Data-Plane Assign Reviewers):
      # labels applied above use the default token and don't re-trigger `labeled` workflows,
      # so consumers react to this run and resolve the PR from these artifacts.
      - if: ${{ always() && steps.summarize-checks.outputs.issue_number }}
        name: Upload artifact with issue number
        uses: ./.github/actions/add-empty-artifact
        with:
          name: issue-number
          value: ${{ steps.summarize-checks.outputs.issue_number }}

      - if: ${{ always() && steps.summarize-checks.outputs.head_sha }}
        name: Upload artifact with head SHA
        uses: ./.github/actions/add-empty-artifact
        with:
          name: head-sha
          value: ${{ steps.summarize-checks.outputs.head_sha }}

  dispatch-arm-review:
    needs: run-summarize-checks
    if: needs.run-summarize-checks.outputs.arm_review_ready == 'true'
    runs-on: ubuntu-slim
    permissions:
      actions: write
      contents: read
      pull-requests: write # reserve the PR-level initial-review marker
      statuses: write
    concurrency:
      group: arm-initial-review-dispatch-${{ needs.run-summarize-checks.outputs.issue_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
      - name: Dispatch initial ARM review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARM_REVIEW_PR_NUMBER: ${{ needs.run-summarize-checks.outputs.issue_number }}
          ARM_REVIEW_HEAD_SHA: ${{ needs.run-summarize-checks.outputs.head_sha }}
        with:
          script: |
            const { default: dispatchInitialArmReview } =
              await import('${{ github.workspace }}/.github/workflows/src/arm-auto-signoff/arm-review-dispatch.ts');
            await dispatchInitialArmReview({ github, context, core });
