name: spec-gen-sdk-runner - Test

on:
  push:
    branches:
      - main
      - typespec-next
  pull_request:
    paths:
      - .editorconfig
      - .gitattributes
      - .npmrc
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - tsconfig.json
      - .github/actions/setup-node-install-deps/**
      - .github/shared/**
      - .github/workflows/_reusable-eng-tools-test.yaml
      - .github/workflows/spec-gen-sdk-runner-test.yaml
      - eng/tools/package.json
      - eng/tools/tsconfig.json
      - eng/tools/eslint.base.config.js
      - eng/tools/vitest.base.config.js
      - eng/tools/.prettierrc.yaml
      - eng/tools/.prettierignore
      - eng/tools/spec-gen-sdk-runner/**
      - eng/pipelines/templates/stages/archetype-spec-gen-sdk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specGenSdkRunner:
    name: spec-gen-sdk-runner
    uses: ./.github/workflows/_reusable-eng-tools-test.yaml
    with:
      package: spec-gen-sdk-runner
      lint: true
