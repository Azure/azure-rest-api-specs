name: SDK Breaking Change Analysis - Publish Results

on:
  workflow_run:
    workflows: ["SDK Breaking Change Analysis - Analyze"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  resolve:
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.read-status.outputs.should-run }}
    steps:
      - name: Download SDK analysis status
        uses: actions/download-artifact@v8
        with:
          name: sdk-breaking-change-analysis-status
          path: ${{ runner.temp }}/sdk-breaking-change-analysis
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read analysis status
        id: read-status
        shell: bash
        run: |
          should_run="$(cat "${{ runner.temp }}/sdk-breaking-change-analysis/run")"
          if [[ "$should_run" != "true" && "$should_run" != "false" ]]; then
            echo "Invalid run value: $should_run" >&2
            exit 1
          fi
          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"

  publish-results:
    needs: resolve
    if: needs.resolve.outputs.should-run == 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            eng
          persist-credentials: false

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - name: Download SDK analysis results
        uses: actions/download-artifact@v8
        with:
          name: sdk-breaking-change-results
          path: ${{ runner.temp }}/sdk-breaking-change-results
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish SDK breaking-change analysis result
        uses: actions/github-script@v9
        env:
          RESULTS_PATH: ${{ runner.temp }}/sdk-breaking-change-results
        with:
          github-token: ${{ github.token }}
          script: |
            const { publishAnalysisResult } =
              await import('${{ github.workspace }}/.github/workflows/src/sdk-breaking-change/publish-analysis-result.ts');
            await publishAnalysisResult({ github, context, core });
