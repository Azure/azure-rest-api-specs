name: PR Contribution Greeting

on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  greet:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { greetContributor } =
              await import('${{ github.workspace }}/.github/workflows/src/pr-contribution-greeting.ts');
            await greetContributor({ github, context, core });
