name: PR Contribution

on: # zizmor: ignore[dangerous-triggers] Classifies fork PR authors using only trusted base-branch code.
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  label:
    name: Label External Contributor
    if: github.event.pull_request.user.type == 'User'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { labelExternalContributor } = await import("${{ github.workspace }}/.github/workflows/src/pr-contribution.ts");
            await labelExternalContributor({ github, context, core });
