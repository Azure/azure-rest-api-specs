name: Lint

on:
  push:
    branches:
      - main
      - typespec-next
    paths:
      - .github/**
      - eng/tools/**
      - libs/**
      - .oxlintrc.json
      - .gitignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - tsconfig.json
      - vitest.config.mts
  pull_request:
    paths:
      - .github/**
      - eng/tools/**
      - libs/**
      - .oxlintrc.json
      - .gitignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - tsconfig.json
      - vitest.config.mts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            eng/tools
            libs

      - uses: ./.github/actions/setup-node-install-deps
        with:
          install-command: pnpm ci

      - name: Lint all packages
        run: pnpm run lint --format=github
