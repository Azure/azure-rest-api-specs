name: Native SDK Checks POC

on: # zizmor: ignore[dangerous-triggers] Only trusted default-branch code runs; PR content is never checked out.
  check_run:
    types: [created, rerequested, completed]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: read
  statuses: write
  pull-requests: write
  issues: write

concurrency:
  group: native-sdk-checks-${{ github.event.check_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  native-sdk-checks:
    if: github.repository == 'Azure/azure-rest-api-specs-pr'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github
      - uses: ./.github/actions/install-deps-github-script
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { reconcileNativeSdkChecks } =
              await import('${{ github.workspace }}/.github/workflows/src/native-sdk-checks.ts');
            await reconcileNativeSdkChecks({ github, context, core });
