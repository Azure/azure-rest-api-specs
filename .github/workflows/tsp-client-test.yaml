name: tsp-client - Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - .editorconfig
      - .gitattributes
      - .npmrc
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - tsconfig.json
      - .github/actions/setup-node-install-deps/**
      - .github/shared/**
      - .github/workflows/_reusable-eng-tools-test.yaml
      - .github/workflows/tsp-client-test.yaml
      - eng/tools/package.json
      - eng/tools/tsconfig.json
      - eng/tools/eslint.base.config.js
      - eng/tools/vitest.base.config.js
      - eng/tools/.prettierrc.yaml
      - eng/tools/.prettierignore
      - eng/tools/tsp-client-tests/**
      - specification/common-types/**
      - specification/contosowidgetmanager/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsp-client:
    uses: ./.github/workflows/_reusable-eng-tools-test.yaml
    with:
      package: tsp-client-tests
      lint: true
      sparse-checkout-paths: |
        specification/common-types
        specification/contosowidgetmanager
