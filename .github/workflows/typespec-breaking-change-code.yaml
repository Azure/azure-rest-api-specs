name: "TypeSpec Breaking Change - Analyze Code"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  typespec-breaking-change:
    name: "TypeSpec Breaking Change - Analyze Code"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and install deps
        uses: ./.github/actions/setup-node-install-deps

      - name: Get impacted TypeSpec folders
        shell: pwsh
        run: |
          $ignoreCoreFiles = -not (@('main', 'RPSaaSMaster') -contains $Env:GITHUB_BASE_REF)
          $typespecFolders, $checkedAll = & "./eng/scripts/Get-TypeSpec-Folders.ps1" `
            -BaseCommitish:"${{ github.event.pull_request.base.sha }}" `
            -HeadCommitish:"HEAD" `
            -IgnoreCoreFiles:$ignoreCoreFiles

          $typespecFolders | Set-Content -Path typespec-folders.txt

          if ($checkedAll) {
            Write-Host "Checking all TypeSpec folders because core files changed."
          }

          Write-Host "Found $($typespecFolders.Count) impacted TypeSpec folders."
          foreach ($typespecFolder in $typespecFolders) {
            Write-Host "  $typespecFolder"
          }

      - name: Run TypeSpec breaking change analysis
        id: typespec-breaking-change-analyze
        shell: bash
        env:
          EMIT_ANNOTATIONS: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
        run: |
          if [[ ! -s typespec-folders.txt ]]; then
            {
              echo "## TypeSpec Breaking Change Analysis"
              echo
              echo "No impacted TypeSpec folders were found."
            } > "$GITHUB_STEP_SUMMARY"
            printf '{"findings":[],"summary":{"unsuppressedErrors":0}}\n' > "breaking-change-report.json"
            exit 0
          fi

          mapfile -t spec_folders < typespec-folders.txt

          annotations_flag=()
          if [[ "$EMIT_ANNOTATIONS" == "true" ]]; then
            annotations_flag=(--github-annotations)
          fi

          has_errors=0
          for folder in "${spec_folders[@]}"; do
            npm exec --no -- typespec-breaking-change "$folder" \
              --json-output "breaking-change-report.json" \
              --markdown-output "$GITHUB_STEP_SUMMARY" \
              "${annotations_flag[@]}" \
              --fail-on-breaking || has_errors=1
          done

          if [[ $has_errors -eq 1 ]]; then
            echo "breakingChangeReviewLabelName=BreakingChangeReviewRequired" >> "$GITHUB_OUTPUT"
            echo "breakingChangeReviewLabelValue=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # Upload artifact for 'BreakingChangeReviewRequired' label
      - if: |
          always() &&
          (steps.typespec-breaking-change-analyze.outputs.breakingChangeReviewLabelName != '')
        name: Upload artifact with BreakingChangeReviewRequired status
        uses: ./.github/actions/add-empty-artifact
        with:
          name: "${{ steps.typespec-breaking-change-analyze.outputs.breakingChangeReviewLabelName }}"
          value: "${{ steps.typespec-breaking-change-analyze.outputs.breakingChangeReviewLabelValue == 'true' }}"

      - name: Upload report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: typespec-breaking-change-report
          path: breaking-change-report.json
          if-no-files-found: ignore
