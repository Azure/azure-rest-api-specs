name: Cleanup stale branches

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report eligible branches without deleting them"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'Azure/azure-rest-api-specs' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/workflows/src

      - name: Clean up stale branches
        uses: actions/github-script@v9
        with:
          script: |
            const { cleanupBranches } = await import("${{ github.workspace }}/.github/workflows/src/branch-cleanup.ts");
            await cleanupBranches(
              { github, context, core },
              ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }},
              (args) => exec.exec("git", args),
            );
