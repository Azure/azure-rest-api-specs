name: Summarize Impact - Test

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .editorconfig
      - .gitattributes
      - .npmrc
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - tsconfig.json
      - .github/actions/setup-node-install-deps/**
      - .github/shared/**
      - .github/workflows/_reusable-eng-tools-test.yaml
      - .github/workflows/summarize-impact-test.yaml
      - eng/tools/package.json
      - eng/tools/tsconfig.json
      - eng/tools/eslint.base.config.js
      - eng/tools/vitest.base.config.js
      - eng/tools/.prettierrc.yaml
      - eng/tools/.prettierignore
      - eng/tools/summarize-impact/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summarize-impact:
    uses: ./.github/workflows/_reusable-eng-tools-test.yaml
    with:
      package: summarize-impact
      lint: false
