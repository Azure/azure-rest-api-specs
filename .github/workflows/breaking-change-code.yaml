name: "Swagger BreakingChange - Analyze Code"

on:
  pull_request:
    types:
      # default
      - opened
      - synchronize
      - reopened
      # re-run if base branch is changed, since previous merge commit may generate incorrect diff
      - edited

permissions:
  contents: read

jobs:
  validateBreakingChange:
    name: "Swagger BreakingChange - Analyze Code"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check breaking-change applicability
        id: applicability
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { checkServiceCheckApplicability, setNoReviewRequiredOutputs } =
              await import('${{ github.workspace }}/.github/workflows/src/service-check-applicability.ts');
            if (!(await checkServiceCheckApplicability({ context, core, checkName: 'Swagger BreakingChange' }))) {
              setNoReviewRequiredOutputs(core);
            }

      - name: Setup Node and install deps
        if: ${{ steps.applicability.outputs.run-analysis == 'true' }}
        uses: ./.github/actions/setup-node-install-deps

      - name: Setup .NET 6 SDK
        if: ${{ steps.applicability.outputs.run-analysis == 'true' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "6.0.x"

      - name: Swagger Breaking Change - Analyze Code
        if: ${{ steps.applicability.outputs.run-analysis == 'true' }}
        id: swagger-breaking-change-analyze-code
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "summary=$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
          pnpm exec openapi-diff-runner \
            --spec-repo-path "$GITHUB_WORKSPACE" \
            --pr-source-branch "$GITHUB_HEAD_REF" \
            --pr-target-branch "$GITHUB_BASE_REF" \
            --head-commit "${{ github.event.pull_request.head.sha }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --source-repo "$SOURCE_REPOSITORY" \
            --target-repo "$GITHUB_REPOSITORY"

      # Upload artifact for 'BreakingChangeReviewRequired' label
      - if: |
          always() && 
          (steps.swagger-breaking-change-analyze-code.outputs.breakingChangeReviewLabelName != '' ||
           steps.applicability.outputs.breakingChangeReviewLabelName != '')
        name: Upload artifact with BreakingChangeReviewRequired status
        uses: ./.github/actions/add-empty-artifact
        with:
          name: "${{ steps.swagger-breaking-change-analyze-code.outputs.breakingChangeReviewLabelName || steps.applicability.outputs.breakingChangeReviewLabelName }}"
          value: "${{ (steps.swagger-breaking-change-analyze-code.outputs.breakingChangeReviewLabelValue || steps.applicability.outputs.breakingChangeReviewLabelValue) == 'true' }}"

      # Upload artifact for 'VersioningReviewRequired' label
      - if: |
          always() && 
          (steps.swagger-breaking-change-analyze-code.outputs.versioningReviewLabelName != '' ||
           steps.applicability.outputs.versioningReviewLabelName != '')
        name: Upload artifact with VersioningReviewRequired status
        uses: ./.github/actions/add-empty-artifact
        with:
          name: "${{ steps.swagger-breaking-change-analyze-code.outputs.versioningReviewLabelName || steps.applicability.outputs.versioningReviewLabelName }}"
          value: "${{ (steps.swagger-breaking-change-analyze-code.outputs.versioningReviewLabelValue || steps.applicability.outputs.versioningReviewLabelValue) == 'true' }}"

      # Used by other workflows like set-status
      - name: Set job-summary artifact
        if: ${{ always() && steps.swagger-breaking-change-analyze-code.outputs.summary }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: job-summary
          path: ${{ steps.swagger-breaking-change-analyze-code.outputs.summary }}
          # If the file doesn't exist, just don't add the artifact
          if-no-files-found: ignore
