name: Ownership Approval

on: # zizmor: ignore[dangerous-triggers] Reads GitHub metadata and executes only default-branch code.
  workflow_run:
    workflows: ["Ownership Approval - Events"]
    types: [completed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  resolve:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.body == '/azsdk check-ownership' &&
       github.event.sender.type != 'Bot')
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: resolve
        with:
          script: |
            const { resolveOwnershipPullRequest } =
              await import('${{ github.workspace }}/.github/workflows/src/ownership-approval-events.ts');
            return await resolveOwnershipPullRequest({ github, context, core });

  authorize:
    needs: resolve
    if: needs.resolve.outputs.pr != 'null'
    runs-on: ubuntu-24.04
    environment: AzureSDKEngKeyVault
    timeout-minutes: 10
    concurrency:
      group: ownership-approval-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github
            eng/common
      - uses: ./.github/actions/install-deps-github-script
      - name: Authenticate to Azure Key Vault
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create Azure SDK automation token
        uses: ./eng/common/actions/login-to-github
        with:
          token-owners: ${{ github.repository_owner }}
          variable-name-prefix: OWNERSHIP_APPROVAL_TOKEN
      - name: Evaluate ownership
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
        with:
          github-token: ${{ env.OWNERSHIP_APPROVAL_TOKEN }}
          script: |
            const { checkOwnershipApproval } =
              await import('${{ github.workspace }}/.github/workflows/src/ownership-approval.ts');
            await checkOwnershipApproval({ github, context, core }, Number(process.env.PR_NUMBER));
