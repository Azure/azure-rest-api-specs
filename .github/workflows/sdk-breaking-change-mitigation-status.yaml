name: SDK Breaking Change Mitigation - Publish Results

on: # zizmor: ignore[dangerous-triggers] Only base/default-branch code runs and consumes artifacts from the named workflow.
  workflow_run:
    workflows: ["SDK Breaking Change Mitigation"]
    types: [completed]

permissions: {}

jobs:
  check-mitigation-status:
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-slim
    permissions:
      actions: read
    outputs:
      should-run: ${{ steps.read-status.outputs.should-run }}
    steps:
      - name: Download SDK mitigation status
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-breaking-change-mitigate
          path: ${{ runner.temp }}/sdk-breaking-change-mitigate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read mitigation status
        id: read-status
        shell: bash
        run: |
          should_run="$(cat "${{ runner.temp }}/sdk-breaking-change-mitigate/run")"
          if [[ "$should_run" != "true" && "$should_run" != "false" ]]; then
            echo "Invalid should-run value: $should_run" >&2
            exit 1
          fi
          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"

  publish-results:
    needs: check-mitigation-status
    if: needs.check-mitigation-status.outputs.should-run == 'true'
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            eng
          persist-credentials: false

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - name: Download SDK mitigation results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-breaking-change-mitigation-results
          path: ${{ runner.temp }}/sdk-breaking-change-mitigation-results
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish SDK breaking-change mitigation result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MITIGATION_RESULT_PATH: ${{ runner.temp }}/sdk-breaking-change-mitigation-results/sdk-breaking-change-mitigation.json
          WORKFLOW_SUMMARY_URL: ${{ github.event.workflow_run.html_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { publishMitigationResult } =
              await import('${{ github.workspace }}/.github/workflows/src/sdk-breaking-change/publish-mitigation-result.ts');
            await publishMitigationResult({
              github,
              context,
              core,
              mitigationResultPath: process.env.MITIGATION_RESULT_PATH,
              workflowSummaryUrl: process.env.WORKFLOW_SUMMARY_URL,
            });
