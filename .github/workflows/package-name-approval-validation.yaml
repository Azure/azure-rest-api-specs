name: "Package Name Approval - Validate Labels"

on:
  pull_request_target:
    types:
      - labeled
      - unlabeled
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  validate-approval:
    name: Validate Package Name Approval
    runs-on: ubuntu-24.04
    steps:
      # IMPORTANT: This workflow uses pull_request_target, which runs with repo write permissions.
      # Only base-branch code is checked out below. Do NOT checkout or run code from the PR head.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/

      - name: Install workflow dependencies
        uses: ./.github/actions/install-workflow-deps

      - name: Validate package name approval label
        run: node "${{ github.workspace }}/.github/workflows/cmd/package-name-validate-approval.ts"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Update package name approval status
        run: node "${{ github.workspace }}/.github/workflows/cmd/package-name-status-check.ts"
        env:
          GITHUB_TOKEN: ${{ github.token }}
