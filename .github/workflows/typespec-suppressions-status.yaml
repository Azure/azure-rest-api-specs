name: "TypeSpec Suppressions - Set Status"

on: # zizmor: ignore[dangerous-triggers] Fork PR updates require this; only default-branch code runs.
  # "Pull Request Event" is an unprivileged pull_request intake. Re-evaluate on its completion
  # so opened/synchronize/reopened and manual label changes still update the status.
  workflow_run:
    # Trigger on both old and new names, to handle the rename more gracefully
    workflows:
      - "TypeSpec Suppressions - Analyze Code"
      - "\\[TEST-IGNORE\\] TypeSpec Suppressions - Analyze Code"
      - "Pull Request Event"
    types: [completed]

# Permissions are scoped per job below (this workflow runs two jobs with
# different privilege needs: setting the check status vs. posting a comment).
permissions: {}

jobs:
  typespec-suppressions-status:
    name: Set TypeSpec Suppressions Status
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    uses: $/.github/workflows/_reusable-set-check-status.yaml
    with:
      monitored_workflow_name: "TypeSpec Suppressions - Analyze Code"
      required_check_name: "TypeSpec Suppressions"
      overriding_label: "typespec-suppressions-approved"

  post-comment:
    name: Post TypeSpec Suppressions Comment
    # Refresh the dedicated review comment when the analyzer report completes, and on
    # "Pull Request Event" intake so manual label changes are reflected. Intake carries no
    # trusted label name, so it re-syncs on every PR event. Only an Analyze Code completion
    # counts as a new analysis (see post-results.ts). Events that fire before a report
    # artifact exists for the head are no-ops.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - name: Post TypeSpec suppressions review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: postSuppressionsResults } =
              await import('${{ github.workspace }}/.github/workflows/src/typespec-suppressions/post-results.ts');
            await postSuppressionsResults({ github, context, core });
