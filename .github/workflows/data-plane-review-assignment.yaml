# Data-Plane API Review - Assign Reviewers
#
# When the `APIStewardshipBoard-ReviewRequested` label is applied to a data-plane PR,
# request review from (and assign, for notification) the data-plane stewardship review
# pool. The pool is the `APIStewardshipBoard-SignedOff` authorized-users list in
# `.github/protected-labels.yml` (single source of truth). Removing the label removes
# the pool from the PR.
name: "Data-Plane API Review - Assign Reviewers"

on:
  pull_request_target:
    types:
      - labeled
      - unlabeled
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

# Serialize runs per PR so racing labeled/unlabeled events reconcile against the current
# label set instead of interleaving. Do not cancel in-progress runs: a cancelled run could
# drop an assign or a cleanup mid-flight.
concurrency:
  group: data-plane-review-assignment-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  assign-reviewers:
    name: Assign Data-Plane Review Pool
    runs-on: ubuntu-24.04
    steps:
      # IMPORTANT: This workflow uses pull_request_target, which runs with repo write
      # permissions. Only base-branch code is checked out below, and no PR-head code is
      # ever executed - the job only calls the GitHub REST API via github-script.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - name: Assign data-plane review pool
        uses: actions/github-script@v8
        with:
          script: |
            const { default: assignReviewers } =
              await import('${{ github.workspace }}/.github/workflows/src/data-plane-review/assign-reviewers.js');
            await assignReviewers({ github, context, core });
