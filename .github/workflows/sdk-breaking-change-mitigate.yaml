name: SDK Breaking Change Mitigation

on:
  workflow_run:
    workflows: ["SDK Breaking Change Analysis - Publish Results"]
    types: [completed]
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: "Completed SDK Breaking Change Analysis - Publish Results workflow run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  copilot-requests: write
  issues: write
  pull-requests: write

jobs:
  mitigate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: >-
        sdk-breaking-mitigate-${{ inputs.workflow_run_id || github.event.workflow_run.id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      AZSDK_CLI_PATH: /tmp/bin
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          path: repositories/workflow-repository
          persist-credentials: false

      - name: Install Azure SDK CLI
        shell: pwsh
        run: ./repositories/workflow-repository/eng/common/mcp/azure-sdk-mcp.ps1 -InstallDirectory $env:AZSDK_CLI_PATH

      - name: Download published analysis results
        uses: actions/download-artifact@v8
        with:
          name: sdk-breaking-change-results
          path: ${{ runner.temp }}/published-analysis-results
          github-token: ${{ github.token }}
          run-id: ${{ inputs.workflow_run_id || github.event.workflow_run.id }}

      - name: Resolve mitigation trigger
        id: resolve-trigger
        uses: actions/github-script@v9
        env:
          PUBLISHED_RESULTS_PATH: ${{ runner.temp }}/published-analysis-results/sdk-breaking-change-analysis.json
        with:
          script: |
            const fs = await import("node:fs/promises");
            const analysis = JSON.parse(
              await fs.readFile(process.env.PUBLISHED_RESULTS_PATH, "utf8"),
            );
            if (analysis.status !== "success") {
              core.notice("The SDK breaking-change analysis did not succeed.");
              core.setOutput("should-run", "false");
              return;
            }
            const pullNumber = Number(analysis.prNumber);
            const sdkLanguage = String(analysis.sdkLanguage ?? "").trim();
            const headSha = String(analysis.headSha ?? "").trim();
            if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
              throw new Error(`Invalid pull request number: ${pullNumber}`);
            }
            if (!sdkLanguage) {
              throw new Error("SDK language is required.");
            }
            const sdkRepositories = {
              android: "azure-sdk-for-android",
              cpp: "azure-sdk-for-cpp",
              dotnet: "azure-sdk-for-net",
              go: "azure-sdk-for-go",
              java: "azure-sdk-for-java",
              javascript: "azure-sdk-for-js",
              python: "azure-sdk-for-python",
              rust: "azure-sdk-for-rust",
            };
            const sdkRepository = sdkRepositories[sdkLanguage.toLowerCase()];
            if (!sdkRepository) {
              throw new Error(`Unsupported SDK language: ${sdkLanguage}`);
            }

            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            if (!headSha || pull.head.sha !== headSha) {
              throw new Error(
                `Pull request head ${pull.head.sha} does not match analyzed head ${headSha}.`,
              );
            }

            core.setOutput("should-run", "true");
            core.setOutput("pull-number", pullNumber);
            core.setOutput("sdk-language", sdkLanguage);
            core.setOutput("sdk-repository", sdkRepository);
            core.setOutput("head-repository", pull.head.repo.full_name);
            core.setOutput("head-sha", pull.head.sha);
            core.setOutput("head-branch", pull.head.ref);

      - name: Checkout specification PR source
        if: steps.resolve-trigger.outputs.should-run == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.resolve-trigger.outputs.head-repository }}
          ref: ${{ steps.resolve-trigger.outputs.head-sha }}
          path: repositories/azure-rest-api-specs
          persist-credentials: false

      - name: Set up Node.js and install specification repository dependencies
        if: steps.resolve-trigger.outputs.should-run == 'true'
        uses: ./repositories/workflow-repository/.github/actions/setup-node-install-deps
        with:
          working-directory: repositories/azure-rest-api-specs

      - name: Checkout target SDK repository
        if: steps.resolve-trigger.outputs.should-run == 'true'
        uses: actions/checkout@v7
        with:
          repository: Azure/${{ steps.resolve-trigger.outputs.sdk-repository }}
          ref: main
          path: repositories/${{ steps.resolve-trigger.outputs.sdk-repository }}
          persist-credentials: false
      - name: Set up GitHub Copilot CLI
        id: setup-copilot-cli
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/copilot-cli"
          npm_config_ignore_scripts=false npm install \
            --global \
            --prefix "$install_dir" \
            @github/copilot
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          copilot_path="$install_dir/bin/copilot"
          test -x "$copilot_path"
          "$copilot_path" --version
          echo "path=$copilot_path" >> "$GITHUB_OUTPUT"

      - name: Mitigate SDK breaking changes
        id: mitigate-sdk-breaking-changes
        if: steps.resolve-trigger.outputs.should-run == 'true'
        shell: bash
        env:
          ANALYSIS_RESULT_PATH: ${{ runner.temp }}/published-analysis-results/sdk-breaking-change-analysis.json
          AZSDK_COPILOT_CLI_PATH: ${{ steps.setup-copilot-cli.outputs.path }}
          AZSDK_COPILOT_GITHUB_TOKEN: ${{ github.token }}
          SDK_REPOSITORY_PATH: ${{ github.workspace }}/repositories/${{ steps.resolve-trigger.outputs.sdk-repository }}
          SPEC_REPOSITORY_PATH: ${{ github.workspace }}/repositories/azure-rest-api-specs
        run: |
          set -euo pipefail
          mitigation_log="$RUNNER_TEMP/sdk-breaking-change-mitigation.log"
          exec > >(tee "$mitigation_log") 2>&1
          echo "$AZSDK_CLI_PATH" >> "$GITHUB_PATH"
          export PATH="$AZSDK_CLI_PATH:$PATH"

          mitigation_results_dir="$RUNNER_TEMP/sdk-breaking-change-mitigation-results"
          mkdir -p "$mitigation_results_dir"
          test -f "$ANALYSIS_RESULT_PATH"
          while IFS= read -r project; do
            project_index="$(jq -r '.key' <<< "$project")"
            project_data="$(jq -c '.value' <<< "$project")"
            typespec_project_path="$(jq -r '.typespecProject' <<< "$project_data")"
            package_name="$(jq -r '.sdkPackage' <<< "$project_data")"
            results_path="project-$((project_index + 1))"
            project_results_dir="$mitigation_results_dir/$results_path"
            mitigation_results="$project_results_dir/mitigation-results.json"
            mkdir -p "$project_results_dir"
            echo '[]' > "$mitigation_results"

            breaking_change_count="$(jq '.breakingChanges | length' <<< "$project_data")"
            if [[ "$breaking_change_count" -eq 0 ]]; then
              echo "No SDK breaking changes found for $typespec_project_path."
              continue
            fi

            tsp_project_path="$(realpath "$SPEC_REPOSITORY_PATH/$typespec_project_path")"
            if [[ ! -d "$tsp_project_path" || "$tsp_project_path" != "$SPEC_REPOSITORY_PATH"/specification/* ]]; then
              echo "Invalid TypeSpec project path: $typespec_project_path" >&2
              exit 1
            fi

            package_paths=()
            while IFS= read -r -d '' tsp_location_path; do
              candidate_package_path="$(dirname "$tsp_location_path")"
              if [[ "$(basename "$candidate_package_path")" == "$package_name" ]]; then
                package_paths+=("$(realpath "$candidate_package_path")")
              fi
            done < <(find "$SDK_REPOSITORY_PATH" -type f -name tsp-location.yaml -print0)
            if [[ ${#package_paths[@]} -ne 1 ]]; then
              echo "Expected exactly one SDK package named $package_name, found ${#package_paths[@]}." >&2
              printf '  %s\n' "${package_paths[@]}" >&2
              exit 1
            fi
            package_path="${package_paths[0]}"

            breaking_change_number=0
            while IFS= read -r breaking_change; do
              mitigation_result="$RUNNER_TEMP/sdk-mitigation-result-$breaking_change_number.json"
              breaking_change_number="$((breaking_change_number + 1))"
              echo "Mitigating SDK breaking change $breaking_change_number of $breaking_change_count for $typespec_project_path."
              customization_request="Resolve this SDK breaking change: $breaking_change"
              mitigation_succeeded=true
              if ! azsdk typespec client customized-update \
                  --tsp-project-path "$tsp_project_path" \
                  --package-path "$package_path" \
                  --customization-request "$customization_request" \
                  --edit-scope 2 \
                  --output json | tee "$mitigation_result"; then
                mitigation_succeeded=false
              fi

              if [[ "$mitigation_succeeded" == "true" ]] && jq -e . "$mitigation_result" > /dev/null; then
                clean_result="$(
                  jq -c \
                    --argjson breakingChange "$breaking_change" \
                    '(.result // .) as $result |
                    ($result.success // false) as $isResolved | {
                      breakingChange: ($breakingChange.breakingChange // $breakingChange),
                      isResolved: $isResolved,
                      Resolution: ($result.Resolution // $result.resolution // $breakingChange.resolution // "")
                    } + if $isResolved then {
                      TypeSpecChangesSummary: ($result.TypeSpecChangesSummary // $result.typeSpecChangesSummary // "")
                    } else {} end' \
                    "$mitigation_result"
                )"
              else
                clean_result="$(
                  jq -cn \
                    --argjson breakingChange "$breaking_change" \
                    '{
                      breakingChange: ($breakingChange.breakingChange // $breakingChange),
                      isResolved: false,
                      Resolution: ($breakingChange.resolution // "")
                    }'
                )"
              fi
              jq --argjson result "$clean_result" '. + [$result]' \
                "$mitigation_results" > "$mitigation_results.tmp"
              mv "$mitigation_results.tmp" "$mitigation_results"
              if [[ "$mitigation_succeeded" != "true" ]]; then
                exit 1
              fi
            done < <(
              jq -c '.breakingChanges[] | {
                breakingChange,
                category,
                resolution: .suggestedFix
              }' <<< "$project_data"
            )
          done < <(jq -c '.projects | to_entries[]' "$ANALYSIS_RESULT_PATH")

          jq '.' "$mitigation_results" > "$mitigation_results.tmp"
          mv "$mitigation_results.tmp" "$mitigation_results"

      - name: Upload mitigation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-breaking-change-mitigation-results
          path: ${{ runner.temp }}/sdk-breaking-change-mitigation-results
          if-no-files-found: warn
          retention-days: 7

      - name: Get mitigation changed code
        if: steps.resolve-trigger.outputs.should-run == 'true'
        id: get-changed-code
        shell: bash
        working-directory: repositories/azure-rest-api-specs
        run: |
          set -euo pipefail
          git add --intent-to-add --all
          changed_code="$(git diff --no-ext-diff --no-color)"
          max_snippet_length=12000
          if [[ ${#changed_code} -gt $max_snippet_length ]]; then
            changed_code="${changed_code:0:$max_snippet_length}"$'\n... diff truncated.'
          fi
          delimiter="changed_code_${RANDOM}_${RANDOM}"
          {
            echo "changed-code<<$delimiter"
            printf '%s\n' "$changed_code"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Publish mitigation summary
        if: steps.resolve-trigger.outputs.should-run == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve-trigger.outputs.pull-number }}
          SDK_LANGUAGE: ${{ steps.resolve-trigger.outputs.sdk-language }}
          MITIGATION_COMMIT: ${{ steps.resolve-trigger.outputs.head-sha }}
          MITIGATION_CHANGED_CODE: ${{ steps.get-changed-code.outputs.changed-code }}
        run: |
          {
            echo "## SDK breaking-change mitigation"
            echo
            printf '%s\n\n' "**Pull request:** #$PR_NUMBER"
            printf '%s\n\n' "**SDK language:** $SDK_LANGUAGE"
            printf '%s\n\n' "**Mitigation upon commit:** \`$MITIGATION_COMMIT\`"
            echo "## Customization Code"
            echo
            if [[ -n "$MITIGATION_CHANGED_CODE" ]]; then
              echo '````diff'
              printf '%s\n' "$MITIGATION_CHANGED_CODE"
              echo '````'
            else
              echo "No mitigation changes were produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface mitigation result on pull request
        if: steps.resolve-trigger.outputs.should-run == 'true'
        uses: actions/github-script@v9
        env:
          WORKFLOW_SUMMARY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#summary-${{ job.check_run_id }}
          ANALYSIS_RESULT_PATH: ${{ runner.temp }}/published-analysis-results/sdk-breaking-change-analysis.json
          MITIGATION_RESULTS_PATH: ${{ runner.temp }}/sdk-breaking-change-mitigation-results
          PR_NUMBER: ${{ steps.resolve-trigger.outputs.pull-number }}
          SDK_LANGUAGE: ${{ steps.resolve-trigger.outputs.sdk-language }}
          MITIGATION_COMMIT: ${{ steps.resolve-trigger.outputs.head-sha }}
          MITIGATION_CHANGED_CODE: ${{ steps.get-changed-code.outputs.changed-code }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = await import("node:fs/promises");
            const path = await import("node:path");
            const pullNumber = Number(process.env.PR_NUMBER);
            const analysis = JSON.parse(
              await fs.readFile(process.env.ANALYSIS_RESULT_PATH, "utf8"),
            );
            const projectMitigationResults = await Promise.all(
              analysis.projects.map(async (project, index) => ({
                project,
                results: JSON.parse(
                    await fs.readFile(
                      path.join(
                        process.env.MITIGATION_RESULTS_PATH,
                        `project-${index + 1}`,
                        "mitigation-results.json",
                      ),
                      "utf8",
                    ),
                  ),
              })),
            );
            const escapeTableCell = (value, fallback = "-") => {
              const text = String(value ?? "").trim();
              return text
                ? text.replaceAll("\r", "").replaceAll("\n", "<br>").replaceAll("|", "\\|")
                : fallback;
            };
            const projectSections = projectMitigationResults.flatMap(({ project, results }) => {
              const resolvedChanges = results
                .filter((result) => result?.isResolved === true)
                .map(
                  (result) =>
                    `| ${escapeTableCell(result.breakingChange)} | ${escapeTableCell(result.Resolution)} | ${escapeTableCell(result.TypeSpecChangesSummary?.[0])} |`,
                );
              const unresolvedChanges = results
                .filter((result) => result?.isResolved !== true)
                .map(
                  (result) =>
                    `| ${escapeTableCell(result.breakingChange)} | ${escapeTableCell(result.Resolution)} |`,
                );
              return [
                `**TypeSpec project:** ${project.typespecProject}`,
                "",
                `**SDK package:** ${project.sdkPackage}`,
                "",
                "**Resolved Breaking Changes:**",
                "",
                "| Breaking change | Resolution | TypeSpec changes |",
                "| --- | --- | --- |",
                ...(resolvedChanges.length
                  ? resolvedChanges
                  : ["| None | No SDK breaking changes were resolved. | - |"]),
                "",
                "**Unresolved Breaking Changes:**",
                "",
                "| Breaking change | Suggested resolution |",
                "| --- | --- |",
                ...(unresolvedChanges.length
                  ? unresolvedChanges
                  : ["| None | All SDK breaking changes were resolved. |"]),
                "",
              ];
            });

            const changedCode = process.env.MITIGATION_CHANGED_CODE?.trim();
            const report = [
              "## SDK breaking-change mitigation result",
              "",
              `**Mitigation upon commit:** \`${process.env.MITIGATION_COMMIT}\``,
              "",
              ...projectSections,
              "**Customization Code:**",
              "",
              changedCode
                ? ["````diff", changedCode, "````"].join("\n")
                : "No mitigation changes were produced.",
              `[View changed code in the workflow summary](${process.env.WORKFLOW_SUMMARY_URL})`,
            ].join("\n");

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pullNumber,
              body: report,
            });

      - name: Report breaking-change mitigation failure
        if: failure()
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.resolve-trigger.outputs.pull-number }}
          MITIGATION_OUTCOME: ${{ steps.mitigate-sdk-breaking-changes.outcome }}
          MITIGATION_LOG_PATH: ${{ runner.temp }}/sdk-breaking-change-mitigation.log
          JOB_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = await import("node:fs/promises");
            let errorDetails = "";
            if (process.env.MITIGATION_OUTCOME === "failure") {
              try {
                const mitigationLog = await fs.readFile(
                  process.env.MITIGATION_LOG_PATH,
                  "utf8",
                );
                errorDetails = mitigationLog
                  .trim()
                  .split(/\r?\n/)
                  .slice(-30)
                  .map((line) => `    ${line}`)
                  .join("\n");
              } catch (error) {
                core.warning(`Unable to read the mitigation error log: ${error.message}`);
              }
            }

            const failureReport = [
              "> [!CAUTION]\n> SDK breaking-change mitigation failed",
              errorDetails && `\n### Error log\n\n${errorDetails}`,
              `\n[See failed step](${process.env.JOB_LOG_URL})`,
            ]
              .filter(Boolean)
              .join("\n");

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: failureReport,
            });
