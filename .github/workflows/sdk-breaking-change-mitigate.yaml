name: SDK Breaking Change Mitigation

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to mitigate"
        required: true
        type: string
      sdk_language:
        description: "SDK language"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  copilot-requests: write
  issues: write
  pull-requests: write

jobs:
  mitigate:
    if: >-
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate')) ||
      github.event_name == 'workflow_dispatch'
    concurrency:
      group: >-
        sdk-breaking-mitigate-${{ github.event.issue.number || inputs.pr_number }}-${{
        inputs.sdk_language ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate javascript') && 'JavaScript') ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate typescript') && 'JavaScript') ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate dotnet') && 'DotNet') ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate csharp') && 'DotNet') ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate .net') && 'DotNet') ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate android') && 'Android') ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate cpp') && 'Cpp') ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate java') && 'Java') ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate python') && 'Python') ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate rust') && 'Rust') ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate go') && 'Go') ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate js') && 'JavaScript') ||
        (startsWith(github.event.comment.body, '/azsdk sdk-breaking-mitigate ts') && 'JavaScript') ||
        'unknown' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      AZSDK_CLI_PATH: /tmp/bin
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          path: repositories/workflow-repository
          persist-credentials: false

      - name: Install Azure SDK CLI
        shell: pwsh
        run: ./repositories/workflow-repository/eng/common/mcp/azure-sdk-mcp.ps1 -InstallDirectory $env:AZSDK_CLI_PATH

      - name: Resolve mitigation trigger
        id: resolve-trigger
        uses: actions/github-script@v9
        with:
          script: |
            let pullNumber;
            let sdkLanguage = "";
            let triggerCommentId = "";

            if (context.eventName === "workflow_dispatch") {
              pullNumber = Number(context.payload.inputs.pr_number);
              if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
                throw new Error(`Invalid pull request number: ${context.payload.inputs.pr_number}`);
              }
              sdkLanguage = context.payload.inputs.sdk_language?.trim() ?? "";
              core.setOutput("should-run", "true");
            } else if (context.eventName === "issue_comment") {
              const command = context.payload.comment.body.split(/\r?\n/, 1)[0].trim();
              const parts = command.split(/\s+/);
              if (
                parts.length !== 3 ||
                parts[0] !== "/azsdk" ||
                parts[1] !== "sdk-breaking-mitigate"
              ) {
                throw new Error("Expected comment: /azsdk sdk-breaking-mitigate <sdk-language>");
              }
              pullNumber = context.payload.issue.number;
              sdkLanguage = parts[2];
              triggerCommentId = String(context.payload.comment.id);
              core.setOutput("should-run", "true");
            }

            core.setOutput("pull-number", pullNumber);
            core.setOutput("sdk-language", sdkLanguage);
            core.setOutput("trigger-comment-id", triggerCommentId);

      - name: Mark mitigation in progress
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const command = context.payload.comment.body.split(/\r?\n/, 1)[0].trim();
            try {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: context.payload.comment.id,
                body: `${command}\n\nMitigating SDK breaking changes ...`,
              });
            } catch (error) {
              if (error.status !== 403) throw error;
              core.warning("The workflow token cannot update the trigger comment with mitigation status.");
            }

      - name: Find analysis results from pull request comment
        if: steps.resolve-trigger.outputs.should-run == 'true'
        id: find-analysis-results
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.resolve-trigger.outputs.pull-number }}
          SDK_LANGUAGE: ${{ steps.resolve-trigger.outputs.sdk-language }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullNumber = Number(process.env.PR_NUMBER);
            const sdkLanguage = process.env.SDK_LANGUAGE.trim();
            if (!sdkLanguage) {
              throw new Error("An SDK language is required to find matching analysis results.");
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const expectedCommand = `/azsdk sdk-breaking-analysis ${sdkLanguage}`;
            const analysisComment = comments
              .filter(
                ({ body }) =>
                  body?.split(/\r?\n/, 1)[0].trim().toLowerCase() ===
                  expectedCommand.toLowerCase(),
              )
              .sort((left, right) => right.id - left.id)[0];
            if (!analysisComment) {
              throw new Error(`No pull request comment starts with: ${expectedCommand}`);
            }

            const resultLinks = [
              ...analysisComment.body.matchAll(
                /\[SDK breaking change details \(([^)]+\/breaking-changes\.json)\)\]\(([^)]+)\)/g,
              ),
            ];
            if (!resultLinks.length) {
              throw new Error(`The matching analysis comment does not contain breaking-change result links.`);
            }
            const runIds = new Set(
              resultLinks.map(([, , url]) => url.match(/\/actions\/runs\/(\d+)/)?.[1]),
            );
            if (runIds.has(undefined) || runIds.size !== 1) {
              throw new Error("Could not resolve one analysis workflow run from the result links.");
            }
            const runId = Number([...runIds][0]);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: runId,
              per_page: 100,
            });
            const artifact = artifacts.find(
              ({ name, expired }) => name === "sdk-breaking-change-results" && !expired,
            );
            if (!artifact) {
              throw new Error(`Analysis artifact for workflow run ${runId} was not found or has expired.`);
            }

            const download = await github.rest.actions.downloadArtifact({
              ...context.repo,
              artifact_id: artifact.id,
              archive_format: "zip",
            });
            const fs = await import("node:fs/promises");
            const path = await import("node:path");
            const artifactPath = path.join(process.env.RUNNER_TEMP, "analysis-results.zip");
            await fs.writeFile(artifactPath, Buffer.from(download.data));
            core.setOutput("artifact-path", artifactPath);
            core.setOutput(
              "result-paths",
              JSON.stringify(resultLinks.map(([, resultPath]) => resultPath)),
            );

      - name: Read analysis trigger metadata
        if: steps.resolve-trigger.outputs.should-run == 'true'
        id: read-trigger
        shell: bash
        env:
          ARTIFACT_PATH: ${{ steps.find-analysis-results.outputs.artifact-path }}
          RESULT_PATHS: ${{ steps.find-analysis-results.outputs.result-paths }}
          PR_NUMBER: ${{ steps.resolve-trigger.outputs.pull-number }}
          SDK_LANGUAGE: ${{ steps.resolve-trigger.outputs.sdk-language }}
          TRIGGER_COMMENT_ID: ${{ steps.resolve-trigger.outputs.trigger-comment-id }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/analysis-results"
          rm -rf "$results_dir"
          mkdir -p "$results_dir"
          unzip -q "$ARTIFACT_PATH" -d "$results_dir"
          trigger_path="$results_dir/trigger.json"
          manifest_path="$results_dir/projects.json"
          if [[ ! -f "$manifest_path" ]]; then
            echo "Analysis artifact does not contain projects.json." >&2
            find "$results_dir" -maxdepth 2 -type f -print >&2
            exit 1
          fi
          if [[ -f "$trigger_path" ]]; then
            pull_number="$(jq -r '.pullNumber' "$trigger_path")"
            sdk_language="$(jq -r '.sdkLanguage' "$trigger_path")"
            trigger_comment_id="$(jq -r '.triggerCommentId' "$trigger_path")"
          else
            pull_number="$PR_NUMBER"
            sdk_language="$SDK_LANGUAGE"
            trigger_comment_id="$TRIGGER_COMMENT_ID"
          fi
          {
            echo "pull-number=$pull_number"
            echo "sdk-language=$sdk_language"
            echo "trigger-comment-id=$trigger_comment_id"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "$RESULT_PATHS" ]]; then
            jq --argjson resultPaths "$RESULT_PATHS" \
              'map(. as $project | select($resultPaths | index($project.resultsPath + "/breaking-changes.json")))' \
              "$manifest_path" > "$results_dir/projects.filtered.json"
            mv "$results_dir/projects.filtered.json" "$manifest_path"
            if [[ "$(jq 'length' "$manifest_path")" -eq 0 ]]; then
              echo "No manifest projects matched the result paths from the analysis comment: $RESULT_PATHS" >&2
              exit 1
            fi
          fi

      - name: Resolve specification PR source
        if: steps.resolve-trigger.outputs.should-run == 'true'
        id: resolve-pr-source
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.resolve-trigger.outputs.pull-number || steps.read-trigger.outputs.pull-number }}
        with:
          script: |
            const pullNumber = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
              throw new Error(`Invalid pull request number: ${process.env.PR_NUMBER}`);
            }
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            core.setOutput("repository", pull.head.repo.full_name);
            core.setOutput("sha", pull.head.sha);
            core.setOutput("branch", pull.head.ref);

      - name: Verify pull request was not updated after the trigger
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.resolve-trigger.outputs.pull-number }}
          EXPECTED_SHA: ${{ steps.resolve-pr-source.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullNumber = Number(process.env.PR_NUMBER);
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            if (pull.head.sha !== process.env.EXPECTED_SHA) {
              throw new Error(
                `The pull request head changed from ${process.env.EXPECTED_SHA} to ${pull.head.sha}. Skip this mitigation.`,
              );
            }

      - name: Checkout specification PR source
        if: steps.resolve-trigger.outputs.should-run == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.resolve-pr-source.outputs.repository }}
          ref: ${{ steps.resolve-pr-source.outputs.sha }}
          path: repositories/azure-rest-api-specs
          persist-credentials: false

      - name: Set up Node.js and install specification repository dependencies
        if: steps.resolve-trigger.outputs.should-run == 'true'
        uses: ./repositories/workflow-repository/.github/actions/setup-node-install-deps
        with:
          working-directory: repositories/azure-rest-api-specs

      - name: Resolve target SDK repository
        if: steps.resolve-trigger.outputs.should-run == 'true'
        id: resolve-sdk-repository
        uses: actions/github-script@v9
        env:
          SDK_LANGUAGE: ${{ steps.resolve-trigger.outputs.sdk-language || steps.read-trigger.outputs.sdk-language }}
        with:
          script: |
            const repositories = {
              android: "azure-sdk-for-android",
              cpp: "azure-sdk-for-cpp",
              dotnet: "azure-sdk-for-net",
              go: "azure-sdk-for-go",
              java: "azure-sdk-for-java",
              javascript: "azure-sdk-for-js",
              python: "azure-sdk-for-python",
              rust: "azure-sdk-for-rust",
            };
            const sdkLanguage = process.env.SDK_LANGUAGE.trim().toLowerCase();
            const repository = repositories[sdkLanguage];
            if (!repository) {
              throw new Error(`Unsupported SDK language: ${process.env.SDK_LANGUAGE}`);
            }
            core.setOutput("repository", repository);

      - name: Checkout target SDK repository
        if: steps.resolve-trigger.outputs.should-run == 'true'
        uses: actions/checkout@v7
        with:
          repository: Azure/${{ steps.resolve-sdk-repository.outputs.repository }}
          ref: main
          path: repositories/${{ steps.resolve-sdk-repository.outputs.repository }}
          persist-credentials: false
      - name: Set up GitHub Copilot CLI
        id: setup-copilot-cli
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/copilot-cli"
          npm_config_ignore_scripts=false npm install \
            --global \
            --prefix "$install_dir" \
            @github/copilot
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          copilot_path="$install_dir/bin/copilot"
          test -x "$copilot_path"
          "$copilot_path" --version
          echo "path=$copilot_path" >> "$GITHUB_OUTPUT"

      - name: Mitigate SDK breaking changes
        id: mitigate-sdk-breaking-changes
        if: steps.resolve-trigger.outputs.should-run == 'true'
        shell: bash
        env:
          ANALYSIS_RESULTS_PATH: ${{ runner.temp }}/analysis-results
          AZSDK_COPILOT_CLI_PATH: ${{ steps.setup-copilot-cli.outputs.path }}
          AZSDK_COPILOT_GITHUB_TOKEN: ${{ github.token }}
          SDK_REPOSITORY_PATH: ${{ github.workspace }}/repositories/${{ steps.resolve-sdk-repository.outputs.repository }}
          SPEC_REPOSITORY_PATH: ${{ github.workspace }}/repositories/azure-rest-api-specs
        run: |
          set -euo pipefail
          mitigation_log="$RUNNER_TEMP/sdk-breaking-change-mitigation.log"
          exec > >(tee "$mitigation_log") 2>&1
          echo "$AZSDK_CLI_PATH" >> "$GITHUB_PATH"
          export PATH="$AZSDK_CLI_PATH:$PATH"

          manifest="$ANALYSIS_RESULTS_PATH/projects.json"
          mitigation_results_dir="$RUNNER_TEMP/sdk-breaking-change-mitigation-results"
          mkdir -p "$mitigation_results_dir"
          test -f "$manifest"
          while IFS= read -r project; do
            typespec_project_path="$(jq -r '.typespecProjectPath' <<< "$project")"
            package_name="$(jq -r '.packageName' <<< "$project")"
            results_path="$(jq -r '.resultsPath' <<< "$project")"
            breaking_changes_path="$ANALYSIS_RESULTS_PATH/$results_path/breaking-changes.json"
            project_results_dir="$mitigation_results_dir/$results_path"
            mitigation_results="$project_results_dir/mitigation-results.json"
            mkdir -p "$project_results_dir"
            echo '[]' > "$mitigation_results"
            test -f "$breaking_changes_path"

            breaking_change_count="$(jq '.result.breakingChanges | length' "$breaking_changes_path")"
            if [[ "$breaking_change_count" -eq 0 ]]; then
              echo "No SDK breaking changes found for $typespec_project_path."
              continue
            fi

            tsp_project_path="$(realpath "$SPEC_REPOSITORY_PATH/$typespec_project_path")"
            if [[ ! -d "$tsp_project_path" || "$tsp_project_path" != "$SPEC_REPOSITORY_PATH"/specification/* ]]; then
              echo "Invalid TypeSpec project path: $typespec_project_path" >&2
              exit 1
            fi

            package_paths=()
            while IFS= read -r -d '' tsp_location_path; do
              candidate_package_path="$(dirname "$tsp_location_path")"
              if [[ "$(basename "$candidate_package_path")" == "$package_name" ]]; then
                package_paths+=("$(realpath "$candidate_package_path")")
              fi
            done < <(find "$SDK_REPOSITORY_PATH" -type f -name tsp-location.yaml -print0)
            if [[ ${#package_paths[@]} -ne 1 ]]; then
              echo "Expected exactly one SDK package named $package_name, found ${#package_paths[@]}." >&2
              printf '  %s\n' "${package_paths[@]}" >&2
              exit 1
            fi
            package_path="${package_paths[0]}"

            breaking_change_number=0
            while IFS= read -r breaking_change; do
              mitigation_result="$RUNNER_TEMP/sdk-mitigation-result-$breaking_change_number.json"
              breaking_change_number="$((breaking_change_number + 1))"
              echo "Mitigating SDK breaking change $breaking_change_number of $breaking_change_count for $typespec_project_path."
              customization_request="Resolve this SDK breaking change: $breaking_change"
              mitigation_succeeded=true
              if ! azsdk typespec client customized-update \
                  --tsp-project-path "$tsp_project_path" \
                  --package-path "$package_path" \
                  --customization-request "$customization_request" \
                  --edit-scope 2 \
                  --output json | tee "$mitigation_result"; then
                mitigation_succeeded=false
              fi

              if [[ "$mitigation_succeeded" == "true" ]] && jq -e . "$mitigation_result" > /dev/null; then
                clean_result="$(
                  jq -c \
                    --argjson breakingChange "$breaking_change" \
                    '(.result // .) as $result |
                    ($result.success // false) as $isResolved | {
                      breakingChange: ($breakingChange.breakingChange // $breakingChange),
                      isResolved: $isResolved,
                      Resolution: ($result.Resolution // $result.resolution // $breakingChange.resolution // "")
                    } + if $isResolved then {
                      TypeSpecChangesSummary: ($result.TypeSpecChangesSummary // $result.typeSpecChangesSummary // "")
                    } else {} end' \
                    "$mitigation_result"
                )"
              else
                clean_result="$(
                  jq -cn \
                    --argjson breakingChange "$breaking_change" \
                    '{
                      breakingChange: ($breakingChange.breakingChange // $breakingChange),
                      isResolved: false,
                      Resolution: ($breakingChange.resolution // "")
                    }'
                )"
              fi
              jq --argjson result "$clean_result" '. + [$result]' \
                "$mitigation_results" > "$mitigation_results.tmp"
              mv "$mitigation_results.tmp" "$mitigation_results"
              if [[ "$mitigation_succeeded" != "true" ]]; then
                exit 1
              fi
            done < <(jq -c '.result.breakingChanges[]' "$breaking_changes_path")
          done < <(jq -c '.[]' "$manifest")

          jq '.' "$mitigation_results" > "$mitigation_results.tmp"
          mv "$mitigation_results.tmp" "$mitigation_results"

      - name: Upload mitigation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-breaking-change-mitigation-results
          path: ${{ runner.temp }}/sdk-breaking-change-mitigation-results
          if-no-files-found: warn
          retention-days: 7

      - name: Commit mitigation changes
        if: steps.resolve-trigger.outputs.should-run == 'true'
        id: commit-changes
        shell: bash
        working-directory: repositories/azure-rest-api-specs
        env:
          PR_NUMBER: ${{ steps.resolve-trigger.outputs.pull-number || steps.read-trigger.outputs.pull-number }}
          SDK_LANGUAGE: ${{ steps.resolve-trigger.outputs.sdk-language || steps.read-trigger.outputs.sdk-language }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No mitigation changes were produced."
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sdk_language="$(tr '[:upper:]' '[:lower:]' <<< "$SDK_LANGUAGE" | sed 's/[^a-z0-9-]/-/g')"
          branch="sdk-breaking-change-mitigation-pr-${PR_NUMBER}-${sdk_language}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add --all
          git commit -m "Mitigate SDK breaking changes"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "has-changes=true" >> "$GITHUB_OUTPUT"

      - name: Create remote mitigation branch
        if: steps.commit-changes.outputs.has-changes == 'true'
        uses: actions/github-script@v9
        env:
          SOURCE_REPOSITORY: ${{ steps.resolve-pr-source.outputs.repository }}
          SOURCE_SHA: ${{ steps.resolve-pr-source.outputs.sha }}
          MITIGATION_BRANCH: ${{ steps.commit-changes.outputs.branch }}
        with:
          github-token: ${{ github.token }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split("/");
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${process.env.MITIGATION_BRANCH}`,
              sha: process.env.SOURCE_SHA,
            });

      - name: Push mitigation changes
        if: steps.commit-changes.outputs.has-changes == 'true'
        shell: bash
        working-directory: repositories/azure-rest-api-specs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ steps.resolve-pr-source.outputs.repository }}
          MITIGATION_BRANCH: ${{ steps.commit-changes.outputs.branch }}
        run: |
          set -euo pipefail
          authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push "https://github.com/$SOURCE_REPOSITORY.git" "HEAD:refs/heads/$MITIGATION_BRANCH"

      - name: Create mitigation pull request
        if: steps.commit-changes.outputs.has-changes == 'true'
        id: create-mitigation-pull-request
        uses: actions/github-script@v9
        env:
          SOURCE_REPOSITORY: ${{ steps.resolve-pr-source.outputs.repository }}
          SOURCE_BRANCH: ${{ steps.resolve-pr-source.outputs.branch }}
          MITIGATION_BRANCH: ${{ steps.commit-changes.outputs.branch }}
          ISSUED_PR_NUMBER: ${{ steps.resolve-trigger.outputs.pull-number || steps.read-trigger.outputs.pull-number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split("/");
            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              base: process.env.SOURCE_BRANCH,
              head: process.env.MITIGATION_BRANCH,
              title: `Mitigate SDK breaking changes for #${process.env.ISSUED_PR_NUMBER}`,
              body: `Automated SDK breaking-change mitigation for ${context.repo.owner}/${context.repo.repo}#${process.env.ISSUED_PR_NUMBER}.`,
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pull.number,
              per_page: 100,
            });
            const changedCode = files
              .map(({ filename, patch }) =>
                patch
                  ? [`diff --git a/${filename} b/${filename}`, patch].join("\n")
                  : `${filename}: Diff unavailable; view the mitigation pull request.`,
              )
              .join("\n");
            const maxSnippetLength = 12000;
            const changedCodeSnippet =
              changedCode.length > maxSnippetLength
                ? `${changedCode.slice(0, maxSnippetLength)}\n... diff truncated; view the mitigation pull request for the complete changes.`
                : changedCode;
            core.info(`Created mitigation pull request: ${pull.html_url}`);
            core.setOutput("changed-code", changedCodeSnippet);
            core.setOutput("pull-request-url", pull.html_url);

      - name: Publish mitigation summary
        if: steps.resolve-trigger.outputs.should-run == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve-trigger.outputs.pull-number || steps.read-trigger.outputs.pull-number }}
          SDK_LANGUAGE: ${{ steps.resolve-trigger.outputs.sdk-language || steps.read-trigger.outputs.sdk-language }}
          MITIGATION_COMMIT: ${{ steps.resolve-pr-source.outputs.sha }}
          MITIGATION_CHANGED_CODE: ${{ steps.create-mitigation-pull-request.outputs.changed-code }}
          MITIGATION_PR_URL: ${{ steps.create-mitigation-pull-request.outputs.pull-request-url }}
        run: |
          {
            echo "## SDK breaking-change mitigation"
            echo
            printf '%s\n\n' "**Pull request:** #$PR_NUMBER"
            printf '%s\n\n' "**SDK language:** $SDK_LANGUAGE"
            printf '%s\n\n' "**Mitigation upon commit:** \`$MITIGATION_COMMIT\`"
            if [[ -n "$MITIGATION_PR_URL" ]]; then
              printf '%s\n\n' "**Mitigation pull request:** $MITIGATION_PR_URL"
            fi
            echo "## Changed code"
            echo
            if [[ -n "$MITIGATION_CHANGED_CODE" ]]; then
              echo '````diff'
              printf '%s\n' "$MITIGATION_CHANGED_CODE"
              echo '````'
            else
              echo "No changed code was found in the mitigation pull request."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface mitigation result on pull request
        if: steps.resolve-trigger.outputs.should-run == 'true'
        uses: actions/github-script@v9
        env:
          WORKFLOW_SUMMARY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#summary-${{ job.check_run_id }}
          ANALYSIS_RESULTS_PATH: ${{ runner.temp }}/analysis-results
          MITIGATION_RESULTS_PATH: ${{ runner.temp }}/sdk-breaking-change-mitigation-results
          PR_NUMBER: ${{ steps.resolve-trigger.outputs.pull-number || steps.read-trigger.outputs.pull-number }}
          SDK_LANGUAGE: ${{ steps.resolve-trigger.outputs.sdk-language || steps.read-trigger.outputs.sdk-language }}
          MITIGATION_COMMIT: ${{ steps.resolve-pr-source.outputs.sha }}
          TRIGGER_COMMENT_ID: ${{ steps.resolve-trigger.outputs.trigger-comment-id || steps.read-trigger.outputs.trigger-comment-id }}
          MITIGATION_CHANGED_CODE: ${{ steps.create-mitigation-pull-request.outputs.changed-code }}
          MITIGATION_PR_URL: ${{ steps.create-mitigation-pull-request.outputs.pull-request-url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = await import("node:fs/promises");
            const path = await import("node:path");
            const pullNumber = Number(process.env.PR_NUMBER);
            const projects = JSON.parse(
              await fs.readFile(
                path.join(process.env.ANALYSIS_RESULTS_PATH, "projects.json"),
                "utf8",
              ),
            );
            const projectMitigationResults = await Promise.all(
              projects.map(async (project) => ({
                project,
                results: JSON.parse(
                    await fs.readFile(
                      path.join(
                        process.env.MITIGATION_RESULTS_PATH,
                        project.resultsPath,
                        "mitigation-results.json",
                      ),
                      "utf8",
                    ),
                  ),
              })),
            );
            const escapeTableCell = (value, fallback = "-") => {
              const text = String(value ?? "").trim();
              return text
                ? text.replaceAll("\r", "").replaceAll("\n", "<br>").replaceAll("|", "\\|")
                : fallback;
            };
            const projectSections = projectMitigationResults.flatMap(({ project, results }) => {
              const resolvedChanges = results
                .filter((result) => result?.isResolved === true)
                .map(
                  (result) =>
                    `| ${escapeTableCell(result.breakingChange)} | ${escapeTableCell(result.Resolution)} | ${escapeTableCell(result.TypeSpecChangesSummary)} |`,
                );
              const unresolvedChanges = results
                .filter((result) => result?.isResolved !== true)
                .map(
                  (result) =>
                    `| ${escapeTableCell(result.breakingChange)} | ${escapeTableCell(result.Resolution)} |`,
                );
              return [
                `**TypeSpec project:** ${project.typespecProjectPath}`,
                "",
                `**SDK package:** ${project.packageName}`,
                "",
                "**Resolved Breaking Changes:**",
                "",
                "| Breaking change | Resolution | TypeSpec changes |",
                "| --- | --- | --- |",
                ...(resolvedChanges.length
                  ? resolvedChanges
                  : ["| None | No SDK breaking changes were resolved. | - |"]),
                "",
                "**Unresolved Breaking Changes:**",
                "",
                "| Breaking change | Suggested resolution |",
                "| --- | --- |",
                ...(unresolvedChanges.length
                  ? unresolvedChanges
                  : ["| None | All SDK breaking changes were resolved. |"]),
                "",
              ];
            });

            const mitigationPullRequest = process.env.MITIGATION_PR_URL?.trim();
            const changedCode = process.env.MITIGATION_CHANGED_CODE?.trim();
            const report = [
              "## SDK breaking-change mitigation result",
              "",
              `**Mitigation upon commit:** \`${process.env.MITIGATION_COMMIT}\``,
              "",
              ...projectSections,
              "**Customization code:**",
              "",
              changedCode
                ? ["````diff", changedCode, "````"].join("\n")
                : "No changed code was found in the mitigation pull request.",
              `[View changed code in the workflow summary](${process.env.WORKFLOW_SUMMARY_URL})`,
              "",
              mitigationPullRequest
                ? `**Mitigation pull request:** ${mitigationPullRequest}`
                : "**Mitigation pull request:** Not created because no file changes were produced.",
            ].join("\n");

            const triggerCommentId = Number(process.env.TRIGGER_COMMENT_ID);
            if (Number.isSafeInteger(triggerCommentId) && triggerCommentId > 0) {
              const { data: comment } = await github.rest.issues.getComment({
                ...context.repo,
                comment_id: triggerCommentId,
              });
              const command = comment.body.split(/\r?\n/, 1)[0].trim();
              try {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: triggerCommentId,
                  body: `${command}\n\n${report}`,
                });
                return;
              } catch (error) {
                if (error.status !== 403) throw error;
                core.warning(
                  "The workflow token cannot edit the trigger comment; posting the mitigation result as a new PR comment instead.",
                );
              }
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pullNumber,
              body: report,
            });

      - name: Report breaking-change mitigation failure
        if: failure()
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.resolve-trigger.outputs.pull-number || github.event.issue.number || inputs.pr_number }}
          TRIGGER_COMMENT_ID: ${{ steps.resolve-trigger.outputs.trigger-comment-id || github.event.comment.id }}
          TRIGGER_NAME: ${{ github.event_name }}
          MITIGATION_OUTCOME: ${{ steps.mitigate-sdk-breaking-changes.outcome }}
          MITIGATION_LOG_PATH: ${{ runner.temp }}/sdk-breaking-change-mitigation.log
          JOB_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = await import("node:fs/promises");
            let errorDetails = "";
            if (process.env.MITIGATION_OUTCOME === "failure") {
              try {
                const mitigationLog = await fs.readFile(
                  process.env.MITIGATION_LOG_PATH,
                  "utf8",
                );
                errorDetails = mitigationLog
                  .trim()
                  .split(/\r?\n/)
                  .slice(-30)
                  .map((line) => `    ${line}`)
                  .join("\n");
              } catch (error) {
                core.warning(`Unable to read the mitigation error log: ${error.message}`);
              }
            }

            const failureReport = [
              "> [!CAUTION]\n> SDK breaking-change mitigation failed",
              errorDetails && `\n### Error log\n\n${errorDetails}`,
              `\n[See failed step](${process.env.JOB_LOG_URL})`,
            ]
              .filter(Boolean)
              .join("\n");

            const triggerCommentId = Number(process.env.TRIGGER_COMMENT_ID);
            if (
              process.env.TRIGGER_NAME === "issue_comment" &&
              Number.isSafeInteger(triggerCommentId) &&
              triggerCommentId > 0
            ) {
              try {
                const { data: comment } = await github.rest.issues.getComment({
                  ...context.repo,
                  comment_id: triggerCommentId,
                });
                const command = comment.body.split(/\r?\n/, 1)[0].trim();
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: triggerCommentId,
                  body: `${command}\n\n${failureReport}`,
                });
                return;
              } catch (error) {
                if (![403, 404].includes(error.status)) throw error;
                core.warning(
                  "The workflow token cannot read or edit the trigger comment; posting the failure as a new PR comment instead.",
                );
              }
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: failureReport,
            });
