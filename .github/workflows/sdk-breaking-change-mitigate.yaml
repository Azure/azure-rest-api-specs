name: SDK Breaking Change Mitigation

on: # zizmor: ignore[dangerous-triggers] Only base/default-branch workflow code runs; PR content is checked out separately.
  workflow_run:
    workflows: ["SDK Breaking Change Analysis - Analyze"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  resolve-trigger:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    outputs:
      head-branch: ${{ steps.resolve.outputs.head-branch }}
      head-repository: ${{ steps.resolve.outputs.head-repository }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      sdk-language: ${{ steps.resolve.outputs.sdk-language }}
      sdk-repository: ${{ steps.resolve.outputs.sdk-repository }}
      should-run: ${{ steps.resolve.outputs.should-run }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            eng
          persist-credentials: false

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - name: Resolve mitigation trigger
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const { resolveMitigationTrigger } =
              await import('${{ github.workspace }}/.github/workflows/src/sdk-breaking-change/resolve-mitigation-inputs.ts');
            await resolveMitigationTrigger({
              github,
              context,
              core,
              analysisArtifactName: "sdk-breaking-change-results",
              analysisStatusArtifactName: "sdk-breaking-change-analysis-status",
              analysisStatusPath: "${{ runner.temp }}/sdk-breaking-change-analysis/run",
              mitigationStatusPath: "${{ runner.temp }}/sdk-breaking-change-mitigate/run",
              publishedResultsPath: '${{ runner.temp }}/published-analysis-results/sdk-breaking-change-analysis.json',
              workflowRunId: Number(process.env.WORKFLOW_RUN_ID),
            });
      - name: Upload mitigation status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-breaking-change-mitigate
          path: ${{ runner.temp }}/sdk-breaking-change-mitigate/run
          if-no-files-found: error
          retention-days: 7

  mitigate:
    needs: resolve-trigger
    if: needs.resolve-trigger.outputs.should-run == 'true'
    concurrency:
      group: sdk-breaking-mitigate-${{ github.event.workflow_run.id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    env:
      AZSDK_CLI_PATH: /tmp/bin
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repositories/workflow-repository
          persist-credentials: false

      - name: Install dependencies for github-script actions
        uses: ./repositories/workflow-repository/.github/actions/setup-node-install-deps
        with:
          working-directory: repositories/workflow-repository
          install-command: "pnpm install --frozen-lockfile --prod --prefer-offline --config.trust-lockfile=true --filter=azure-rest-api-specs-github..."
          cache: "false"

      - name: Install Azure SDK CLI
        shell: pwsh
        run: ./repositories/workflow-repository/eng/common/mcp/azure-sdk-mcp.ps1 -InstallDirectory $env:AZSDK_CLI_PATH

      - name: Download published analysis results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-breaking-change-results
          path: ${{ runner.temp }}/published-analysis-results
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Checkout specification PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve-trigger.outputs.head-repository }}
          ref: ${{ needs.resolve-trigger.outputs.head-sha }}
          path: repositories/azure-rest-api-specs
          persist-credentials: false

      - name: Set up Node.js and install specification repository dependencies
        uses: ./repositories/workflow-repository/.github/actions/setup-node-install-deps
        with:
          working-directory: repositories/azure-rest-api-specs
          cache: "false"

      - name: Set up GitHub Copilot CLI
        id: setup-copilot-cli
        shell: bash
        run: | # zizmor: ignore[adhoc-packages] Install the CLI into an isolated runner-temp prefix.
          set -euo pipefail
          install_dir="$RUNNER_TEMP/copilot-cli"
          npm_config_ignore_scripts=false npm install \
            --global \
            --prefix "$install_dir" \
            @github/copilot

          copilot_path="$install_dir/bin/copilot"
          test -x "$copilot_path"
          "$copilot_path" --version
          echo "path=$copilot_path" >> "$GITHUB_OUTPUT"

      - name: Mitigate SDK breaking changes
        id: mitigate-sdk-breaking-changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ANALYSIS_RESULT_PATH: ${{ runner.temp }}/published-analysis-results/sdk-breaking-change-analysis.json
          AZSDK_COPILOT_CLI_PATH: ${{ steps.setup-copilot-cli.outputs.path }}
          AZSDK_COPILOT_GITHUB_TOKEN: ${{ github.token }}
          SPEC_REPOSITORY_PATH: ${{ github.workspace }}/repositories/azure-rest-api-specs
          MITIGATION_RESULT_PATH: ${{ runner.temp }}/published-mitigation-results/sdk-breaking-change-mitigation.json
          MITIGATION_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { mitigateSdkBreakingChanges } =
              await import('${{ github.workspace }}/repositories/workflow-repository/.github/workflows/src/sdk-breaking-change/mitigate-sdk-breaking-changes.ts');
            await mitigateSdkBreakingChanges({
              analysisResultPath: process.env.ANALYSIS_RESULT_PATH,
              mitigationResultPath: process.env.MITIGATION_RESULT_PATH,
              mitigationWorkflowUrl: process.env.MITIGATION_WORKFLOW_URL,
              specificationRepositoryPath: process.env.SPEC_REPOSITORY_PATH,
              resultDirPath: process.env.RUNNER_TEMP,
              azureSdkCliPath: process.env.AZSDK_CLI_PATH,
            });

      - name: Get mitigation changed code
        id: get-changed-code
        shell: bash
        working-directory: repositories/azure-rest-api-specs
        env:
          MITIGATION_RESULT_PATH: ${{ runner.temp }}/published-mitigation-results/sdk-breaking-change-mitigation.json
        run: |
          set -euo pipefail
          git add --intent-to-add --all
          changed_code="$(git diff --no-ext-diff --no-color)"

          jq --arg customizationCode "$changed_code" \
            '.customizationCode = $customizationCode' \
            "$MITIGATION_RESULT_PATH" > "$MITIGATION_RESULT_PATH.tmp"
          mv "$MITIGATION_RESULT_PATH.tmp" "$MITIGATION_RESULT_PATH"

          delimiter="changed_code_${RANDOM}_${RANDOM}"
          {
            echo "changed-code<<$delimiter"
            printf '%s\n' "$changed_code"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Upload mitigation result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-breaking-change-mitigation-results
          path: ${{ runner.temp }}/published-mitigation-results/sdk-breaking-change-mitigation.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish mitigation summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.resolve-trigger.outputs.pr-number }}
          SDK_LANGUAGE: ${{ needs.resolve-trigger.outputs.sdk-language }}
          MITIGATION_COMMIT: ${{ needs.resolve-trigger.outputs.head-sha }}
          MITIGATION_CHANGED_CODE: ${{ steps.get-changed-code.outputs.changed-code }}
        with:
          script: |
            const { publishMitigationSummary } =
              await import('${{ github.workspace }}/repositories/workflow-repository/.github/workflows/src/sdk-breaking-change/publish-mitigation-summary.ts');
            await publishMitigationSummary({
              core,
              prNumber: process.env.PR_NUMBER,
              sdkLanguage: process.env.SDK_LANGUAGE,
              mitigationCommit: process.env.MITIGATION_COMMIT,
              changedCode: process.env.MITIGATION_CHANGED_CODE,
            });
