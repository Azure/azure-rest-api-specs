name: SDK Breaking Change Mitigation

on:
  workflow_run:
    workflows: ["SDK Breaking Change Analysis - Publish Results"]
    types: [completed]
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: "Completed SDK Breaking Change Analysis - Publish Results workflow run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  copilot-requests: write

jobs:
  resolve-trigger:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    outputs:
      head-branch: ${{ steps.resolve.outputs.head-branch }}
      head-repository: ${{ steps.resolve.outputs.head-repository }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      sdk-language: ${{ steps.resolve.outputs.sdk-language }}
      sdk-repository: ${{ steps.resolve.outputs.sdk-repository }}
      should-run: ${{ steps.resolve.outputs.should-run }}
    steps:
      - name: Download published analysis results
        uses: actions/download-artifact@v8
        with:
          name: sdk-breaking-change-results
          path: ${{ runner.temp }}/published-analysis-results
          github-token: ${{ github.token }}
          run-id: ${{ inputs.workflow_run_id || github.event.workflow_run.id }}

      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
          persist-credentials: false

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - name: Resolve mitigation trigger
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            const { resolveMitigationTrigger } =
              await import('${{ github.workspace }}/.github/workflows/src/sdk-breaking-change/resolve-mitigation-inputs.ts');
            await resolveMitigationTrigger({
              github,
              context,
              core,
              publishedResultsPath: '${{ runner.temp }}/published-analysis-results/sdk-breaking-change-analysis.json',
            });

  mitigate:
    needs: resolve-trigger
    if: needs.resolve-trigger.outputs.should-run == 'true'
    concurrency:
      group: >-
        sdk-breaking-mitigate-${{ inputs.workflow_run_id || github.event.workflow_run.id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      AZSDK_CLI_PATH: /tmp/bin
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          path: repositories/workflow-repository
          persist-credentials: false

      - name: Install Azure SDK CLI
        shell: pwsh
        run: ./repositories/workflow-repository/eng/common/mcp/azure-sdk-mcp.ps1 -InstallDirectory $env:AZSDK_CLI_PATH

      - name: Download published analysis results
        uses: actions/download-artifact@v8
        with:
          name: sdk-breaking-change-results
          path: ${{ runner.temp }}/published-analysis-results
          github-token: ${{ github.token }}
          run-id: ${{ inputs.workflow_run_id || github.event.workflow_run.id }}

      - name: Checkout specification PR source
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve-trigger.outputs.head-repository }}
          ref: ${{ needs.resolve-trigger.outputs.head-sha }}
          path: repositories/azure-rest-api-specs
          persist-credentials: false

      - name: Set up Node.js and install specification repository dependencies
        uses: ./repositories/workflow-repository/.github/actions/setup-node-install-deps
        with:
          working-directory: repositories/azure-rest-api-specs

      - name: Checkout target SDK repository
        uses: actions/checkout@v7
        with:
          repository: Azure/${{ needs.resolve-trigger.outputs.sdk-repository }}
          ref: main
          path: repositories/${{ needs.resolve-trigger.outputs.sdk-repository }}
          persist-credentials: false
      - name: Set up GitHub Copilot CLI
        id: setup-copilot-cli
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/copilot-cli"
          npm_config_ignore_scripts=false npm install \
            --global \
            --prefix "$install_dir" \
            @github/copilot
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          copilot_path="$install_dir/bin/copilot"
          test -x "$copilot_path"
          "$copilot_path" --version
          echo "path=$copilot_path" >> "$GITHUB_OUTPUT"

      - name: Mitigate SDK breaking changes
        id: mitigate-sdk-breaking-changes
        shell: bash
        env:
          ANALYSIS_RESULT_PATH: ${{ runner.temp }}/published-analysis-results/sdk-breaking-change-analysis.json
          AZSDK_COPILOT_CLI_PATH: ${{ steps.setup-copilot-cli.outputs.path }}
          AZSDK_COPILOT_GITHUB_TOKEN: ${{ github.token }}
          SDK_REPOSITORY_PATH: ${{ github.workspace }}/repositories/${{ needs.resolve-trigger.outputs.sdk-repository }}
          SPEC_REPOSITORY_PATH: ${{ github.workspace }}/repositories/azure-rest-api-specs
          MITIGATION_RESULT_PATH: ${{ runner.temp }}/published-mitigation-results/sdk-breaking-change-mitigation.json
          MITIGATION_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mitigation_log="$RUNNER_TEMP/sdk-breaking-change-mitigation.log"
          exec > >(tee "$mitigation_log") 2>&1
          echo "$AZSDK_CLI_PATH" >> "$GITHUB_PATH"
          export PATH="$AZSDK_CLI_PATH:$PATH"

          test -f "$ANALYSIS_RESULT_PATH"
          mkdir -p "$(dirname "$MITIGATION_RESULT_PATH")"
          jq --arg mitigationWorkflowUrl "$MITIGATION_WORKFLOW_URL" '{
            schemaVersion: 1,
            prNumber,
            headSha,
            sdkLanguage,
            mitigationWorkflowUrl: $mitigationWorkflowUrl,
            status: "success",
            customizationCode: "",
            projects: [.projects[] | {
              typespecProject,
              sdkPackage,
              breakingChanges: []
            }]
          }' "$ANALYSIS_RESULT_PATH" > "$MITIGATION_RESULT_PATH"

          while IFS= read -r project; do
            project_index="$(jq -r '.key' <<< "$project")"
            project_data="$(jq -c '.value' <<< "$project")"
            typespec_project_path="$(jq -r '.typespecProject' <<< "$project_data")"
            package_name="$(jq -r '.sdkPackage' <<< "$project_data")"
            breaking_change_count="$(jq '.breakingChanges | length' <<< "$project_data")"
            if [[ "$breaking_change_count" -eq 0 ]]; then
              echo "No SDK breaking changes found for $typespec_project_path."
              continue
            fi

            tsp_project_path="$(realpath "$SPEC_REPOSITORY_PATH/$typespec_project_path")"
            if [[ ! -d "$tsp_project_path" || "$tsp_project_path" != "$SPEC_REPOSITORY_PATH"/specification/* ]]; then
              echo "Invalid TypeSpec project path: $typespec_project_path" >&2
              exit 1
            fi

            package_paths=()
            while IFS= read -r -d '' tsp_location_path; do
              candidate_package_path="$(dirname "$tsp_location_path")"
              if [[ "$(basename "$candidate_package_path")" == "$package_name" ]]; then
                package_paths+=("$(realpath "$candidate_package_path")")
              fi
            done < <(find "$SDK_REPOSITORY_PATH" -type f -name tsp-location.yaml -print0)
            if [[ ${#package_paths[@]} -ne 1 ]]; then
              echo "Expected exactly one SDK package named $package_name, found ${#package_paths[@]}." >&2
              printf '  %s\n' "${package_paths[@]}" >&2
              exit 1
            fi
            package_path="${package_paths[0]}"

            breaking_change_number=0
            while IFS= read -r breaking_change; do
              mitigation_result="$RUNNER_TEMP/sdk-mitigation-result-$breaking_change_number.json"
              breaking_change_number="$((breaking_change_number + 1))"
              echo "Mitigating SDK breaking change $breaking_change_number of $breaking_change_count for $typespec_project_path."
              customization_request="Resolve this SDK breaking change: $breaking_change"
              mitigation_succeeded=true
              if ! azsdk typespec client customized-update \
                  --tsp-project-path "$tsp_project_path" \
                  --package-path "$package_path" \
                  --customization-request "$customization_request" \
                  --edit-scope 2 \
                  --output json | tee "$mitigation_result"; then
                mitigation_succeeded=false
              fi

              if [[ "$mitigation_succeeded" == "true" ]] && jq -e . "$mitigation_result" > /dev/null; then
                clean_result="$(
                  jq -c \
                    --argjson breakingChange "$breaking_change" \
                    '(.result // .) as $result |
                    ($result.success // false) as $isResolved | {
                      breakingChange: ($breakingChange.breakingChange // $breakingChange),
                      suggestedFix: ($breakingChange.suggestedFix // ""),
                      isResolved: $isResolved
                    } + if $result.typeSpecChangesSummary != null then
                      {typespecChangesSummary: $result.typeSpecChangesSummary}
                    else {}
                    end' \
                    "$mitigation_result"
                )"
              else
                clean_result="$(
                  jq -cn \
                    --argjson breakingChange "$breaking_change" \
                    '{
                      breakingChange: ($breakingChange.breakingChange // $breakingChange),
                      suggestedFix: ($breakingChange.suggestedFix // ""),
                      isResolved: false
                    }'
                )"
              fi
              jq \
                --argjson projectIndex "$project_index" \
                --argjson result "$clean_result" \
                '.projects[$projectIndex].breakingChanges += [$result]' \
                "$MITIGATION_RESULT_PATH" > "$MITIGATION_RESULT_PATH.tmp"
              mv "$MITIGATION_RESULT_PATH.tmp" "$MITIGATION_RESULT_PATH"
              if [[ "$mitigation_succeeded" != "true" ]]; then
                exit 1
              fi
            done < <(
              jq -c '.breakingChanges[] | {
                breakingChange,
                category,
                suggestedFix
              }' <<< "$project_data"
            )
          done < <(jq -c '.projects | to_entries[]' "$ANALYSIS_RESULT_PATH")

      - name: Get mitigation changed code
        id: get-changed-code
        shell: bash
        working-directory: repositories/azure-rest-api-specs
        env:
          MITIGATION_RESULT_PATH: ${{ runner.temp }}/published-mitigation-results/sdk-breaking-change-mitigation.json
        run: |
          set -euo pipefail
          git add --intent-to-add --all
          changed_code="$(git diff --no-ext-diff --no-color)"
          max_snippet_length=12000
          if [[ ${#changed_code} -gt $max_snippet_length ]]; then
            changed_code="${changed_code:0:$max_snippet_length}"$'\n... diff truncated.'
          fi
          jq --arg customizationCode "$changed_code" \
            '.customizationCode = $customizationCode' \
            "$MITIGATION_RESULT_PATH" > "$MITIGATION_RESULT_PATH.tmp"
          mv "$MITIGATION_RESULT_PATH.tmp" "$MITIGATION_RESULT_PATH"
          delimiter="changed_code_${RANDOM}_${RANDOM}"
          {
            echo "changed-code<<$delimiter"
            printf '%s\n' "$changed_code"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Upload mitigation result
        uses: actions/upload-artifact@v7
        with:
          name: sdk-breaking-change-mitigation-results
          path: ${{ runner.temp }}/published-mitigation-results/sdk-breaking-change-mitigation.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish mitigation summary
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve-trigger.outputs.pr-number }}
          SDK_LANGUAGE: ${{ needs.resolve-trigger.outputs.sdk-language }}
          MITIGATION_COMMIT: ${{ needs.resolve-trigger.outputs.head-sha }}
          MITIGATION_CHANGED_CODE: ${{ steps.get-changed-code.outputs.changed-code }}
        run: |
          {
            echo "## SDK breaking-change mitigation"
            echo
            printf '%s\n\n' "**Pull request:** #$PR_NUMBER"
            printf '%s\n\n' "**SDK language:** $SDK_LANGUAGE"
            printf '%s\n\n' "**Mitigation upon commit:** \`$MITIGATION_COMMIT\`"
            echo "## Customization Code"
            echo
            if [[ -n "$MITIGATION_CHANGED_CODE" ]]; then
              echo '````diff'
              printf '%s\n' "$MITIGATION_CHANGED_CODE"
              echo '````'
            else
              echo "No mitigation changes were produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
