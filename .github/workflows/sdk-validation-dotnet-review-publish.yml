name: Publish Generated .NET SDK Review

on: # zizmor: ignore[dangerous-triggers] Only default-branch workflow code runs and artifacts are revalidated before publication.
  workflow_run:
    workflows: ["Generated .NET SDK Review and TypeSpec Remediation (Report-Only)"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  resolve:
    if: >-
      github.repository == 'Azure/azure-rest-api-specs' &&
      github.event.workflow_run.repository.id == github.repository_id &&
      !github.event.workflow_run.repository.fork &&
      github.event.workflow_run.path == '.github/workflows/sdk-validation-dotnet-review.lock.yml' &&
      github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-name: ${{ steps.find-context.outputs.artifact-name }}
      pr-number: ${{ steps.resolve-context.outputs.pr-number }}
      should-publish: ${{ steps.resolve-context.outputs.should-publish || 'false' }}
    steps:
      - name: Find trusted publication context
        id: find-context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100,
            });
            const artifacts = response.data.artifacts.filter(
              (artifact) =>
                !artifact.expired &&
                artifact.name.startsWith("sdk-review-publication-context-"),
            );
            if (artifacts.length > 1) {
              throw new Error(`Expected at most one publication context, found ${artifacts.length}`);
            }
            core.setOutput("artifact-name", artifacts[0]?.name ?? "");

      - name: Checkout trusted publisher
        if: steps.find-context.outputs.artifact-name != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            eng
          persist-credentials: false

      - name: Install dependencies for github-script actions
        if: steps.find-context.outputs.artifact-name != ''
        uses: ./.github/actions/install-deps-github-script

      - name: Download trusted publication context
        if: steps.find-context.outputs.artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.find-context.outputs.artifact-name }}
          path: ${{ runner.temp }}/sdk-review-publication-context
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve publication identity
        if: steps.find-context.outputs.artifact-name != ''
        id: resolve-context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PUBLICATION_CONTEXT_PATH: ${{ runner.temp }}/sdk-review-publication-context/typespec-review-context.json
        with:
          script: |
            const { readSdkReviewPublicationContext } = await import(
              '${{ github.workspace }}/.github/workflows/src/sdk-validation-dotnet-review-publisher.ts'
            );
            const publicationContext = await readSdkReviewPublicationContext(
              process.env.PUBLICATION_CONTEXT_PATH,
            );
            core.setOutput("pr-number", publicationContext.source.specPrNumber);
            core.setOutput("should-publish", "true");

  publish:
    needs: resolve
    if: needs.resolve.outputs.should-publish == 'true'
    concurrency:
      group: publish-generated-dotnet-sdk-review-${{ needs.resolve.outputs.pr-number }}
      cancel-in-progress: false
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            eng
          persist-credentials: false

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - name: Download trusted publication context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.resolve.outputs.artifact-name }}
          path: ${{ runner.temp }}/sdk-review-publication-context
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download validated SDK review results
        if: github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sdk-review-result-workflow-*
          path: ${{ runner.temp }}/sdk-review-results
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish generated SDK review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PUBLICATION_CONTEXT_PATH: ${{ runner.temp }}/sdk-review-publication-context/typespec-review-context.json
          RESULT_ROOT_PATH: ${{ runner.temp }}/sdk-review-results
          REVIEW_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REVIEW_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { publishSdkReviewResult } = await import(
              '${{ github.workspace }}/.github/workflows/src/sdk-validation-dotnet-review-publisher.ts'
            );
            await publishSdkReviewResult({
              githubScript: { github, context, core },
              publicationContextPath: process.env.PUBLICATION_CONTEXT_PATH,
              resultRootPath: process.env.RESULT_ROOT_PATH,
              workflowConclusion: process.env.REVIEW_WORKFLOW_CONCLUSION,
              workflowRunUrl: process.env.REVIEW_WORKFLOW_URL,
            });
