name: SDK Breaking Change Labels

on:
  check_run:
    types: [created, completed, rerequested]

permissions:
  contents: read
  pull-requests: read
  checks: read

env:
  SDK_METADATA_PUBLISHER_APP_ID: ${{ vars.SDK_METADATA_PUBLISHER_APP_ID }}

jobs:
  sdk-breaking-change-labels:
    # Only run this job when the check run is 'SDK Validation *'
    if: |
      (github.event.check_run.check_suite.app.name == 'Azure Pipelines' &&
      contains(github.event.check_run.name, 'SDK Validation') &&
      (github.event.action == 'completed' || github.repository == 'Azure/azure-rest-api-specs-pr')) ||
      (github.repository == 'Azure/azure-rest-api-specs-pr' &&
      startsWith(github.event.check_run.name, 'SDK metadata / '))
    name: SDK Breaking Change Labels
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github

      - name: Install dependencies for github-script actions
        uses: ./.github/actions/install-deps-github-script

      - name: Get label and action
        id: get-label-and-action
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { getLabelAndAction } =
              await import('${{ github.workspace }}/.github/workflows/src/sdk-breaking-change-labels.ts');
            return await getLabelAndAction({ github, context, core });

      - if: |
          (fromJson(steps.get-label-and-action.outputs.result).labelAction == 'add' ||
          fromJson(steps.get-label-and-action.outputs.result).labelAction == 'remove')
        name: Upload artifact with results
        uses: ./.github/actions/add-label-artifact
        with:
          name: "${{ fromJson(steps.get-label-and-action.outputs.result).labelName}}"
          # Convert "add/remove" to "true/false"
          value: "${{ fromJson(steps.get-label-and-action.outputs.result).labelAction == 'add' }}"

      - if: ${{ always() && steps.get-label-and-action.outputs.head_sha }}
        name: Upload artifact with head SHA
        uses: ./.github/actions/add-empty-artifact
        with:
          name: "head-sha"
          value: "${{ steps.get-label-and-action.outputs.head_sha }}"

      - if: ${{ always() && steps.get-label-and-action.outputs.issue_number > 0 }}
        name: Upload artifact with issue number
        uses: ./.github/actions/add-empty-artifact
        with:
          name: "issue-number"
          value: "${{ steps.get-label-and-action.outputs.issue_number }}"
