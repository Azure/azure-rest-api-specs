name: "Package Name Approval - Set Status"

on:
  workflow_run:
    workflows: ["Package Name Approval - Analyze Code"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

jobs:
  post-results:
    name: Post Package Name Results
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/

      - name: Install workflow dependencies
        uses: ./.github/actions/install-workflow-deps

      - name: Post package name review comment
        run: node "${{ github.workspace }}/.github/workflows/cmd/package-name-post-results.ts"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Set package name approval status
        run: node "${{ github.workspace }}/.github/workflows/cmd/package-name-status-check.ts"
        env:
          GITHUB_TOKEN: ${{ github.token }}
