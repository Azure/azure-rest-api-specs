name: "Package Name Approval - Set Status"

on: # zizmor: ignore[dangerous-triggers] Fork PR updates require this; only base/default-branch code runs.
  workflow_run:
    workflows: ["Package Name Approval - Analyze Code"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

jobs:
  post-results:
    name: Post Package Name Results
    if: github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: $/.github/actions/checkout
        with:
          sparse-checkout: |
            .github/

      - name: Install dependencies for github-script actions
        uses: $/.github/actions/install-deps-github-script

      - name: Post package name review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: postResults } =
              await import('${{ github.workspace }}/.github/workflows/src/package-name-approval/post-results.ts');
            await postResults({ github, context, core });

      - name: Set package name approval status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: statusCheck } =
              await import('${{ github.workspace }}/.github/workflows/src/package-name-approval/status-check.ts');
            await statusCheck({ github, context, core });
