name: "Summarize PR Impact"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  pull-requests: read

jobs:
  impact:
    name: "Summarize PR Impact"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout 'after' state
        uses: $/.github/actions/checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: after

      - name: Find PR merge base
        id: merge-base
        working-directory: after
        shell: bash
        run: |
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          echo "sha=$merge_base" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Checkout 'before' state
        uses: $/.github/actions/checkout
        with:
          ref: ${{ steps.merge-base.outputs.sha }}
          path: before

      - name: Setup Node and install deps
        # Use the PR head checkout, not the workflow's PR merge commit.
        uses: ./after/.github/actions/setup-node-install-deps # zizmor: ignore[self-repository]
        with:
          # The repository is checked out into "after/", so that is the workspace
          # root (and where the root package.json with "packageManager" lives).
          working-directory: after

      - name: Run Summarize Impact
        id: summarize-impact
        working-directory: after
        run: |
          pnpm exec summarize-impact --sourceDirectory . --targetDirectory ../before \
            --number "${{ github.event.pull_request.number }}" \
            --sourceBranch "$HEAD_REF" \
            --targetBranch "$BASE_REF" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --repo "$REPOSITORY_NAME" \
            --owner "${{ github.repository_owner }}" \
            ${{ github.event.pull_request.draft && '--isDraft' || '' }}
        env:
          # We absolutely need to avoid OOM errors due to certain inherited types from openapi-alps
          NODE_OPTIONS: "--max-old-space-size=8192"
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload impact summary JSON
        if: ${{ always() && steps.summarize-impact.outputs.summary }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.summarize-impact.outputs.summary }}
          archive: false
          if-no-files-found: ignore

      # Keep older consumers working during the one-month migration.
      # Remove with https://github.com/Azure/azure-rest-api-specs/issues/46973.
      - name: Set job-summary artifact
        if: ${{ always() && steps.summarize-impact.outputs.summary }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: job-summary
          path: ${{ steps.summarize-impact.outputs.summary }}
          # If the file doesn't exist, just don't add the artifact
          if-no-files-found: ignore
