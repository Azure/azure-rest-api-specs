name: Spec PR Validation

on:
  pull_request:
    types:
      # default
      - opened
      - synchronize
      - reopened
      # re-run if base branch is changed, since previous merge commit may generate incorrect diff
      - edited

permissions:
  contents: read

jobs:
  spec-pr-validation:
    name: Spec PR Validation

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Compare the synthetic merge commit with its target-branch parent.
          fetch-depth: 2

      - name: Setup Node and install deps
        uses: ./.github/actions/setup-node-install-deps

      - run: >-
          node eng/tools/spec-pr-validation/cmd/spec-pr-validation.js --base=HEAD^ --head=HEAD
          ${{ runner.debug == '1' && '--verbose' || '' }}
        id: validation

      # Always add label artifact, even if "brownfield=false", to ensure label is removed when necessary
      - uses: ./.github/actions/add-label-artifact
        if: ${{ always() && steps.validation.outputs.brownfield != '' }}
        name: Upload artifact with results
        with:
          name: "brownfield"
          value: "${{ steps.validation.outputs.brownfield == 'true' }}"
