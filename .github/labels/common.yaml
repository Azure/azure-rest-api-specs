# Edit through a pull request. See eng/README.md#repository-labels.
labels:
  - name: "APIChange"
    color: "d8f74c"
    description: "This PR contains an addition or change to the API signature and must be reviewed by an architect."
  - name: "architecture-review-added"
    color: "0e8a16"
    description: "Architecture review completed"
  - name: "architecture-review-in-progress"
    color: "fbca04"
    description: "Architecture review is in progress"
  - name: "architecture-review-needed"
    color: "1d76db"
    description: "Triggers Archie: AI architecture review agent"
  - name: "auto-close-exempt"
    color: "ededed"
    description: "Prevents the auto-close from closing based on max lifetime"
  - name: "auto-release"
    color: "1d76db"
    description: "When merged to main, release pipelines for this PR's changed packages trigger automatically."
  - name: "blocking-release"
    color: "d73a49"
    description: "Blocks release"
  - name: "breaking-change"
    color: "d73a49"
    description: ""
  - name: "bug"
    color: "eaa875"
    description: "This issue requires a change to an existing behavior in the product in order to be resolved."
  - name: "Central-EngSys"
    color: "ffeb77"
    description: "This issue is owned by the Engineering System team."
  - name: "Client"
    color: "ffeb77"
    description: "This issue points to a problem in the data-plane of the library."
  - name: "Community Contribution"
    color: "1aa874"
    description: "Community members are working on the issue"
  - name: "customer-reported"
    color: "3800e0"
    description: "Issues that are reported by GitHub users external to the Azure organization."
  - name: "design-discussion"
    color: "0BABDF"
    description: "An area of design currently under discussion and open to team and community feedback."
  - name: "duplicate"
    color: "e4c288"
    description: "This issue is the duplicate of another issue"
  - name: "Epic"
    color: "3E4B9E"
    description: ""
  - name: "feature-request"
    color: "eaa875"
    description: "This issue requires a new behavior in the product in order be resolved."
  - name: "good first issue"
    color: "64c170"
    description: "This issue tracks work that may be a good starting point for a first-time contributor"
  - name: "help wanted"
    color: "64c170"
    description: "This issue is tracking work for which community contributions would be welcomed and appreciated"
  - name: "issue-addressed"
    color: "5df772"
    description: "Workflow: The Azure SDK team believes it to be addressed and ready to close."
  - name: "late-blocker"
    color: "d8f74c"
    description: "Changes based on review feedback before imminent release."
  - name: "Mgmt"
    color: "ffeb77"
    description: "This issue is related to a management-plane library."
  - name: "MQ"
    color: "7365c9"
    description: 'This issue is part of a "milestone of quality" initiative.'
  - name: "needs-author-feedback"
    color: "f72598"
    description: "Workflow: More information is needed from author to address the issue."
  - name: "needs-team-attention"
    color: "3BA0F8"
    description: "Workflow: This issue needs attention from Azure service team or SDK team"
  - name: "needs-team-triage"
    color: "ededed"
    description: "Workflow: This issue needs the team to triage."
  - name: "needs-triage"
    color: "ededed"
    description: "Workflow: This is a new issue that needs to be triaged to the appropriate team."
  - name: "no-recent-activity"
    color: "bbbbbb"
    description: "There has been no recent activity on this issue."
  - name: "pillar-acquisition"
    color: "65a5c9"
    description: "This issue is related to the ability to acquire new customers, one of our core engineering pillars."
  - name: "pillar-compatibility"
    color: "65a5c9"
    description: "This issue is related to compatibility between versions, one of our core engineering pillars."
  - name: "pillar-performance"
    color: "65a5c9"
    description: "The issue is related to performance, one of our core engineering pillars."
  - name: "pillar-reliability"
    color: "65a5c9"
    description: "The issue is related to reliability, one of our core engineering pillars. (includes stress testing)"
  - name: "Provisioning"
    color: "ffeb77"
    description: ""
  - name: "question"
    color: "eaa875"
    description: "The issue doesn't require a change to the product in order to be resolved. Most issues start as that"
  - name: "Service"
    color: "ffeb77"
    description: "This issue points to a problem in the service."
  - name: "Service Attention"
    color: "10066b"
    description: "Workflow: This issue is responsible by Azure service team."
  - name: "Stress"
    color: "65a5c9"
    description: "This issue is related to stress testing, part of our reliability pillar."
  - name: "test-enhancement"
    color: "7365c9"
    description: ""
  - name: "test-manual-pass"
    color: "c0eaf9"
    description: ""
  - name: "test-reliability"
    color: "e04545"
    description: "Issue that causes tests to be unreliable"
  - name: "ttl"
    color: "bbbbbb"
    description: "PR targets a branch where open PRs are automatically closed a fixed number of days after creation."
