self-hosted-runner:
  labels:
    - 1ES.Pool=azsdk-pool-github-runners
    - azsdk-pool-github-test
    - azsdk-pool-github-test-pr

paths:
  .github/workflows/*.lock.yml:
    ignore:
      - ".+"

  .github/workflows/sdk-breaking-change-analysis.yaml:
    ignore:
      # actionlint 1.7.12 predates GitHub's copilot-requests permission scope.
      - 'unknown permission scope "copilot-requests"'

  # Also generated by gh-aw
  # cspell:ignore agentics
  .github/workflows/agentics-maintenance.yml:
    ignore:
      - ".+"
