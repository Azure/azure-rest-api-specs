self-hosted-runner:
  labels:
    - 1ES.Pool=azsdk-pool-github-runners
    - azsdk-pool-github-test
    - azsdk-pool-github-test-pr

paths:
  # Temporary compatibility for https://github.com/rhysd/actionlint/pull/732.
  # Only suppress unsupported syntax for the known self-repository targets.
  .github/workflows/*.{yaml,yml}:
    ignore:
      - '^specifying action "\$/\.github/actions/(add-empty-artifact|add-label-artifact|checkout|install-deps-github-script|setup-node-install-deps)" in invalid format because ref is missing\.'
      - '^reusable workflow call "\$/\.github/workflows/_reusable-set-check-status\.yaml" at "uses" is not following the format '

  .github/workflows/*.lock.yml:
    ignore:
      - ".+"

  # Also generated by gh-aw
  # cspell:ignore agentics
  .github/workflows/agentics-maintenance.yml:
    ignore:
      - ".+"
