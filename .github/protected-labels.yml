# Protected Labels Configuration
# This file defines which labels can only be applied by authorized users.
# If an unauthorized user applies a protected label, the bot removes it.
#
# The problem: service teams self-applying "Approved" labels to bypass architect review.
# This workflow ensures only authorized reviewers can sign off via labels.
#
# Format:
#   global-approvers: users who can apply ANY protected label
#   LabelName: users who can apply THIS specific label (in addition to global)
#
# To update: submit a PR modifying this file.

# Global approvers can apply any protected label.
global-approvers:
  - lmazuel
  - samvaity
  - praveenkuttappan
  - catalinaperalta
  - timotheeguerin
  - xirzec

# Data-plane REST stewardship reviewers. The Automation App resolves the live
# `azure-data-plane-api-reviewers` roster with its Organization Members read permission.
data-plane-review-signoff: &data-plane-reviewers
  team: azure-data-plane-api-reviewers

# TypeSpec lint-suppression approval (data-plane stewardship review).
# `typespec-suppressions-approved` clears the suppression review on a data-plane spec PR.
# Only the data-plane stewardship reviewers may apply it, mirroring the azure-data-plane-api-reviewers
# team (same pool as `data-plane-review-signoff`); the alias keeps the two rosters in sync.
# Management-plane is left `unprotected`: ARM runs its own suppression review process, and
# this preserves today's behavior (the label was previously unprotected on all planes).
# See the stewardship board member guide (aka.ms/azsdk/architect-guidance).
typespec-suppressions-approved:
  data-plane: *data-plane-reviewers
  management-plane: unprotected

