# Protected Labels Configuration
# This file defines which labels can only be applied by authorized users.
# If an unauthorized user applies a protected label, the bot removes it.
#
# The problem: service teams self-applying "Approved" labels to bypass architect review.
# This workflow ensures only authorized reviewers can sign off via labels.
#
# Format:
#   global-approvers: users who can apply ANY protected label
#   LabelName: users who can apply THIS specific label (in addition to global)
#
# To update: submit a PR modifying this file.

# Global approvers can apply any protected label.
global-approvers:
  - lmazuel
  - samvaity
  - praveenkuttappan

# Data-plane REST stewardship reviewers. Gated here as the only users who may apply the
# sign-off label — the approval that clears the merge gate (protected-labels exists to stop
# teams self-signing-off). This same list is the pool auto-requested/assigned when the
# intake workflow applies `APIStewardshipBoard-ReviewRequested` (that label is a
# machine-applied signal, not a human-gated action, so it is intentionally not protected;
# see .github/workflows/src/data-plane-review/assign-reviewers.js). Add a login to grow it.
APIStewardshipBoard-SignedOff:
  - heaths
  - weidongxu-microsoft

