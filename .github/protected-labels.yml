# SDK breaking-change board approval labels.
# These labels clear the per-language SDK breaking-change merge gates (rulesPri2Sdk in
# .github/workflows/src/summarize-checks/labelling.ts). Only authorized reviewers may apply
# them; if anyone else does, the bot removes the label.
#
# The Automation App resolves the live `azure-sdk-team` roster. Explicit users
# preserve access for current approvers who are not members of that team.
#
# Only the labels that currently exist in the repo are listed. The Java and Python-Track2
# approval labels (BreakingChange-Java-Sdk-Approved, BreakingChange-Java-Sdk-Suppression-Approved,
# BreakingChange-Python-Track2-Sdk-Approved) are defined in labelling.ts but not yet created
