rules:
  self-repository:
    # $/ actions stage the entire specs repository; local actions reuse the checkout.
    # https://github.com/actions/runner/issues/4631
    disable: true
  ref-version-mismatch:
    ignore:
      # Generated by gh aw compile; its action pins and version comments belong to the compiler.
      # Keep this audit enabled for handwritten workflows.
      - agentics-maintenance.yml
