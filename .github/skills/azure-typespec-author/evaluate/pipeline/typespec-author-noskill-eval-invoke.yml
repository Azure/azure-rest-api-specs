parameters:
  - name: vallyRoot
    type: string
  - name: UseAzSdkAuthentication
    type: boolean
    default: false
  # Required by the common eval-shard template; TypeSpec uses pass@k instead.
  - name: threshold
    type: number
    default: 0.8
  - name: azureSubscription
    type: string
    default: azuresdkqabot-dev

steps:
  - script: |
      set -e
      mkdir -p /tmp/no-skills
      rm -rf /tmp/no-skills/*
    displayName: "Prepare empty no-skill directory"

  - ${{ if parameters.UseAzSdkAuthentication }}:
      - task: AzureCLI@2
        displayName: "vally eval $(shardName) (authenticated)"
        inputs:
          azureSubscription: ${{ parameters.azureSubscription }}
          scriptType: bash
          scriptLocation: inlineScript
          workingDirectory: ${{ parameters.vallyRoot }}
          inlineScript: |
            node --experimental-strip-types "$(Build.SourcesDirectory)/.github/skills/azure-typespec-author/evaluate/pipeline/typespec-author-invoke-shard.ts" \
              --eval-args "$(evalArgs)" \
              --shard-name "$(shardName)" \
              --output-dir "$(Build.SourcesDirectory)/artifacts/vally-results/$(shardName)" \
              --extra-args "$(TypeSpecAuthorEvalExtraArgs)" \
              --runs $(TypeSpecAuthorEvalRuns)
        env:
          GITHUB_TOKEN: $(azuresdk-copilot-github-pat)
          AZSDK_EVAL_MCP_KIND: $(AZSDK_EVAL_MCP_KIND)

  - ${{ else }}:
      - script: |
          node --experimental-strip-types "$(Build.SourcesDirectory)/.github/skills/azure-typespec-author/evaluate/pipeline/typespec-author-invoke-shard.ts" \
            --eval-args "$(evalArgs)" \
            --shard-name "$(shardName)" \
            --output-dir "$(Build.SourcesDirectory)/artifacts/vally-results/$(shardName)" \
            --extra-args "$(TypeSpecAuthorEvalExtraArgs)" \
            --runs $(TypeSpecAuthorEvalRuns)
        displayName: "vally eval $(shardName)"
        workingDirectory: ${{ parameters.vallyRoot }}
        env:
          GITHUB_TOKEN: $(azuresdk-copilot-github-pat)
          AZSDK_EVAL_MCP_KIND: $(AZSDK_EVAL_MCP_KIND)
