name: azure-typespec-author-eval
description: Authoring boundaries with shared naming available
version: "1.0"
type: capability
area: naming
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 120s
  model: gpt-5.6-sol
  executor: copilot-sdk
scoring:
  threshold: 1
stimuli:
  - name: 007013-anti-trigger-readonly-typespec-assessment-trigger
    prompt: |
      Assess the TypeSpec diff for specification/widget against origin/main for REST breaking
      changes. For now, identify and invoke the applicable skill; do not run the assessment or
      modify TypeSpec.
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-assessment
          disallowed:
            - azure-typespec-author
    tags:
      suite: naming
      mode: trigger
