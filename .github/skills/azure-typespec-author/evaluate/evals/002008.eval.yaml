name: azure-typespec-author-eval
description: Evaluation suite for azure-typespec-author.
version: "1.0"
type: capability # capability | regression
area: "armtemplate"
# Root-level environment
environment: azsdk-mcp
# Execution configuration
defaults:
  runs: 1 # Trials per stimulus
  timeout: "660s" # Seconds per trial
  model: gpt-5.6-sol # Model for agent execution
  executor: copilot-sdk # Which executor to use

# Test cases
stimuli:
  - name: 002008-ARM-add-parameters-trigger
    tags:
      suite: "armtemplate"
      mode: "trigger"
    prompt: |
      add top and skip query parameters to the ListBySubscription operation in interface Employees. Ensure the definition meets TypeSpec Azure guidelines.
    environment: &shared_environment
      files:
        - src: ../fixtures/Microsoft.Widget/Widget/employee.tsp
          dest: employee.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/main.tsp
          dest: main.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../scripts/check-node-dependencies.js
          dest: check-node-dependencies.js
        - src: ../scripts/verify-emitted-contract.js
          dest: verify-emitted-contract.js
        - src: ../fixtures/Microsoft.Widget/Widget/readme.md
          dest: readme.md
        - src: ../fixtures/Microsoft.Widget/Widget/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
        - src: ../fixtures/Microsoft.Widget/Widget/preview/2024-10-01-preview/widget.json
          dest: preview/2024-10-01-preview/widget.json
        - src: ../fixtures/Microsoft.Widget/Widget/stable/2021-11-01/widget.json
          dest: stable/2021-11-01/widget.json
      commands:
        - 'node -e "const fs=require(''fs'');const t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync(''node_modules'')){fs.symlinkSync(t,''node_modules'',''junction'')}"'
    graders:
      - type: "skill-invocation"
        config:
          required:
            - "azure-typespec-author"
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 002008-ARM-add-parameters-forced
    tags:
      suite: "armtemplate"
      mode: "forced"
    prompt: |
      @azure-typespec-author add top and skip query parameters to the ListBySubscription operation in interface Employees. Ensure the definition meets TypeSpec Azure guidelines.
    environment: *shared_environment
    graders:
      - type: "run-command"
        config:
          command: "node check-node-dependencies.js node_modules"
          expected_exit_code: 0
      - type: "run-command"
        config:
          command: "node check-node-dependencies.js packages"
          expected_exit_code: 0
      - type: "run-command"
        config:
          command: "tsp compile ."
          expected_exit_code: 0
      - &run_contract
        type: "run-command"
        name: "run-command-list-contract"
        config:
          command: "node verify-emitted-contract.js arm-list-top-skip"
          expected_exit_code: 0
      - &file_not_matches
        type: "file-not-matches"
        config:
          pattern: '@query\("\$top"\)|@query\("\$skip"\)'
          path: "*.tsp"
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 002008-ARM-add-parameters-no-skill
    tags:
      suite: "armtemplate"
      mode: "no-skill"
    prompt: "add top and skip query parameters to the ListBySubscription operation in interface Employees. Ensure the definition meets TypeSpec Azure guidelines."
    environment: *shared_environment
    graders:
      - type: "tool-calls"
        config:
          required:
            - "^(edit|apply_patch|bash|powershell)$"
      - type: "run-command"
        config:
          command: "tsp compile ."
          expected_exit_code: 0
      - *run_contract
      - *file_not_matches
    constraints:
      max_turns: 6
      max_tokens: 100000

scoring:
  weights:
    tool-calls: 0.2
    run-command: 0.4
    skill-invocation: 0.2
    file-not-matches: 0.2
  threshold: 1
