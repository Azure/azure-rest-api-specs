name: azure-typespec-author-eval
description: Evaluation suite for azure-typespec-author.
version: "1.0"
type: capability # capability | regression
area: "armtemplate"
# Root-level environment
environment: azsdk-mcp
# Execution configuration
defaults:
  runs: 1 # Trials per stimulus
  timeout: "660s" # Seconds per trial
  model: gpt-5.6-sol # Model for agent execution
  executor: copilot-sdk # Which executor to use

# Test cases
stimuli:
  - name: 002006-ARM-define-child-resource-trigger
    tags:
      suite: "armtemplate"
      mode: "trigger"
    prompt: |
      In API version `2024-10-01-preview`, add a child resource named `AddressResource` under the existing Employee ARM resource. Its optional properties are street1, street2, city, state, postalCode, and country, along with a read-only provisioning state. Support the standard operations for a child ARM resource. Follow TypeSpec Azure guidelines. I've already made the design decisions, so go ahead with the change.
    environment: &shared_environment
      files:
        - src: ../fixtures/Microsoft.Widget/Widget/employee.tsp
          dest: employee.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/main.tsp
          dest: main.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../scripts/check-node-dependencies.js
          dest: check-node-dependencies.js
        - src: ../fixtures/Microsoft.Widget/Widget/readme.md
          dest: readme.md
        - src: ../fixtures/Microsoft.Widget/Widget/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
        - src: ../fixtures/Microsoft.Widget/Widget/preview/2024-10-01-preview/widget.json
          dest: preview/2024-10-01-preview/widget.json
        - src: ../fixtures/Microsoft.Widget/Widget/stable/2021-11-01/widget.json
          dest: stable/2021-11-01/widget.json
      commands:
        - 'node -e "const fs=require(''fs'');const t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync(''node_modules'')){fs.symlinkSync(t,''node_modules'',''junction'')}"'
    graders:
      - type: "skill-invocation"
        config:
          required:
            - "azure-typespec-author"
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 002006-ARM-define-child-resource-forced
    tags:
      suite: "armtemplate"
      mode: "forced"
    prompt: |
      @azure-typespec-author In API version `2024-10-01-preview`, add a child resource named `AddressResource` under the existing Employee ARM resource. Its optional properties are street1, street2, city, state, postalCode, and country, along with a read-only provisioning state. Support the standard operations for a child ARM resource. Follow TypeSpec Azure guidelines. I've already made the design decisions, so go ahead with the change.
    environment: *shared_environment
    graders:
      - type: "run-command"
        config:
          command: "node check-node-dependencies.js node_modules"
          expected_exit_code: 0
      - type: "run-command"
        config:
          command: "node check-node-dependencies.js packages"
          expected_exit_code: 0
      - type: "run-command"
        config:
          command: "tsp compile ."
          expected_exit_code: 0
      - &file_matches
        type: "file-matches"
        config:
          pattern: '@parentResource\(Employee\)'
          path: "*.tsp"
      - &file_matches_resource_model
        type: "file-matches"
        name: "file-matches-resource-model"
        config:
          pattern: "model AddressResource is ProxyResource<AddressProperties>|model AddressResource is ProxyResource<AddressResourceProperties>"
          path: "*.tsp"
      - &file_matches_interface
        type: "file-matches"
        name: "file-matches-interface"
        config:
          pattern: "interface Addresses|interface AddressResource"
          path: "*.tsp"
      - &file_matches_properties_model
        type: "file-matches"
        name: "file-matches-properties-model"
        config:
          pattern: "model AddressProperties|model AddressResourceProperties"
          path: "*.tsp"
      - &file_matches_street1_property
        type: "file-matches"
        name: "file-matches-street1-property"
        config:
          pattern: 'street1\?: string;'
          path: "*.tsp"
      - &file_matches_street2_property
        type: "file-matches"
        name: "file-matches-street2-property"
        config:
          pattern: 'street2\?: string;'
          path: "*.tsp"
      - &file_matches_city_property
        type: "file-matches"
        name: "file-matches-city-property"
        config:
          pattern: 'city\?: string;'
          path: "*.tsp"
      - &file_matches_state_property
        type: "file-matches"
        name: "file-matches-state-property"
        config:
          pattern: 'state\?: string;'
          path: "*.tsp"
      - &file_matches_postal_code_property
        type: "file-matches"
        name: "file-matches-postal-code-property"
        config:
          pattern: 'postalCode\?: string;'
          path: "*.tsp"
      - &file_matches_country_property
        type: "file-matches"
        name: "file-matches-country-property"
        config:
          pattern: 'country\?: string;'
          path: "*.tsp"
      - &file_matches_visibility
        type: "file-matches"
        name: "file-matches-visibility"
        config:
          pattern: '@visibility\(Lifecycle\.Read\)'
          path: "*.tsp"
      - &file_matches_provisioning_state_property
        type: "file-matches"
        name: "file-matches-provisioning-state-property"
        config:
          pattern: 'provisioningState\?: ProvisioningState;'
          path: "*.tsp"
      - &file_matches_read_operation
        type: "file-matches"
        name: "file-matches-read-operation"
        config:
          pattern: "ArmResourceRead<AddressResource>"
          path: "*.tsp"
      - &file_matches_create_operation
        type: "file-matches"
        name: "file-matches-create-operation"
        config:
          pattern: "ArmResourceCreateOrReplaceAsync<AddressResource>|ArmResourceCreateOrReplaceSync<AddressResource>"
          path: "*.tsp"
      - &file_matches_delete_operation
        type: "file-matches"
        name: "file-matches-delete-operation"
        config:
          pattern: "ArmResourceDeleteWithoutOkAsync<AddressResource>|ArmResourceDeleteSync<AddressResource>"
          path: "*.tsp"
      - &file_matches_list_operation
        type: "file-matches"
        name: "file-matches-list-operation"
        config:
          pattern: "ArmResourceListByParent<AddressResource>"
          path: "*.tsp"
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 002006-ARM-define-child-resource-no-skill
    tags:
      suite: "armtemplate"
      mode: "no-skill"
    prompt: |
      In API version `2024-10-01-preview`, add a child resource named `AddressResource` under the existing Employee ARM resource. Its optional properties are street1, street2, city, state, postalCode, and country, along with a read-only provisioning state. Support the standard operations for a child ARM resource. Follow TypeSpec Azure guidelines. I've already made the design decisions, so go ahead with the change.
    environment: *shared_environment
    rubric:
      - AddressResource is defined as a child proxy resource of Employee with the requested optional address properties and a read-only provisioning state.
      - The child resource is introduced in API version 2024-10-01-preview and follows TypeSpec Azure ARM guidelines.
      - Its operations interface provides standard get, create, update, delete, and list-by-parent operations.
    graders:
      - type: "tool-calls"
        config:
          required:
            - "^(edit|apply_patch|bash|powershell)$"
      - *file_matches
      - *file_matches_resource_model
      - *file_matches_interface
      - *file_matches_properties_model
      - *file_matches_street1_property
      - *file_matches_street2_property
      - *file_matches_city_property
      - *file_matches_state_property
      - *file_matches_postal_code_property
      - *file_matches_country_property
      - *file_matches_visibility
      - *file_matches_provisioning_state_property
      - *file_matches_read_operation
      - *file_matches_create_operation
      - *file_matches_delete_operation
      - *file_matches_list_operation
      - type: "prompt"
        config:
          prompt: "The Addresses interface should include standard CRUD operations (get, create, update, delete) and a list-by-parent operation."
          model: "gpt-5.6-sol"
          scoring: "scale_1_10"
          threshold: 0.88
    constraints:
      max_turns: 6
      max_tokens: 100000

scoring:
  weights:
    tool-calls: 0.05
    prompt: 0.05
    run-command: 0.05
    skill-invocation: 0.05
    file-matches: 0.8
  threshold: 0.99
