name: azure-typespec-author-eval
description: follow existing uppercase acronym patterns for new go names
version: "1.0"
type: capability
environment: naming-planning
defaults:
  runs: 1
  timeout: 180s
  model: gpt-5.6-sol
  executor: copilot-sdk
scoring:
  threshold: 1
stimuli:
  - name: 008004-follow-existing-uppercase-go-patterns-forced
    tags:
      suite: naming
      mode: forced
      language: go
    prompt: |
      @azure-typespec-author Continue TypeSpec authoring with default client
      configuration planning only. Analysis, intake, grounding, and the source plan are
      complete, and the user has not opted out. The ARM TypeSpec project targets Go.
      Before this change, union IdentityKeyStore declares member Tpm, and the loaded
      client.tsp contains the existing override:
      @@clientName(IdentityKeyStore.Tpm, "TPM", "go");
      The approved addition is union member IdentityKeyStore.TpmTransition. Its starting
      Go constant name candidate is IdentityKeyStoreTpmTransition. TypeSpec documentation
      confirms TPM means trusted platform module for both members. Go constants in this
      plan combine the union name with the member's Go name. There are no other related
      patterns, overrides, or collisions. Installed TCGC supports scoped clientName on
      this union member. Use only these TypeSpec facts and installed naming guidance;
      no network, MCP, edits, compilation, or generation.
      Return JSON with a top-level "names" object mapping "existing" and "added" directly
      to planned Go constant name strings. Also return "override" as an object with the
      real TypeSpec "target", member-only "name", and language "scope", plus top-level
      "applied" and "generatedNamesVerified".
    constraints:
      max_turns: 14
      max_tokens: 20000
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
            - azsdk-common-typespec-naming
      - type: tool-calls
        config:
          required:
            - name: ^(view|powershell|bash|rg)$
              pattern: go-naming\.md
          disallowed:
            - name: azsdk_
            - name: ^(edit|create|apply_patch|web_fetch|web_search)$
      - type: output-matches
        config:
          pattern: '"existing"\s*:\s*"IdentityKeyStoreTPM"'
      - type: output-matches
        config:
          pattern: '"added"\s*:\s*"IdentityKeyStoreTPMTransition"'
      - type: output-matches
        config:
          pattern: '"target"\s*:\s*"IdentityKeyStore\.TpmTransition"'
      - type: output-matches
        config:
          pattern: '"name"\s*:\s*"TPMTransition"'
      - type: output-matches
        config:
          pattern: '"scope"\s*:\s*"go"'
      - type: output-matches
        config:
          pattern: '"applied"\s*:\s*false'
      - type: output-matches
        config:
          pattern: '"generatedNamesVerified"\s*:\s*false'
