name: azure-typespec-author-eval
description: Authoring boundaries with shared naming available
version: "1.0"
type: capability
area: naming
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 120s
  model: gpt-5.6-sol
  executor: copilot-sdk
scoring:
  threshold: 1
stimuli:
  - name: 007014-anti-trigger-generate-csharp-sdk-trigger
    prompt: |
      Generate the C# SDK locally from specification/widget/resource-manager/Microsoft.Widget
      into sdk/widget/Azure.ResourceManager.Widget. The TypeSpec is ready. For now, identify
      and invoke the applicable skill, then stop before generation or edits.
    graders:
      - type: skill-invocation
        config:
          required:
            - azsdk-common-generate-sdk-locally
          disallowed:
            - azure-typespec-author
    tags:
      suite: naming
      mode: trigger
