name: azure-typespec-author-eval
description: Evaluation suite for azure-typespec-author.
version: "1.0"
type: capability
area: "dataplane"
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 660s
  model: gpt-5.6-sol
  executor: copilot-sdk
stimuli:
  - name: 006004-dp-create-resource-with-crud-trigger
    tags:
      suite: dataplane
      mode: trigger
    prompt:
      Add a Widgets interface with full CRUD and list operations for the WidgetSuite resource. The interface should include operations to create or update, get, list, and delete widgets. Create or update and delete complete synchronously. Use the appropriate
      Azure.Core resource operation templates. All material design decisions are provided, so proceed without confirmation.
    environment: &id001
      files:
        - src: ../fixtures/006004-dp-create-resource-with-crud/main.tsp
          dest: main.tsp
        - src: ../fixtures/006004-dp-create-resource-with-crud/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../fixtures/006004-dp-create-resource-with-crud/tspconfig.yaml
          dest: tspconfig.yaml
      commands:
        - node -e "const fs=require('fs');const t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync('node_modules')){fs.symlinkSync(t,'node_modules','junction')}"
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 006004-dp-create-resource-with-crud-forced
    tags:
      suite: dataplane
      mode: forced
    prompt:
      "@azure-typespec-author Add a Widgets interface with full CRUD and list operations for the WidgetSuite resource. The interface should include operations to create or update, get, list, and delete
      widgets. Create or update and delete complete synchronously. Use the appropriate Azure.Core resource operation templates. All material design decisions are provided, so proceed without confirmation."
    environment: *id001
    rubric: &shared_rubric
      - A Widgets interface is defined with get/read, create-or-update, list, and delete operations for WidgetSuite.
      - Each operation uses the appropriate Azure.Core resource operation template for its behavior.
      - Changes are limited to the requested interface and operations and contain no unrelated edits.
    graders:
      - type: run-command
        config:
          command: tsp compile .
          expected_exit_code: 0
      - &id003
        type: file-matches
        config:
          path: main.tsp
          pattern: ResourceRead<WidgetSuite>
      - &id004
        type: file-matches
        name: file-matches-create-operation
        config:
          path: main.tsp
          pattern: ResourceCreateOrReplace<WidgetSuite>|ResourceCreateOrUpdate<WidgetSuite>
      - &id005
        type: file-matches
        name: file-matches-list-operation
        config:
          path: main.tsp
          pattern: 'ResourceList<\s*WidgetSuite'
      - &id006
        type: file-matches
        name: file-matches-delete-operation
        config:
          path: main.tsp
          pattern: ResourceDelete<WidgetSuite>
      - &id007
        type: prompt
        config:
          prompt:
            "A Widgets interface should be defined with operations for the WidgetSuite resource including:

            1. A get/read operation using ResourceRead<WidgetSuite>

            2. A create or update operation using an Azure.Core create template

            3. A list operation using ResourceList<WidgetSuite>

            4. A synchronous delete operation using ResourceDelete

            "
          model: gpt-5.6-sol
          scoring: scale_1_10
          threshold: 0.77
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 006004-dp-create-resource-with-crud-no-skill
    tags:
      suite: dataplane
      mode: no-skill
    prompt:
      Add a Widgets interface with full CRUD and list operations for the WidgetSuite resource. The interface should include operations to create or update, get, list, and delete widgets. Create or update and delete complete synchronously. Use the appropriate
      Azure.Core resource operation templates. All material design decisions are provided, so proceed without confirmation.
    environment: *id001
    rubric: *shared_rubric
    graders:
      - type: tool-calls
        config:
          required:
            - "^(edit|apply_patch|bash|powershell)$"
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
    constraints:
      max_turns: 5
      max_tokens: 100000
scoring:
  weights:
    tool-calls: 0.125
    skill-invocation: 0.125
    run-command: 0.125
    file-matches: 0.375
    prompt: 0.25
  threshold: 0.9425
