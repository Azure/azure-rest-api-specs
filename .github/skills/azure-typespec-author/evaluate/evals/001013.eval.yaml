name: azure-typespec-author-eval
description: Evaluation suite for azure-typespec-author.
version: "1.0"
type: capability # capability | regression
area: "versioning"
# Root-level environment
environment: azsdk-mcp
# Execution configuration
defaults:
  runs: 1 # Trials per stimulus
  timeout: "660s" # Seconds per trial
  model: gpt-5.6-sol # Model for agent execution
  executor: copilot-sdk # Which executor to use

# Test cases
stimuli:
  - name: 001013-version-model-property-type-changed-trigger
    tags:
      suite: "versioning"
      mode: "trigger"
    prompt: |
      In the TypeSpec project at `./Microsoft.Widget/Widget/`, change the type of the `statusCode` property from `string` to `int32` in EmployeeProperties only for version `2025-05-04-preview`.
    environment: &shared_environment
      files:
        - src: ../fixtures/001-share-version-new-feature/employee.tsp
          dest: Microsoft.Widget/Widget/employee.tsp
        - src: ../fixtures/001-share-version-new-feature/main.tsp
          dest: Microsoft.Widget/Widget/main.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../scripts/check-node-dependencies.js
          dest: check-node-dependencies.js
        - src: ../fixtures/001-share-version-new-feature/readme.md
          dest: Microsoft.Widget/Widget/readme.md
        - src: ../fixtures/001-share-version-new-feature/shared.tsp
          dest: Microsoft.Widget/Widget/shared.tsp
        - src: ../fixtures/001-share-version-new-feature/tspconfig.yaml
          dest: Microsoft.Widget/Widget/tspconfig.yaml
      commands:
        - 'node -e "const fs=require(''fs'');const t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync(''node_modules'')){fs.symlinkSync(t,''node_modules'',''junction'')}"'
    graders:
      - type: "skill-invocation"
        config:
          required:
            - "azure-typespec-author"
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 001013-version-model-property-type-changed-forced
    tags:
      suite: "versioning"
      mode: "forced"
    prompt: |
      @azure-typespec-author In the TypeSpec project at `./Microsoft.Widget/Widget/`, change the type of the `statusCode` property from `string` to `int32` in EmployeeProperties only for version `2025-05-04-preview`.
    environment: *shared_environment
    rubric: &shared_rubric
      - EmployeeProperties.statusCode changes from string to int32 only in API version 2025-05-04-preview using valid TypeSpec versioning.
      - Earlier API versions retain the string type, and preview-version handling follows the preview-after-preview convention.
      - Changes are limited to the requested type change and contain no unrelated edits.
    graders:
      - type: "run-command"
        config:
          command: "node check-node-dependencies.js node_modules"
          expected_exit_code: 0
      - type: "run-command"
        config:
          command: "node check-node-dependencies.js packages"
          expected_exit_code: 0
      - type: "run-command"
        config:
          command: "tsp compile ."
          sub_path: "Microsoft.Widget/Widget"
          expected_exit_code: 0
      - &file_matches
        type: "file-matches"
        config:
          pattern: "v2025_05_04_preview"
          path: "Microsoft.Widget/Widget/main.tsp"
      - &file_matches_type_change
        type: "file-matches"
        name: "file-matches-type-change"
        config:
          pattern: '@typeChangedFrom\((?:Microsoft\.Widget\.)?Versions\.v2025_05_04_preview, string\)'
          path: "Microsoft.Widget/Widget/employee.tsp"
      - &file_matches_property
        type: "file-matches"
        name: "file-matches-property"
        config:
          pattern: 'statusCode\?: int32;'
          path: "Microsoft.Widget/Widget/employee.tsp"
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 001013-version-model-property-type-changed-no-skill
    tags:
      suite: "versioning"
      mode: "no-skill"
    prompt: "In the TypeSpec project at `./Microsoft.Widget/Widget/`, change the type of the `statusCode` property from `string` to `int32` in EmployeeProperties only for version `2025-05-04-preview`."
    environment: *shared_environment
    rubric: *shared_rubric
    graders:
      - type: "tool-calls"
        config:
          required:
            - "^(edit|apply_patch|bash|powershell)$"
      - *file_matches
      - *file_matches_type_change
      - *file_matches_property
    constraints:
      max_turns: 6
      max_tokens: 100000

scoring:
  weights:
    tool-calls: 0.125
    run-command: 0.125
    skill-invocation: 0.125
    file-matches: 0.625
  threshold: 0.97
