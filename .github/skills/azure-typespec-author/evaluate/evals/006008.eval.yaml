name: azure-typespec-author-eval
description: Evaluation suite for azure-typespec-author.
version: "1.0"
type: capability
area: "dataplane"
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 660s
  model: gpt-5.6-sol
  executor: copilot-sdk
stimuli:
  - name: 006008-dp-version-property-removed-trigger
    tags:
      suite: dataplane
      mode: trigger
    prompt: Remove the `color` property from the WidgetSuite model only for version `2023-06-01-preview`. Also add this new version to the Versions enum.
    environment: &id001
      files:
        - src: ../fixtures/006008-dp-version-property-removed/main.tsp
          dest: main.tsp
        - src: ../fixtures/006008-dp-version-property-removed/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../fixtures/006008-dp-version-property-removed/tspconfig.yaml
          dest: tspconfig.yaml
      commands:
        - node -e "const fs=require('fs');const t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync('node_modules')){fs.symlinkSync(t,'node_modules','junction')}"
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 006008-dp-version-property-removed-forced
    tags:
      suite: dataplane
      mode: forced
    prompt: "@azure-typespec-author Remove the `color` property from the WidgetSuite model only for version `2023-06-01-preview`. Also add this new version to the Versions enum."
    environment: *id001
    rubric: &shared_rubric
      - WidgetSuite.color is marked as removed only in API version 2023-06-01-preview rather than being deleted from the model.
      - Version 2023-06-01-preview is added to the Versions enum and the property uses valid TypeSpec versioning.
      - Earlier API versions retain color, and changes contain no unrelated edits.
    graders:
      - type: run-command
        config:
          command: tsp compile .
          expected_exit_code: 0
      - &id003
        type: file-matches
        config:
          path: main.tsp
          pattern: v2023_06_01_Preview
      - &id004
        type: file-matches
        name: file-matches-removed-property
        config:
          path: main.tsp
          pattern: '@removed\(Versions\.v2023_06_01_Preview\)'
      - &id005
        type: file-matches
        name: file-matches-color-property
        config:
          path: main.tsp
          pattern: color
      - &id006
        type: prompt
        config:
          prompt:
            The color property in WidgetSuite should have @removed(Versions.v2023_06_01_Preview) decorator added. The property itself should NOT be deleted from the model. A new version v2023_06_01_Preview
            should be added to the Versions enum.
          model: gpt-5.6-sol
          scoring: scale_1_10
          threshold: 0.77
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 006008-dp-version-property-removed-no-skill
    tags:
      suite: dataplane
      mode: no-skill
    prompt: Remove the `color` property from the WidgetSuite model only for version `2023-06-01-preview`. Also add this new version to the Versions enum.
    environment: *id001
    rubric: *shared_rubric
    graders:
      - type: tool-calls
        config:
          required:
            - "^(edit|apply_patch|bash|powershell)$"
      - type: run-command
        config:
          command: tsp compile .
          expected_exit_code: 0
      - *id003
      - *id004
      - *id005
      - *id006
    constraints:
      max_turns: 5
      max_tokens: 100000
scoring:
  weights:
    tool-calls: 0.125
    skill-invocation: 0.125
    run-command: 0.125
    file-matches: 0.375
    prompt: 0.25
  threshold: 0.9425
