name: azure-typespec-author-eval
description: Evaluation suite for azure-typespec-author.
version: "1.0"
type: capability # capability | regression
area: "armtemplate"
# Root-level environment
environment: azsdk-mcp
# Execution configuration
defaults:
  runs: 1 # Trials per stimulus
  timeout: "660s" # Seconds per trial
  model: gpt-5.6-sol # Model for agent execution
  executor: copilot-sdk # Which executor to use

# Test cases
stimuli:
  - name: 002002-ARM-define-extension-resource-add-trigger
    tags:
      suite: "armtemplate"
      mode: "trigger"
    prompt: |
      In API version `2024-10-01-preview`, add an Asset extension resource that can be attached to any ARM resource. It should have an optional, read-only provisioning state and support the standard operations for an ARM extension resource. Follow TypeSpec Azure guidelines. I've already made the design decisions, so go ahead with the change.
    environment: &shared_environment
      files:
        - src: ../fixtures/Microsoft.Widget/Widget/employee.tsp
          dest: employee.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/main.tsp
          dest: main.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../scripts/check-node-dependencies.js
          dest: check-node-dependencies.js
        - src: ../fixtures/Microsoft.Widget/Widget/readme.md
          dest: readme.md
        - src: ../fixtures/Microsoft.Widget/Widget/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
      commands:
        - 'node -e "const fs=require(''fs'');const t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync(''node_modules'')){fs.symlinkSync(t,''node_modules'',''junction'')}"'
    graders:
      - type: "skill-invocation"
        config:
          required:
            - "azure-typespec-author"
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 002002-ARM-define-extension-resource-add-forced
    tags:
      suite: "armtemplate"
      mode: "forced"
    prompt: |
      @azure-typespec-author In API version `2024-10-01-preview`, add an Asset extension resource that can be attached to any ARM resource. It should have an optional, read-only provisioning state and support the standard operations for an ARM extension resource. Follow TypeSpec Azure guidelines. I've already made the design decisions, so go ahead with the change.
    environment: *shared_environment
    graders:
      - type: "run-command"
        config:
          command: "node check-node-dependencies.js node_modules"
          expected_exit_code: 0
      - type: "run-command"
        config:
          command: "node check-node-dependencies.js packages"
          expected_exit_code: 0
      - type: "run-command"
        config:
          command: "tsp compile ."
          expected_exit_code: 0
      - &file_matches
        type: "file-matches"
        config:
          pattern: "model Asset is ExtensionResource<AssetProperties>"
          path: "*.tsp"
      - &file_matches_interface
        type: "file-matches"
        name: "file-matches-interface"
        config:
          pattern: "interface Assets|interface AssetOps"
          path: "*.tsp"
      - &file_matches_property
        type: "file-matches"
        name: "file-matches-property"
        config:
          pattern: "provisioningState"
          path: "*.tsp"
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 002002-ARM-define-extension-resource-add-no-skill
    tags:
      suite: "armtemplate"
      mode: "no-skill"
    prompt: |
      In API version `2024-10-01-preview`, add an Asset extension resource that can be attached to any ARM resource. It should have an optional, read-only provisioning state and support the standard operations for an ARM extension resource. Follow TypeSpec Azure guidelines. I've already made the design decisions, so go ahead with the change.
    environment: *shared_environment
    graders:
      - type: "tool-calls"
        config:
          required:
            - "^(edit|apply_patch|bash|powershell)$"
      - *file_matches
      - *file_matches_interface
      - *file_matches_property
    constraints:
      max_turns: 6
      max_tokens: 100000

scoring:
  weights:
    tool-calls: 0.2
    run-command: 0.2
    skill-invocation: 0.2
    file-matches: 0.4
  threshold: 1
