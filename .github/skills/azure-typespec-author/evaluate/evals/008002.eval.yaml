name: azure-typespec-author-eval
description: preserve all existing go names
version: "1.0"
type: capability
environment: naming-planning
defaults:
  runs: 1
  timeout: 180s
  model: gpt-5.6-sol
  executor: copilot-sdk
scoring:
  threshold: 1
stimuli:
  - name: 008002-preserve-all-existing-go-names-forced
    tags:
      suite: naming
      mode: forced
      language: go
    prompt: |
      Use the azure-typespec-author skill to review Go naming for this ARM TypeSpec change.
      Only WidgetProperties.count: int32 is new. Existing names are FooAbcOperation
      (stable), ExistingTpmDetails (preview), and ExistingAciSettings (unreleased).
      Their docs define ABC, TPM, and ACI as acronyms. Should I clean up their casing too?
    rubric:
      - Leaves all three existing names unchanged, including the preview and unreleased names.
      - Uses Count for the new count property without recommending redundant clientName overrides or unrelated cleanup.
    constraints:
      max_turns: 14
      max_tokens: 20000
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
            - azsdk-common-typespec-naming
      - type: tool-calls
        config:
          required:
            - name: ^(view|powershell|bash|rg)$
              pattern: go-naming\.md
          disallowed:
            - name: azsdk_
            - name: ^(edit|create|apply_patch)$
      - type: prompt
        config:
          model: gpt-5.6-sol
          scoring: binary
          threshold: 1
          prompt: >-
            Pass only if all rubric criteria are met. Judge naming recommendations,
            not response formatting. Reject unsupported claims that changes were
            applied or generated names were verified.
