name: azure-typespec-author-eval
description: preserve all existing go names
version: "1.0"
type: capability
environment: naming-planning
defaults:
  runs: 1
  timeout: 180s
  model: gpt-5.6-sol
  executor: copilot-sdk
scoring:
  threshold: 1
stimuli:
  - name: 008002-preserve-all-existing-go-names-forced
    tags:
      suite: naming
      mode: forced
      language: go
    prompt: |
      @azure-typespec-author Continue TypeSpec authoring with default client
      configuration planning only. Analysis, intake, grounding, and the source plan are
      complete, and the user has not opted out. The Widget ARM TypeSpec project targets
      Go. The pre-change TypeSpec declares operation FooAbcOperation in a stable API
      version, model ExistingTpmDetails in a preview API version, and model
      ExistingAciSettings in an unreleased API version. Their current planned Go names
      match their TypeSpec names, and there are no clientName overrides. Their TypeSpec
      documentation confirms ABC, TPM, and ACI as acronyms. None of these identifiers is
      newly introduced by this change. The only approved addition is
      WidgetProperties.count: int32, whose current proposed Go field name is Count.
      There are no collisions or other naming changes. Use only these TypeSpec facts
      and installed naming guidance; no network, MCP, edits, compilation, or generation.
      Return JSON with a top-level "names" object mapping "stable", "preview",
      "unreleased", and "count" directly to planned Go name strings, plus "decorators"
      listing any proposed casing overrides, "scope", "applied", and
      "generatedNamesVerified".
    constraints:
      max_turns: 14
      max_tokens: 20000
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
            - azsdk-common-typespec-naming
      - type: tool-calls
        config:
          required:
            - name: ^(view|powershell|bash|rg)$
              pattern: go-naming\.md
          disallowed:
            - name: azsdk_
            - name: ^(edit|create|apply_patch|web_fetch|web_search)$
      - type: output-matches
        config:
          pattern: '"stable"\s*:\s*"FooAbcOperation"'
      - type: output-matches
        config:
          pattern: '"preview"\s*:\s*"ExistingTpmDetails"'
      - type: output-matches
        config:
          pattern: '"unreleased"\s*:\s*"ExistingAciSettings"'
      - type: output-matches
        config:
          pattern: '"count"\s*:\s*"Count"'
      - type: output-matches
        config:
          pattern: '"decorators"\s*:\s*\[\s*\]'
      - type: output-matches
        config:
          pattern: '"scope"\s*:\s*"go"'
      - type: output-matches
        config:
          pattern: '"applied"\s*:\s*false'
      - type: output-matches
        config:
          pattern: '"generatedNamesVerified"\s*:\s*false'
