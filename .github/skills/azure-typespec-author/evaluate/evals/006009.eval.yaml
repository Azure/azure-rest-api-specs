name: azure-typespec-author-eval
description: Evaluation suite for azure-typespec-author.
version: "1.0"
type: capability
area: "dataplane"
environment: azsdk-mcp-local
defaults:
  runs: 1
  timeout: 660s
  model: gpt-5.6-sol
  executor: copilot-sdk
stimuli:
  - name: 006009-dp-version-property-renamed-trigger
    tags:
      suite: dataplane
      mode: trigger
    prompt: Rename the `color` property to `widgetColor` in the WidgetSuite model only for version `2023-06-01-preview`. Also add this new version to the Versions enum and carry forward all other existing features. All material design decisions are provided, so proceed without confirmation.
    environment: &id001
      files:
        - src: ../fixtures/006009-dp-version-property-renamed/main.tsp
          dest: main.tsp
        - src: ../fixtures/006009-dp-version-property-renamed/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../scripts/verify-emitted-contract.js
          dest: verify-emitted-contract.js
        - src: ../fixtures/006009-dp-version-property-renamed/tspconfig.yaml
          dest: tspconfig.yaml
      commands:
        - node -e "const fs=require('fs');const t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync('node_modules')){fs.symlinkSync(t,'node_modules','junction')}"
    graders:
      - &id002
        type: tool-calls
        config:
          required:
            - "^(edit|apply_patch|bash|powershell)$"
            - azure-sdk-mcp-azsdk_run_typespec_validation
            - web_fetch
          disallowed:
            - azure-sdk-mcp-azsdk_typespec_retrieve_knowledge
            - azure-sdk-mcp-azsdk_typespec_generate_authoring_plan
            - name: "^(bash|powershell)$"
              args:
                command: '(?i)(?:rm|remove-item)\b(?:(?!&&|;|\|\|).)*\b(?:node_modules|packages)\b'
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 006009-dp-version-property-renamed-forced
    tags:
      suite: dataplane
      mode: forced
    prompt: "@azure-typespec-author Rename the `color` property to `widgetColor` in the WidgetSuite model only for version `2023-06-01-preview`. Also add this new version to the Versions enum and carry forward all other existing features. All material design decisions are provided, so proceed without confirmation."
    environment: *id001
    rubric: &shared_rubric
      - WidgetSuite.color is renamed to widgetColor only in API version 2023-06-01-preview using valid TypeSpec versioning.
      - Version 2023-06-01-preview is added to the Versions enum and the prior property name is preserved for earlier versions.
      - Changes are limited to the requested versioned rename and contain no unrelated edits.
    graders:
      - *id002
      - type: run-command
        config:
          command: tsp compile .
          expected_exit_code: 0
      - &id003
        type: run-command
        name: run-command-version-contract
        config:
          command: node verify-emitted-contract.js version-006009
          expected_exit_code: 0
      - &id006
        type: prompt
        config:
          prompt:
            The color property should be renamed to widgetColor and decorated with @renamedFrom(Versions.v2023_06_01_Preview, "color"). A new version v2023_06_01_Preview should be added to the Versions
            enum.
          model: gpt-5.6-sol
          scoring: scale_1_10
          threshold: 0.77
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 006009-dp-version-property-renamed-no-skill
    tags:
      suite: dataplane
      mode: no-skill
    prompt: Rename the `color` property to `widgetColor` in the WidgetSuite model only for version `2023-06-01-preview`. Also add this new version to the Versions enum and carry forward all other existing features. All material design decisions are provided, so proceed without confirmation.
    environment: *id001
    rubric: *shared_rubric
    graders:
      - type: tool-calls
        config:
          required:
            - "^(edit|apply_patch|bash|powershell)$"
      - type: run-command
        config:
          command: tsp compile .
          expected_exit_code: 0
      - *id003
      - *id006
    constraints:
      max_turns: 5
      max_tokens: 100000
scoring:
  weights:
    tool-calls: 0.125
    skill-invocation: 0.125
    run-command: 0.5
    prompt: 0.25
  threshold: 0.9425
