name: azure-typespec-author-eval
description: Evaluation suite for azure-typespec-author.
version: "1.0"
type: capability # capability | regression
area: "armtemplate"
# Root-level environment
environment: azsdk-mcp
# Execution configuration
defaults:
  runs: 1 # Trials per stimulus
  timeout: "660s" # Seconds per trial
  model: gpt-5.6-sol # Model for agent execution
  executor: copilot-sdk # Which executor to use

# Test cases
stimuli:
  - name: 002005-ARM-define-the-resource-trigger
    tags:
      suite: "armtemplate"
      mode: "trigger"
    prompt: |
      In API version `2024-10-01-preview`, add a tracked Employee ARM resource to the Microsoft.Widget service. It should have optional age, city, and binary profile data, along with a read-only provisioning state. Support the standard operations for a tracked ARM resource. Follow TypeSpec Azure guidelines. I've already made the design decisions, so go ahead with the change.
    environment: &shared_environment
      files:
        - src: ../fixtures/002005-ARM-define-the-resource/main.tsp
          dest: main.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/package.json
          dest: package.json
        - src: ../scripts/check-node-dependencies.js
          dest: check-node-dependencies.js
        - src: ../scripts/verify-emitted-contract.js
          dest: verify-emitted-contract.js
        - src: ../fixtures/Microsoft.Widget/Widget/readme.md
          dest: readme.md
        - src: ../fixtures/Microsoft.Widget/Widget/shared.tsp
          dest: shared.tsp
        - src: ../fixtures/Microsoft.Widget/Widget/tspconfig.yaml
          dest: tspconfig.yaml
      commands:
        - 'node -e "const fs=require(''fs'');const t=process.env.FIXTURE_NODE_MODULES;if(t&&fs.existsSync(t)&&!fs.existsSync(''node_modules'')){fs.symlinkSync(t,''node_modules'',''junction'')}"'
    graders:
      - type: "skill-invocation"
        config:
          required:
            - "azure-typespec-author"
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 002005-ARM-define-the-resource-forced
    tags:
      suite: "armtemplate"
      mode: "forced"
    prompt: |
      @azure-typespec-author In API version `2024-10-01-preview`, add a tracked Employee ARM resource to the Microsoft.Widget service. It should have optional age, city, and binary profile data, along with a read-only provisioning state. Support the standard operations for a tracked ARM resource. Follow TypeSpec Azure guidelines. I've already made the design decisions, so go ahead with the change.
    environment: *shared_environment
    rubric: &shared_rubric
      - Employee is defined under Microsoft.Widget as a tracked ARM resource with optional age, city, and binary profile properties plus a read-only provisioning state.
      - The provisioning state incorporates the standard ARM ResourceProvisioningState behavior, directly or through a standard inherited resource shape.
      - The resource exposes standard tracked-resource CRUD and list-by-resource-group and list-by-subscription operations, directly or through a standard operations interface.
    graders:
      - type: "run-command"
        config:
          command: "node check-node-dependencies.js node_modules"
          expected_exit_code: 0
      - type: "run-command"
        config:
          command: "node check-node-dependencies.js packages"
          expected_exit_code: 0
      - type: "run-command"
        config:
          command: "tsp compile ."
          expected_exit_code: 0
      - &run_contract
        type: "run-command"
        name: "run-command-resource-contract"
        config:
          command: "node verify-emitted-contract.js arm-tracked-resource"
          expected_exit_code: 0
      - &semantic_contract
        type: "prompt"
        name: "semantic-resource-contract"
        config:
          prompt: "Verify the emitted resource contract rather than requiring a particular file split or template spelling: Employee is a tracked ARM resource under Microsoft.Widget; its properties include optional age, city, and binary profile data plus a read-only provisioning state with standard ARM behavior; and it exposes standard CRUD, resource-group list, and subscription list operations. Reject missing operations or fields and unrelated edits."
          model: "gpt-5.6-sol"
          scoring: "scale_1_10"
          threshold: 0.77
    constraints:
      max_turns: 5
      max_tokens: 1000000
  - name: 002005-ARM-define-the-resource-no-skill
    tags:
      suite: "armtemplate"
      mode: "no-skill"
    prompt: |
      In API version `2024-10-01-preview`, add a tracked Employee ARM resource to the Microsoft.Widget service. It should have optional age, city, and binary profile data, along with a read-only provisioning state. Support the standard operations for a tracked ARM resource. Follow TypeSpec Azure guidelines. I've already made the design decisions, so go ahead with the change.
    environment: *shared_environment
    rubric: *shared_rubric
    graders:
      - type: "tool-calls"
        config:
          required:
            - "^(edit|apply_patch|bash|powershell)$"
      - type: "run-command"
        config:
          command: "tsp compile ."
          expected_exit_code: 0
      - *run_contract
      - *semantic_contract
    constraints:
      max_turns: 6
      max_tokens: 100000

scoring:
  weights:
    tool-calls: 0.1
    prompt: 0.4
    run-command: 0.4
    skill-invocation: 0.1
  threshold: 0.977
