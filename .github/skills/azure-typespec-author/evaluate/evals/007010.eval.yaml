name: azure-typespec-author-eval
description: Authoring boundaries with shared naming available
version: "1.0"
type: capability
area: naming
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 120s
  model: gpt-5.6-sol
  executor: copilot-sdk
scoring:
  threshold: 1
stimuli:
  - name: 007010-trigger-author-dataplane-operation-trigger
    prompt: |
      Author a TypeSpec data-plane operation in
      specification/widget/data-plane/WidgetAnalytics/main.tsp. For now, identify and invoke
      the applicable skill, then stop before intake or edits.
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
    tags:
      suite: naming
      mode: trigger
