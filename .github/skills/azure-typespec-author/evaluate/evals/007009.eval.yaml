name: azure-typespec-author-eval
description: Authoring boundaries with shared naming available
version: "1.0"
type: capability
area: naming
environment: azsdk-mcp
defaults:
  runs: 1
  timeout: 120s
  model: gpt-5.6-sol
  executor: copilot-sdk
scoring:
  threshold: 1
stimuli:
  - name: 007009-trigger-add-arm-property-trigger
    prompt: |
      Add an enabled boolean to WidgetProperties in
      specification/widget/resource-manager/Microsoft.Widget/main.tsp. For now, identify and
      invoke the applicable skill, then stop before intake or edits.
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
    tags:
      suite: naming
      mode: trigger
