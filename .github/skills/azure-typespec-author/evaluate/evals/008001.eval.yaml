name: azure-typespec-author-eval
description: plan new go acronym names before authoring
version: "1.0"
type: capability
environment: naming-planning
defaults:
  runs: 1
  timeout: 180s
  model: gpt-5.6-sol
  executor: copilot-sdk
scoring:
  threshold: 1
stimuli:
  - name: 008001-plan-new-go-acronym-names-forced
    tags:
      suite: naming
      mode: forced
      language: go
    prompt: |
      Use the azure-typespec-author skill to review Go acronym casing in a new
      ARM TypeSpec project:
      union member ControllerType.CiscoAci and model AFDDomainMtlsParameters.
      Their docs use Cisco ACI, Azure Front Door (AFD), and mutual TLS (MTLS).
    rubric:
      - Recommends CiscoACI for ControllerType.CiscoAci and AFDDomainMTLSParameters for the model.
      - Any proposed clientName overrides are Go-scoped and target real TypeSpec declarations, not synthesized names.
    constraints:
      max_turns: 14
      max_tokens: 20000
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
            - azsdk-common-typespec-naming
      - type: tool-calls
        config:
          required:
            - name: ^(view|powershell|bash|rg)$
              pattern: go-naming\.md
          disallowed:
            - name: azsdk_
            - name: ^(edit|create|apply_patch)$
      - type: prompt
        config:
          model: gpt-5.6-sol
          scoring: binary
          threshold: 1
          prompt: >-
            Pass only if all rubric criteria are met. Judge naming recommendations,
            not response formatting. Reject unsupported claims that changes were
            applied or generated names were verified.
