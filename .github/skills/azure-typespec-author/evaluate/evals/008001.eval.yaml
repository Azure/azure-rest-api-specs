name: azure-typespec-author-eval
description: plan new go acronym names before authoring
version: "1.0"
type: capability
environment: naming-planning
defaults:
  runs: 1
  timeout: 180s
  model: gpt-5.6-sol
  executor: copilot-sdk
scoring:
  threshold: 1
stimuli:
  - name: 008001-plan-new-go-acronym-names-forced
    tags:
      suite: naming
      mode: forced
      language: go
    prompt: |
      @azure-typespec-author Continue TypeSpec authoring at the separate default SDK client
      configuration planning step. Analysis, intake, grounding, and the source plan are
      complete, and the user has not opted out. This is a new, never-shipped Go ARM SDK at
      specification/widget/resource-manager/Microsoft.Widget. There are no existing SDK
      names, related casing patterns, overrides, or collisions. The approved additions
      include union variant ControllerType.CiscoAci and model AFDDomainMtlsParameters.
      Cisco ACI is the documented acronym; AFD means Azure Front Door and MTLS means mutual
      TLS. The current proposed Go names are ControllerTypeCiscoAci,
      AFDDomainMtlsParameters, AFDDomainMtlsParametersClassification, and
      GetAFDDomainMtlsParameters. The classification interface and getter are synthesized
      from the model, not separate TypeSpec declarations. Use these confirmed facts and
      installed naming guidance only. No network, MCP, edits, compilation, or SDK generation.
      Return JSON with a top-level "names" object mapping "controller", "model",
      "classification", and "getter" directly to planned Go name strings. Also include
      top-level "scope", "applied", and "generatedNamesVerified".
    constraints:
      max_turns: 14
      max_tokens: 20000
    graders:
      - type: skill-invocation
        config:
          required:
            - azure-typespec-author
            - azsdk-common-typespec-naming
      - type: tool-calls
        config:
          required:
            - name: ^(view|powershell|bash|rg)$
              pattern: go-naming\.md
          disallowed:
            - name: azsdk_
            - name: ^(edit|create|apply_patch|web_fetch|web_search)$
      - type: output-matches
        config:
          pattern: '"controller"\s*:\s*"ControllerTypeCiscoACI"'
      - type: output-matches
        config:
          pattern: '"model"\s*:\s*"AFDDomainMTLSParameters"'
      - type: output-matches
        config:
          pattern: '"classification"\s*:\s*"AFDDomainMTLSParametersClassification"'
      - type: output-matches
        config:
          pattern: '"getter"\s*:\s*"GetAFDDomainMTLSParameters"'
      - type: output-matches
        config:
          pattern: '"scope"\s*:\s*"go"'
      - type: output-matches
        config:
          pattern: '"applied"\s*:\s*false'
      - type: output-matches
        config:
          pattern: '"generatedNamesVerified"\s*:\s*false'
