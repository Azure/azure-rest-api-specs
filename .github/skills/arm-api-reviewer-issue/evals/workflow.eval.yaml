name: arm-api-reviewer-issue-workflow-eval
description: Multi-turn clarification, provisional drafting, duplicate handling,
  approval, and error-recovery exercises without GitHub mutations. No live
  GitHub writes are permitted; these are conversational tests, not publication
  integration tests.
skill: arm-api-reviewer-issue
schemaVersion: "1.4"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: auto
  skill_directories:
    - ..
  inject_skill_body: false
metrics:
  - name: behavior_quality
    weight: 1
    threshold: 1
    description: All conversation and routing safeguards must pass.
graders:
  - type: tool_constraint
    name: offline_read_only_tools
    config:
      allow_only:
        - tool: skill
        - tool: view
        - tool: read
        - tool: glob
        - tool: grep
        - tool: rg
        - tool: ask_user
tasks:
  - tasks/workflow/*.yaml
