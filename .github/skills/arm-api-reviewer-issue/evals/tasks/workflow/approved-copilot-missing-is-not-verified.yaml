id: approved-copilot-missing-is-not-verified
name: approved Copilot assignment missing after creation
tags:
  - workflow
  - offline
inputs:
  prompt: |
    Consider an offline verification scenario for the ARM API Reviewer issue
    skill. No external calls, commands, or mutations are permitted. Treat all
    supplied operation results as fixtures, not live GitHub evidence.
  follow_up_prompts:
    - |
      Fixture: push access was confirmed, the assignable-actor query returned
      copilot-swe-agent, and the complete approved draft included Copilot as
      its assignee. One creation request returned
      https://github.com/Azure/azure-rest-api-specs/issues/47396.
      Read-back confirms the approved public repository, title, body, and all
      approved labels, but assignees is an empty array. There is exactly one
      created issue. What is the result and appropriate next action?
checkpoints:
  - after_turn: 1
    graders:
      - type: skill_invocation
        name: loads_issue_skill
        config:
          required_skills:
            - arm-api-reviewer-issue
          mode: any_order
          allow_extra: true
graders:
  - type: text
    name: reports_missing_approved_assignment
    config:
      contains:
        - https://github.com/Azure/azure-rest-api-specs/issues/47396
        - Copilot
      regex_match:
        - "(?i)(missing|absent|not applied|unassigned|empty|mismatch)"
        - "(?i)(separate|new|explicit|additional|renewed).{0,80}approval|approval.{0,80}(separate|new|explicit|additional|renewed)"
      not_contains:
        - Awaiting your approval
        - No issue has been created
        - Creating the issue now
  - type: text
    name: no_unverified_success_or_silent_repair
    config:
      regex_not_match:
        - '(?im)^[\s*_>#-]*published\s+and\s+verified'
        - '(?i)\b(I|we)\s+(have\s+|just\s+|now\s+)?(assigned|reassigned|recreated|deleted)\b'
  - type: tool_constraint
    name: reads_workflow_reference
    config:
      expect_tools:
        - tool: view
          path_pattern: 'references[\\/]workflow\.md$'
