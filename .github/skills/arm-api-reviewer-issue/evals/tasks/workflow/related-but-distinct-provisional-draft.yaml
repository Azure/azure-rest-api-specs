id: related-but-distinct-provisional-draft
name: related but distinct provisional draft
tags:
  - workflow
  - offline
inputs:
  prompt: |
    Help draft an ARM API Reviewer improvement issue. I want an explanation
    when a public rule link cannot be opened, with steps the user can take.
    The reviewer currently gives me a generic error. This is my report,
    not a reproduced or confirmed defect.
    Offline exercise: load the skill only. No GitHub calls, shell commands,
    or publication. A live duplicate check is unavailable.
  follow_up_prompts:
    - |
      Fixture: the only supplied open issue is #47390, which concerns automatic
      dispatch rather than rule-link error messages. The existing public
      reviewer guide is documentation/api-reviewer-agent.md in
      Azure/azure-rest-api-specs. Prepare a provisional full draft, explain
      the scope difference and missing verification, and request approval.
      Do not claim the public records were fetched or that an issue exists.
graders:
  - type: code
    name: five_sections_and_short_summary
    config:
      language: javascript
      assertions:
        - >-
          JSON.stringify((output.match(/^##[ \t]+.+$/gm) || []).map(function(heading) {
            return heading.replace(/^##[ \t]+/, "").trim();
          })) === JSON.stringify(["Summary", "Issue", "Evidence", "Solution", "References"])
        - >-
          !/^#{3,6}[ \t]+/m.test(output)
        - >-
          (function() {
            var summary = output.split(/^## Summary[ \t]*$/m)[1];
            if (!summary) return false;
            summary = summary.split(/^## Issue[ \t]*$/m)[0].trim();
            var sentences = summary.match(/[.!?](?:\s|$)/g) || [];
            return sentences.length >= 2 && sentences.length <= 3;
          })()
  - type: tool_constraint
    name: reads_required_drafting_references
    config:
      expect_tools:
        - tool: view
          path_pattern: 'references[\\/]workflow\.md$'
        - tool: view
          path_pattern: 'references[\\/]issue-template\.md$'
  - type: text
    name: output_contains_1
    config:
      contains:
        - "ARM API Reviewer agent:"
  - type: text
    name: output_contains_2
    config:
      contains:
        - "## Summary"
  - type: text
    name: output_contains_3
    config:
      contains:
        - "## Issue"
  - type: text
    name: output_contains_4
    config:
      contains:
        - "## Evidence"
  - type: text
    name: output_contains_5
    config:
      contains:
        - "## Solution"
  - type: text
    name: solution_includes_delivery_and_limits
    config:
      regex_match:
        - "(?i)design"
        - "(?i)implementation"
        - "(?i)validation"
        - "(?i)limitations"
  - type: text
    name: output_contains_7
    config:
      contains:
        - "## References"
  - type: text
    name: output_not_contains_8
    config:
      not_contains:
        - I created the issue
