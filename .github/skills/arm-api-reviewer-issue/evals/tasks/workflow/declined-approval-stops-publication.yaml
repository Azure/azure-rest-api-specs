id: declined-approval-stops-publication
name: declined approval stops publication
tags:
  - workflow
  - offline
inputs:
  prompt: |
    Prepare an ARM API Reviewer issue about unclear review progress.
    Offline only: no external calls, commands, or publication. Any draft
    must disclose that live issue discovery and reproduction are unavailable.
  follow_up_prompts:
    - |
      Do not publish it. Keep it as a draft.
checkpoints:
  - after_turn: 1
    graders:
      - type: skill_invocation
        name: loads_issue_skill
        config:
          required_skills:
            - arm-api-reviewer-issue
          mode: any_order
          allow_extra: true
graders:
  - type: text
    name: output_contains_1
    config:
      contains:
        - draft
      regex_match:
        - "(?i)(nothing (has been )?published|no issue (has been |was )?created|retained|kept|saved)"
  - type: text
    name: output_not_contains_2
    config:
      not_contains:
        - Awaiting your approval
  - type: text
    name: no_unverified_success_claim
    config:
      regex_not_match:
        - '(?i)\b(I|we)\s+(have\s+|just\s+|now\s+)?(created|filed|opened|published|submitted|posted)\s+(the|this|an|a|your|that)\s+(new\s+)?(GitHub\s+)?issue'
        - '(?i)\bthe\s+issue\s+(has\s+been|was|is\s+now)\s+(successfully\s+)?(created|filed|opened|published|submitted|posted)'
        - '(?im)^[\s*_>#-]*published\s+and\s+verified'
  - type: tool_constraint
    name: reads_workflow_reference
    config:
      expect_tools:
        - tool: view
          path_pattern: 'references[\\/]workflow\.md$'
