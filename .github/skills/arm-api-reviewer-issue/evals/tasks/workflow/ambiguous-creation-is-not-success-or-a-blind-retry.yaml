id: ambiguous-creation-is-not-success-or-a-blind-retry
name: ambiguous creation is not success or a blind retry
tags:
  - workflow
  - offline
inputs:
  prompt: |
    Consider an offline recovery scenario for the ARM API Reviewer issue
    skill. No tools, commands, or mutations are permitted. A fixture says
    a previously approved creation request timed out; its outcome is unknown.
  follow_up_prompts:
    - |
      Fixture: recent-issue lookup and read-back are also unavailable. Explain
      the safe next step. Do not invent a created issue URL or send another
      creation request.
graders:
  - type: text
    name: unknown_result_and_safe_recovery_are_explicit
    config:
      regex_match:
        - "(?i)(unknown|uncertain|unconfirmed|cannot determine|can.t determine)"
        - "(?i)(verify|verification|check|lookup|read.back|search)"
  - type: text
    name: output_not_contains_1
    config:
      not_contains:
        - I created the issue
  - type: text
    name: output_not_contains_2
    config:
      not_contains:
        - https://github.com/Azure/azure-rest-api-specs/issues/
