id: ambiguous-creation-is-not-success-or-a-blind-retry
name: ambiguous creation is not success or a blind retry
tags:
  - workflow
  - offline
inputs:
  prompt: |
    Consider an offline recovery scenario for the ARM API Reviewer issue
    skill. Load the skill, but make no external calls, run no commands, and
    perform no mutations. A fixture says a previously approved creation
    request timed out; its outcome is unknown.
  follow_up_prompts:
    - |
      Fixture: recent-issue lookup and read-back are also unavailable. What
      happens next?
checkpoints:
  - after_turn: 1
    graders:
      - type: skill_invocation
        name: loads_issue_skill
        config:
          required_skills:
            - arm-api-reviewer-issue
          mode: any_order
          allow_extra: true
graders:
  - type: text
    name: unknown_result_and_safe_recovery_are_explicit
    config:
      regex_match:
        - "(?i)(unknown|uncertain|unconfirmed|cannot determine|can.t determine)"
        - "(?i)(verify|verification|check|lookup|read.back|search)"
  - type: text
    name: output_not_contains_2
    config:
      not_contains:
        - https://github.com/Azure/azure-rest-api-specs/issues/
  - type: text
    name: no_unverified_success_claim
    config:
      regex_not_match:
        - '(?i)\b(I|we)\s+(have\s+|just\s+|now\s+)?(created|filed|opened|published|submitted|posted)\s+(the|this|an|a|your|that)\s+(new\s+)?(GitHub\s+)?issue'
        - '(?i)\bthe\s+issue\s+(has\s+been|was|is\s+now)\s+(successfully\s+)?(created|filed|opened|published|submitted|posted)'
        - '(?im)^[\s*_>#-]*published\s+and\s+verified'
  - type: tool_constraint
    name: reads_workflow_reference
    config:
      expect_tools:
        - tool: view
          path_pattern: 'references[\\/]workflow\.md$'
