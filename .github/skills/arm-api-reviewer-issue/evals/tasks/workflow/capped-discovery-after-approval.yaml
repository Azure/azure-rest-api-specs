id: capped-discovery-after-approval
name: capped duplicate discovery remains blocked after approval
tags:
  - workflow
  - offline
inputs:
  prompt: |
    Consider an offline pre-publication scenario for the ARM API Reviewer
    issue skill. No external calls, commands, or mutations are permitted.
    Treat all supplied operation results as fixtures, not live GitHub evidence.
  follow_up_prompts:
    - |
      Fixture: the user approved the complete implementation-ready issue draft,
      including its public destination, labels, and assignee. Push access was
      confirmed. The complete labeled issue list has no exact duplicate.
      The title-prefix search returned exactly 200 issues with no exact match,
      its configured limit was 200, and no completeness metadata was returned.
      Remaining pages and the all-open-issue REST listing are unavailable.
      No issue creation request has been made. What is the result and
      appropriate next action?
checkpoints:
  - after_turn: 1
    graders:
      - type: skill_invocation
        name: loads_issue_skill
        config:
          required_skills:
            - arm-api-reviewer-issue
          mode: any_order
          allow_extra: true
graders:
  - type: text
    name: blocks_publication_until_complete_discovery
    config:
      contains:
        - Publication blocked
        - "200"
      regex_match:
        - "(?i)(incomplete|truncat|capped|result limit)"
        - "(?i)(pagination|remaining pages|all.open.issue|REST)"
      not_contains:
        - Awaiting your approval
        - Creating the issue now
  - type: text
    name: no_unverified_success_claim
    config:
      regex_not_match:
        - '(?i)\b(I|we)\s+(have\s+|just\s+|now\s+)?(created|filed|opened|published|submitted|posted)\s+(the|this|an|a|your|that)\s+(new\s+)?(GitHub\s+)?issue'
        - '(?i)\bthe\s+issue\s+(has\s+been|was|is\s+now)\s+(successfully\s+)?(created|filed|opened|published|submitted|posted)'
        - '(?im)^[\s*_>#-]*published\s+and\s+verified'
  - type: tool_constraint
    name: reads_workflow_reference
    config:
      expect_tools:
        - tool: view
          path_pattern: 'references[\\/]workflow\.md$'
