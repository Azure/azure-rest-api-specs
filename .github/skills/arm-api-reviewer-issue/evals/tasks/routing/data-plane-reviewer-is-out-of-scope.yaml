id: data-plane-reviewer-is-out-of-scope
name: data plane reviewer is out of scope
tags:
  - routing
  - offline
inputs:
  prompt: |
    I want to report a problem with the Data-Plane API Reviewer, not the ARM
    API Reviewer. Explain the appropriate next step without publishing.
graders:
  - type: text
    name: redirects_without_drafting_an_arm_issue
    config:
      regex_match:
        - "(?i)data[- ]plane"
      not_contains:
        - "ARM API Reviewer agent:"
        - "## Summary"
  - type: text
    name: no_unverified_success_claim
    config:
      regex_not_match:
        - '(?i)\b(I|we)\s+(have\s+|just\s+|now\s+)?(created|filed|opened|published|submitted|posted)\s+(the|this|an|a|your|that)\s+(new\s+)?(GitHub\s+)?issue'
        - '(?i)\bthe\s+issue\s+(has\s+been|was|is\s+now)\s+(successfully\s+)?(created|filed|opened|published|submitted|posted)'
        - '(?im)^[\s*_>#-]*published\s+and\s+verified'
