name: arm-api-reviewer-eval-arm-resource-structure
description: |
  ARM resource structure & CRUD tests (01xxxx).
  Validates detection of missing lifecycle operations and missing provisioningState.

# The skill under test. Declared once here rather than per stimulus: vally merges the
# root environment into each stimulus environment, and the path resolves relative to this
# file. Without it the suite runs skill-free -- `paths.skills` in .vally.yaml only takes
# effect when the run passes --skill-dir, which neither the local nor the CI runner does.
environment:
  skills:
    - "../../../azure-api-review"
  files:
    - src: "../../../../instructions/arm-api-review.instructions.md"
      dest: ".github/instructions/arm-api-review.instructions.md"
    - src: "../../../../instructions/openapi-review.instructions.md"
      dest: ".github/instructions/openapi-review.instructions.md"
    - src: "../../../azure-api-review/references/tracked-resource-lifecycle.md"
      dest: ".github/skills/azure-api-review/references/tracked-resource-lifecycle.md"
    - src: "../../../../../specification/common-types/resource-management/v5/types.json"
      dest: "specification/common-types/resource-management/v5/types.json"

tags:
  area: arm-api-reviewer

defaults:
  runs: 1
  timeout: "300s"
  model: gpt-5.6-sol?effort=high
  judge_model: claude-sonnet-4.6

scoring:
  threshold: 0.7

stimuli:
  # 010001 — Missing CRUD operations
  - name: detect-missing-crud-ops
    environment:
      files:
        - src: "../fixtures/arm-openapi/missing-crud-ops.json"
          dest: "specification/widgetmanager/resource-manager/Microsoft.WidgetManager/stable/2025-01-01/widgetmanager.json"
    prompt: >
      Review the following ARM resource-manager OpenAPI specification file for
      compliance with Azure REST API Guidelines and ARM RPC rules. This is a new
      service with no previous API version. Report all findings with rule IDs,
      line numbers, and fix suggestions.

      File: specification/widgetmanager/resource-manager/Microsoft.WidgetManager/stable/2025-01-01/widgetmanager.json
    constraints:
      expect_skills:
        - azure-api-review
    graders:
      - type: output-contains
        config:
          substring: "DELETE"
      - type: output-matches
        config:
          pattern: "(?i)resource.?group|ListByResourceGroup"
      - type: output-matches
        config:
          pattern: "(?i)subscription|ListBySubscription"
      - type: prompt
    rubric:
      - Flagged the missing DELETE operation for the tracked Widget resource
      - Flagged the missing ListByResourceGroup (collection GET at resource group scope)
      - Flagged the missing ListBySubscription (collection GET at subscription scope)
      - Flagged the missing Operations API endpoint (/providers/Microsoft.WidgetManager/operations)
      - Cited rule IDs related to tracked resource lifecycle requirements (e.g., RPC-Put-V1-22, RPC-Get-V1-05)

  # 010002 — Missing provisioningState
  - name: detect-missing-provisioning-state
    environment:
      files:
        - src: "../fixtures/arm-openapi/missing-provisioning-state.json"
          dest: "specification/jobservice/resource-manager/Microsoft.JobService/stable/2025-01-01/jobservice.json"
    prompt: >
      Review the following ARM resource-manager OpenAPI specification file for
      compliance with Azure REST API Guidelines and ARM RPC rules. This is a new
      service with no previous API version. Report all findings with rule IDs,
      line numbers, and fix suggestions.

      File: specification/jobservice/resource-manager/Microsoft.JobService/stable/2025-01-01/jobservice.json
    constraints:
      expect_skills:
        - azure-api-review
    graders:
      - type: output-contains
        config:
          substring: "provisioningState"
      - type: output-matches
        config:
          pattern: "(?i)RPC-Async-V1-0[23]"
      - type: prompt
    rubric:
      - Flagged the missing provisioningState property on the Job resource that has x-ms-long-running-operation true on PUT
      - Cited RPC-Async-V1-02 or RPC-Async-V1-03 as the violated rule

  # 010003 — Inline common-types instead of $ref
  - name: detect-inline-common-types
    environment:
      files:
        - src: "../fixtures/arm-openapi/inline-common-types.json"
          dest: "specification/inlinesvc/resource-manager/Microsoft.InlineTypes/stable/2025-01-01/inlinesvc.json"
    prompt: >
      Review the following ARM resource-manager OpenAPI specification file for
      compliance with Azure REST API Guidelines and ARM RPC rules. This is a new
      service with no previous API version. Report all findings with rule IDs,
      line numbers, and fix suggestions.

      File: specification/inlinesvc/resource-manager/Microsoft.InlineTypes/stable/2025-01-01/inlinesvc.json
    constraints:
      expect_skills:
        - azure-api-review
    graders:
      - type: output-matches
        config:
          pattern: "(?i)common.types|TrackedResource|inline"
      - type: prompt
    rubric:
      - Flagged the inline Widget definition (id, name, type, location, tags) — should use allOf with common-types TrackedResource $ref instead of redefining envelope properties
      - Flagged the custom ErrorResponse/ErrorDetail — should reference common-types ErrorResponse
      - Flagged the inline SubscriptionIdParameter, ResourceGroupNameParameter, and ApiVersionParameter — should reference common-types parameters

  # 010004 — Custom collection GET parameter is Warning, not Blocking
  - name: collection-custom-query-parameter-warning
    tags:
      issue: "45675"
    environment:
      files:
        - src: "../fixtures/arm-openapi/collection-custom-query-parameter.json"
          dest: "specification/pagingsvc/resource-manager/Microsoft.PagingTest/stable/2025-01-01/paging.json"
    prompt: >
      Read `.github/instructions/arm-api-review.instructions.md` section 2.2 and
      `.github/skills/azure-api-review/references/tracked-resource-lifecycle.md`.
      Do not edit any file. Review only the `Widgets_List` collection GET query
      parameters in this ARM OpenAPI file. Classify the custom `region` query
      parameter under the applicable ARM RPC rule. Return the standard review
      finding with its rule ID and severity.

      File: specification/pagingsvc/resource-manager/Microsoft.PagingTest/stable/2025-01-01/paging.json
    constraints:
      expect_skills:
        - azure-api-review
    graders:
      - type: output-matches
        name: "custom collection parameter is Warning"
        config:
          pattern: '(?is)(?:🟠\s*Warning|\bWarning\b).{0,500}(?:region|RPC-Uri-V1-09)|(?:region|RPC-Uri-V1-09).{0,500}(?:🟠\s*Warning|\bWarning\b)'
      - type: output-not-matches
        name: "custom collection parameter is not a Blocking finding"
        config:
          pattern: '(?is)\*\*\[(?:NEW|EXISTING)\]\s*🔴\s*Blocking.{0,500}(?:region|RPC-Uri-V1-09)'
      - type: output-contains
        name: "suggests standard filter"
        config:
          substring: "$filter"
      - type: prompt
    rubric:
      - The custom `region` collection GET parameter is reported as Warning, never Blocking
      - The finding cites Recommended rule `RPC-Uri-V1-09`
      - The suggested fix uses `$filter` when it can express the same filtering operation

  # 010005 — Point GET custom parameter remains Blocking
  - name: point-get-custom-query-parameter-blocking
    tags:
      issue: "45675"
    environment:
      files:
        - src: "../fixtures/arm-openapi/point-custom-query-parameter.json"
          dest: "specification/pagingsvc/resource-manager/Microsoft.PagingTest/stable/2025-01-01/paging.json"
    prompt: >
      Read `.github/instructions/arm-api-review.instructions.md` section 2.2 and
      `.github/skills/azure-api-review/references/tracked-resource-lifecycle.md`.
      Do not edit any file. Review only the `Widgets_Get` point GET query
      parameters in this ARM OpenAPI file. Classify the custom `expandDetails`
      query parameter under the applicable ARM RPC rule. Return the standard
      review finding with its rule ID and severity.

      File: specification/pagingsvc/resource-manager/Microsoft.PagingTest/stable/2025-01-01/paging.json
    constraints:
      expect_skills:
        - azure-api-review
    graders:
      - type: output-matches
        name: "point GET parameter is Blocking"
        config:
          pattern: '(?is)(?:🔴\s*Blocking|\bBlocking\b).{0,500}(?:expandDetails|RPC-Get-V1-08)|(?:expandDetails|RPC-Get-V1-08).{0,500}(?:🔴\s*Blocking|\bBlocking\b)'
      - type: output-contains
        name: "point GET rule cited"
        config:
          substring: "RPC-Get-V1-08"
      - type: prompt
    rubric:
      - The `expandDetails` parameter is a Blocking point GET violation
      - The finding cites `RPC-Get-V1-08`
      - The allowance for collection paging parameters is not applied to point GET

  # 010006 — Incomplete inline systemData shape is Blocking
  - name: incomplete-inline-systemdata-blocking
    tags:
      audit: "2026-08-15"
    environment:
      files:
        - src: "../fixtures/arm-openapi/inline-systemdata.json"
          dest: "specification/systemdatasvc/resource-manager/Microsoft.SystemDataTest/stable/2025-01-01/systemdata.json"
    prompt: >
      Review only the `systemData` property and `InlineSystemData` definition in
      this ARM resource OpenAPI file. Determine whether its shape matches the
      canonical ARM systemData contract. Common-types reuse is recommended but
      not mandatory when an inline shape is fully compatible. Do not edit the
      file; return the standard finding with severity and fix.

      File: specification/systemdatasvc/resource-manager/Microsoft.SystemDataTest/stable/2025-01-01/systemdata.json
    constraints:
      expect_skills:
        - azure-api-review
    graders:
      - type: output-matches
        name: "incomplete systemData shape is Blocking"
        config:
          pattern: '(?is)(?:systemData|InlineSystemData).{0,500}(?:🔴\s*Blocking|\bBlocking\b)|(?:🔴\s*Blocking|\bBlocking\b).{0,500}(?:systemData|InlineSystemData)'
      - type: output-matches
        name: "canonical systemData shape required"
        config:
          pattern: "(?is)(?:systemData).{0,400}(?:createdByType|lastModifiedBy|canonical|common.?types)|(?:createdByType|lastModifiedBy|canonical|common.?types).{0,400}(?:systemData)"
      - type: prompt
    rubric:
      - The incomplete inline `systemData` shape is Blocking because it does not match the canonical ARM contract
      - The fix adds the missing canonical fields or uses the recommended common-types definition
      - The finding does not claim that every compatible inline definition is forbidden
