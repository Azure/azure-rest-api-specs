name: data-plane-api-reviewer-eval-versioning
description: |
  Versioning and backward-compatibility tests for the data-plane API reviewer.
  Covers DP-VERSION-01 through DP-VERSION-03. See
  references/data-plane-resource-modeling.md.

  This area is entirely agent-owned. The `data-plane` ruleset in
  @azure-tools/typespec-azure-rulesets sets `non-breaking-versioning: false`,
  so backward compatibility across API versions is NOT linted on the data
  plane. It is the single largest looks-linted-but-is-not area, and the
  reviewer is the only thing standing between a stable-version breaking change
  and shipped SDKs.

  The corresponding false-positive guard - a breaking change between two
  PREVIEW versions, which is permitted - lives in eval-true-negatives.yaml as
  tn-preview-breaking-change-allowed. The two must be kept in sync: a reviewer
  tuned to pass one and fail the other is not calibrated, it is guessing.

tags:
  area: data-plane-api-reviewer

defaults:
  runs: 1
  timeout: "420s"
  # Keep equal to `engine.model` in .github/workflows/data-plane-api-review.md.
  model: claude-opus-4.6
  judge_model: claude-sonnet-4.6

scoring:
  threshold: 0.7

stimuli:
  - name: stable-version-breaking-changes
    environment:
      skills:
        - "../../../azure-api-review"
      files:
        - src: "../fixtures/version-pairs/stable-removed-property/stable-2025-01-01.tsp"
          dest: "specification/alertregistry/data-plane/Contoso.AlertRegistry/stable/2025-01-01/alerts.tsp"
        - src: "../fixtures/version-pairs/stable-removed-property/stable-2026-01-01.tsp"
          dest: "specification/alertregistry/data-plane/Contoso.AlertRegistry/stable/2026-01-01/alerts.tsp"
    prompt: >
      Review the following data-plane TypeSpec specification for compliance with
      the Azure REST API Guidelines. The pull request adds the 2026-01-01 stable
      API version; 2025-01-01 is the previously shipped stable version and is
      shown for comparison. Pay particular attention to versioning and backward
      compatibility. Report findings with rule IDs, line numbers, and fix
      suggestions.

      New version: specification/alertregistry/data-plane/Contoso.AlertRegistry/stable/2026-01-01/alerts.tsp
      Previous version: specification/alertregistry/data-plane/Contoso.AlertRegistry/stable/2025-01-01/alerts.tsp
    constraints:
      expect_skills:
        - azure-api-review
    graders:
      - type: output-matches
        name: "reports breaking changes"
        config:
          pattern: "\\*\\*\\[DP-VERSION-0[0-9]\\]"
      - type: output-matches
        name: "raises stable-version breaking changes at blocking severity"
        config:
          pattern: "(?im)^\\s*(?:[-*+]\\s*|#{1,6}\\s*)?🔴"
      - type: prompt
    rubric:
      - "The agent identifies the removed response property `lastEvaluatedAt` as a breaking change against the previously shipped stable version."
      - "The agent identifies that the `AlertSeverity` union was open in 2025-01-01 and is closed in 2026-01-01, and that the `Informational` member was dropped - so values the service may still emit will no longer deserialize in generated clients."
      - "The agent identifies that the optional request property `notificationChannel` was made required."
      - "The agent identifies that `thresholdPerMinute` changed type from int32 to float64."
      - The agent raises these at Blocking severity, because both versions are stable and a breaking change in a stable version cannot be walked back once SDKs ship.
      - The agent notes that none of the changes carry @added, @removed, or @renamedFrom decorators, so the versioning metadata does not describe what actually happened between the two versions.
      - The agent does NOT claim that a linter rule would have caught this. Backward compatibility is not linted on the data plane - `non-breaking-versioning` is disabled in the data-plane ruleset - and asserting otherwise misleads the service author into trusting CI.
      - Findings are anchored to specific line numbers in the new version.
