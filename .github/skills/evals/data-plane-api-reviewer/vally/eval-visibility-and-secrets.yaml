name: data-plane-api-reviewer-eval-visibility-and-secrets
description: |
  Visibility, mutability, and secret-exposure tests for the data-plane API
  reviewer. Covers DP-VIS-01 through DP-VIS-06 and cross-links the
  cross-cutting SEC-SECRET-DETECT signals in references/secret-detection.md.
  See references/data-plane-visibility-and-secrets.md.

  Secret exposure is one of the few areas where a Blocking finding is
  expected rather than discouraged.

tags:
  area: data-plane-api-reviewer

defaults:
  runs: 1
  timeout: "420s"
  # Keep equal to the top-level `model:` in .github/workflows/data-plane-api-review.md.
  model: gpt-5.6-sol
  judge_model: claude-sonnet-4.6

scoring:
  threshold: 0.7

stimuli:
  - name: secret-readable-and-reachable-from-list
    environment:
      skills:
        - "../../../azure-api-review"
      files:
        - src: "../fixtures/typespec-data-plane/visibility-and-secrets.tsp"
          dest: "specification/connectorregistry/data-plane/Contoso.ConnectorRegistry/stable/2026-01-01/connectors.tsp"
    prompt: >
      Review the following data-plane TypeSpec specification for compliance with
      the Azure REST API Guidelines, paying particular attention to secret
      handling and property visibility. This is a new service introducing its
      first stable API version. Report findings with rule IDs, line numbers, and
      fix suggestions.

      File: specification/connectorregistry/data-plane/Contoso.ConnectorRegistry/stable/2026-01-01/connectors.tsp
    constraints:
      expect_skills:
        - azure-api-review
    graders:
      - type: output-matches
        name: "reports secret exposure"
        config:
          pattern: "\\*\\*\\[DP-VIS-0[0-9]\\]"
      - type: output-matches
        name: "raises secret exposure at blocking severity"
        config:
          pattern: "(?is)^\\s*#{1,6}[^\\n]*\\bBlocking\\b[^\\n]*\\n(?:(?!\\s*#{1,6})[^\\n]*\\n)*?\\s*(?:[-*+]\\s*|\\d+[.)]\\s*)?\\*\\*\\[[A-Z][A-Za-z0-9]*(?:-[A-Za-z0-9]+)+\\]"
      - type: prompt
    rubric:
      - The agent identifies the credential-bearing properties - the API key and the connection string - and reports that they are readable on GET and reachable from the list response.
      - The agent raises secret exposure at Blocking severity. This is one of the few areas where Blocking is the correct calibration, and under-reporting it is a failure.
      - The agent recommends a concrete fix - restricting the property to create-and-update visibility, marking it @secret, returning it only from a dedicated list-keys style operation, or omitting it from the resource entirely.
      - The agent specifically calls out that a secret reachable from a list operation is worse than one reachable from a get, because a single call over the collection harvests every credential at once.
      - Findings are anchored to specific line numbers and property names.

  - name: write-only-non-secret-and-server-assigned-properties
    environment:
      skills:
        - "../../../azure-api-review"
      files:
        - src: "../fixtures/typespec-data-plane/visibility-and-secrets.tsp"
          dest: "specification/connectorregistry/data-plane/Contoso.ConnectorRegistry/stable/2026-01-01/connectors.tsp"
    prompt: >
      Review the following data-plane TypeSpec specification for compliance with
      the Azure REST API Guidelines, paying particular attention to property
      visibility, mutability, and round-trip behavior. This is a new service
      introducing its first stable API version. Report findings with rule IDs,
      line numbers, and fix suggestions.

      File: specification/connectorregistry/data-plane/Contoso.ConnectorRegistry/stable/2026-01-01/connectors.tsp
    constraints:
      expect_skills:
        - azure-api-review
    graders:
      - type: output-matches
        name: "reports visibility findings"
        config:
          pattern: "\\*\\*\\[DP-VIS-0[0-9]\\]"
      - type: prompt
    rubric:
      - The agent identifies the write-only non-secret property - a display name the caller can set but never read back - and explains that it breaks GET-then-PUT round-tripping and makes the configured value undiscoverable.
      - The agent identifies server-assigned properties that are writable - the creation timestamp and the entity tag - and recommends restricting them to read visibility.
      - The agent identifies the property that is both optional and nullable with no stated difference between absent and explicitly null, and asks for the semantics to be documented or the nullability removed.
      - The agent recommends @visibility(Lifecycle.*) as the mechanism, and does NOT recommend x-ms-mutability, which is an ARM resource-manager construct.
      - Findings are anchored to specific line numbers and property names.

  - name: single-write-only-property-without-padding
    environment:
      skills:
        - "../../../azure-api-review"
      files:
        - src: "../fixtures/typespec-data-plane/notification-routing.tsp"
          dest: "specification/notificationrouting/data-plane/Contoso.NotificationRouting/stable/2026-01-01/routes.tsp"
    prompt: >
      Review the following data-plane TypeSpec specification for compliance with
      the Azure REST API Guidelines, paying particular attention to property
      visibility and round-trip behavior. This is a new service introducing its
      first stable API version. Report findings with rule IDs, line numbers, and
      fix suggestions.

      File: specification/notificationrouting/data-plane/Contoso.NotificationRouting/stable/2026-01-01/routes.tsp
    constraints:
      expect_skills:
        - azure-api-review
    graders:
      - type: output-matches
        name: "reports the durable write-only property"
        config:
          pattern: "\\*\\*\\[DP-VIS-01\\]"
      - type: output-not-matches
        name: "does not over-escalate the write-only property"
        config:
          pattern: "(?is)^\\s*#{1,6}[^\\n]*\\bBlocking\\b[^\\n]*\\n(?:(?!\\s*#{1,6})[^\\n]*\\n)*?\\s*(?:[-*+]\\s*|\\d+[.)]\\s*)?\\*\\*\\[[A-Z][A-Za-z0-9]*(?:-[A-Za-z0-9]+)+\\]"
      - type: output-not-matches
        name: "does not pad beyond the one supported finding"
        config:
          # Start at the report boundary, stop before `### Questions`, and count
          # only bold-bracketed IDs at line start -- the same finding position
          # used by run-evals.ps1. Two such lines mean at least one padded
          # finding; question bullets are deliberately outside this threshold.
          pattern: "(?s)^(?:(?!\\r?\\n\\s*#{1,6}\\s*Questions\\b).)*(?:^|\\r?\\n)\\s*\\*\\*\\[[A-Z][A-Za-z0-9]*(?:-[A-Za-z0-9]+)+\\][^\\r\\n]*(?:(?!\\r?\\n\\s*#{1,6}\\s*Questions\\b).)*(?:\\r?\\n)\\s*\\*\\*\\[[A-Z][A-Za-z0-9]*(?:-[A-Za-z0-9]+)+\\]"
      - type: prompt
    rubric:
      - The agent reports exactly one finding outside the Questions section, under DP-VIS-01 at Warning severity, for `routingLabel`.
      - The property is durable configuration that the service stores and copies into audit records. It is not a secret or a one-shot input, so accepting it on create and update while never returning it prevents GET-then-PUT round-tripping and makes the configured value undiscoverable after a caller loses local state.
      - The rationale is plausible but insufficient. Caller ownership and response-size reduction do not make a stored setting readable, and calling the service copy non-authoritative conflicts with the service using that copy for delivery audit records.
      - "Every adjacent surface is conventional and adequately documented: the resource has a complete CRUD and list lifecycle, its key and timestamps have correct visibility, its URL uses the `url` scalar, and its union is extensible. A second Blocking, Warning, or Suggestion finding is padding and fails the stimulus."
      - Plain bullets under `### Questions` do not count toward the one-finding threshold, matching the finding counter in `run-evals.ps1`.
