name: openai-typespec-update-eval
description: Evaluation suite for the openai-typespec-update skill
type: capability

environment: azsdk-mcp-mock

tags:
  area: openai-typespec-update
  type: ci-gate

config:
  runs: 3
  timeout: "90s"
  model: gpt-5.4
  executor: copilot-sdk

scoring:
  threshold: 0.8

stimuli:
  - name: exact-install-001
    prompt: "This repo's package.json references @azure-tools/openai-typespec with catalog:. How do I update it to the latest version with an exact pin (no caret) while keeping catalog: in the manifest?"
    environment:
      skills:
        - ..
    graders:
      - type: output-contains
        config:
          substring: "@azure-tools/openai-typespec"
      - type: output-contains
        config:
          substring: "pnpm-workspace.yaml"
      - type: output-contains
        config:
          substring: "pnpm install"

  - name: warn-on-caret-001
    prompt: 'Our package.json uses catalog: for @azure-tools/openai-typespec, but pnpm-workspace.yaml sets its catalog entry to "^1.11.0". Update guidance for this package.'
    environment:
      skills:
        - ..
    graders:
      - type: output-contains
        config:
          substring: "pnpm-workspace.yaml"
      - type: output-matches
        config:
          pattern: "(?i)warn"
      - type: output-contains
        config:
          substring: "^1.11.0"

  - name: pinned-version-001
    prompt: "Update @azure-tools/openai-typespec to exactly 1.28.0. Keep the version in the default pnpm catalog and retain catalog: in package.json."
    environment:
      skills:
        - ..
    graders:
      - type: output-contains
        config:
          substring: "@azure-tools/openai-typespec"
      - type: output-contains
        config:
          substring: "pnpm-workspace.yaml"
      - type: output-contains
        config:
          substring: "1.28.0"
      - type: output-contains
        config:
          substring: "pnpm install"
