steps:
  - script: |
      set -e
      BRANCH="${SKILL_BRANCH:-}"
      if [ "$BRANCH" = '$(SkillBranch)' ]; then
        BRANCH=""
      fi
      if [ -z "$BRANCH" ]; then
        echo "SkillBranch not set; keep current checked-out skill files."
        exit 0
      fi

      BRANCH_REF="$BRANCH"
      case "$BRANCH_REF" in
        refs/heads/*)
          ;;
        refs/remotes/origin/*)
          BRANCH_REF="refs/heads/${BRANCH_REF#refs/remotes/origin/}"
          ;;
        origin/*)
          BRANCH_REF="refs/heads/${BRANCH_REF#origin/}"
          ;;
        refs/*)
          ;;
        *)
          BRANCH_REF="refs/heads/$BRANCH_REF"
          ;;
      esac

      echo "Overlaying azure-typespec-assessment skill from: $BRANCH_REF"
      git fetch origin "$BRANCH_REF"
      rm -rf .github/skills/azure-typespec-assessment/SKILL.md \
             .github/skills/azure-typespec-assessment/references
      git checkout FETCH_HEAD -- \
        .github/skills/azure-typespec-assessment/SKILL.md \
        .github/skills/azure-typespec-assessment/references
      echo "Skill source overlaid from $BRANCH_REF"
    displayName: 'Overlay skill source from SkillBranch (if set)'
    env:
      SKILL_BRANCH: $(SkillBranch)

  - script: |
      CACHE="$(Build.SourcesDirectory)/artifacts/specs-cache/azure-rest-api-specs"
      git clone --depth 1 --filter=blob:none --sparse \
        https://github.com/Azure/azure-rest-api-specs.git "$CACHE"
      git -C "$CACHE" sparse-checkout set specification/chaos
    displayName: "Prepare sparse specification repository"
