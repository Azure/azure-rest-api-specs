name: azure-typespec-assessment-eval
description: Routing and report-generation coverage for azure-typespec-assessment.
type: capability

tags:
  area: azure-typespec-assessment
  type: ci-gate

defaults:
  runs: 1
  timeout: "1200s"
  model: gpt-5.4
  judge_model: gpt-5.4
  executor: copilot-sdk

scoring:
  threshold: 0.8

stimuli:
  - name: invoke-pr-coordinator-first
    tags:
      behavior: assess-pr
    prompt: |
      Use azure-typespec-assessment to assess PR https://github.com/Azure/azure-rest-api-specs/pull/43308.
    environment:
      skills:
        - ..
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-assessment"]
      - type: prompt
        config:
          prompt: |
            Inspect the ordered transcript and tool arguments. The first
            operational command after loading the skill must invoke
            scripts/run-assessment-analysis.mjs with --pr and --output.
            Fail if the agent first runs separate gh pr, gh api, git status,
            git diff, git fetch, git worktree, dependency, glob, or project
            discovery commands. A failed direct coordinator invocation still
            passes the ordering requirement.
    constraints:
      max_turns: 3
      max_tokens: 100000

  - name: retain-pr-43308-html-report
    tags:
      behavior: report-rendering
    prompt: |
      Use azure-typespec-assessment to validate the supplied PR 43308 assessment
      fixture and render its final HTML report to output/assessment.html.
      Run scripts/validate-assessment.mjs and scripts/render-assessment-html.mjs
      against assessment.json. This is an existing-report replay, not a fresh
      source assessment.
    environment:
      files:
        - src: fixtures/assessments/43308.json
          dest: assessment.json
        - src: ../scripts
          dest: scripts
        - src: ../references
          dest: references
    graders:
      - type: skill-invocation
        config:
          required: ["azure-typespec-assessment"]
      - type: tool-calls
        config:
          required:
            - "^(powershell|bash)$"
      - type: run-command
        config:
          command: "node scripts/validate-assessment.mjs assessment.json"
          expected_exit_code: 0
      - type: run-command
        config:
          command: "node scripts/render-assessment-html.mjs assessment.json output/assessment.html"
          expected_exit_code: 0
      - type: file-exists
        config:
          path: "output/assessment.html"
      - type: file-matches
          path: "output/assessment.html"
        config:
          pattern: "FirewallPolicies\\.createOrUpdate"

