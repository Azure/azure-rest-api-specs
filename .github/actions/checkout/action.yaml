name: Checkout repository
description: Check out a repository with a pinned action and non-persistent credentials by default

inputs:
  repository:
    description: Repository owner/name to check out
    default: ${{ github.repository }}
  ref:
    description: Branch, tag, or SHA to check out. Empty preserves the upstream action's default selection.
    default: ""
  path:
    description: Relative path under GITHUB_WORKSPACE to place the repository
    default: ""
  fetch-depth:
    description: Number of commits to fetch. Use 0 for all history, branches, and tags.
    default: "1"
  sparse-checkout:
    description: Newline-separated sparse checkout patterns. Empty disables sparse checkout.
    default: ""
  sparse-checkout-cone-mode:
    description: Whether sparse checkout uses cone mode
    default: "true"
  persist-credentials:
    description: Keep Git credentials after checkout only when later Git operations require authentication
    default: "false"

outputs:
  commit:
    description: Commit SHA checked out
    value: ${{ steps.checkout.outputs.commit }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      id: checkout
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}
        fetch-depth: ${{ inputs.fetch-depth }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
        persist-credentials: ${{ inputs.persist-credentials }}
