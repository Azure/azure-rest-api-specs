name: Install dependencies for github-script actions
description: Installs production dependencies for a github-script workspace package

inputs:
  filter:
    description: "pnpm workspace filter selecting the workflow package (and its workspace dependencies) to install"
    required: false
    default: "azure-rest-api-specs-github..."
  cache:
    description: 'Whether to cache the pnpm store. Keep "false" for lean installs (~25 packages); set "true" for heavier opt-in packages.'
    required: false
    default: "false"
  cache-name:
    description: "Cache namespace when cache is enabled; use a distinct name per heavy package so caches do not overwrite each other"
    required: false
    default: "github-script"

runs:
  using: composite

  steps:
    - uses: ./.github/actions/setup-node-install-deps
      with:
        # actions/github-script@v9.0.0 uses Node 24
        node-version: 24.x
        # --config.trust-lockfile=true trusts the already-vetted committed lockfile and
        # skips pnpm's per-install supply-chain re-verification, which is cold on every CI
        # run and scales with total lockfile size (~2s here). It must be a CLI flag scoped
        # to this command: pnpm does not read trustLockfile from the npm_config_* env, and
        # the full installs in other workflows should keep verifying.
        install-command: "pnpm install --frozen-lockfile --prod --prefer-offline --config.trust-lockfile=true --filter=${{ inputs.filter }}"
        cache: ${{ inputs.cache }}
        cache-name: ${{ inputs.cache-name }}
