version: "0.2"
import:
  - ../cspell.yaml
ignorePaths:
  - CODEOWNERS*
  - arm-leases/**
  - policies/**
  - labels.yaml
  - labels/**
  - protected-labels.yml
  - workflows/*.lock.yml
  - workflows/**/*.md
words:
  - agentics
  - apiver
  - azmanager
  - brch
  - buildid
  - byval
  - contosowidget
  - contosowidgetmanager
  - dapr
  - dedented
  - dedenting
  - dedents
  - engsys
  - fflate
  - oapi
  - plcy
  - pwsh
  - retarget
  - rhysd
  - rpaa
  - rpaas
  - tsgs
  - unconfigured
  - unstub
  - vitest
  - whatif
  - zizmor
  - zizmorcore

overrides:
  - filename: "**/.github/workflows/src/protected-files.ts"
    words:
      - nocase

  - filename: "**/.github/workflows/test/protected-files.test.ts"
    words:
      - gpgsign

  - filename: "**/.github/chatmodes/api-review-feedback.chatmode.md"
    words:
      - Swathi
      - Pillalamarri

  - filename: "**/.github/workflows/oav-runner-tests.yaml"
    words:
      - oavrunnertests

  - filename: "**/.github/workflows/src/spec-gen-sdk-status.ts"
    words:
      - incompleted

  - filename: "**/.github/workflows/src/summarize-checks/tsgs.ts"
    words:
      - efer
      - rphelp

  - filename: "**/.github/workflows/src/summarize-checks/labelling.ts"
    words:
      - unlabels
      - rpaa
      # This spelling may be a bug
      - rpass

  - filename: "**/.github/skills/azure-api-review/references/design-decisions.md"
    words:
      - afec

  - filename: "**/.github/copilot-review-instructions.md"
    words:
      - foos

  - filename: "**/.github/agents/arm-api-reviewer.agent.md"
    words:
      - reposting

  - filename: "**/.github/skills/evals/arm-api-reviewer/vally/*.yaml"
    words:
      - classsvc
      - cleansvc
      - cnatestsvc
      - delsvc
      - descrsvc
      - enumsvc
      - exsvc
      - fmtsvc
      - gadgetsvc
      - handwrittensvc
      - inlinesvc
      - itemsvc
      - legacysvc
      - lrosvc
      - namingsvc
      - nosupprsvc
      - proxysvc
      - reqpropsvc
      - secsupprsvc
      - secretsvc
      - tspgenservice
      - typechgsvc
      - widgetsvc

  - filename: "**/.github/skills/evals/arm-api-reviewer/README.md"
    words:
      - vally

  - filename: "**/.github/skills/evals/arm-api-reviewer/run-evals.ps1"
    words:
      - vally

  - filename: "**/.github/skills/README.md"
    words:
      - vally
  - filename: "**/.github/workflows/sdk-breaking-change-analysis.yaml"
    words:
      - golangci
      - GOPATH
      - ltrimstr
      - ghtools
      - Eeuo
